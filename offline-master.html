function prep(c){
  if(!c) return null;
  var m = CH[c.id]; if(!m) return null;
  var LW = m[0], H = m[1];
  /* 宽度必须取父容器的可用宽度，不能取 canvas 自身：
     canvas 一旦被写入 style.width，就会把父容器撑开，clientWidth 随之变大，形成自锁。
     因此测量前先把 canvas 的 CSS 宽度归零，让父容器回到真实可用宽度。 */
  var host = c.parentNode;
  c.style.width = '0px';
  var w = 0;
  if(host){
    /* clientWidth 含 padding，必须扣掉左右内边距，否则画布比内容区宽，会被 max-width 二次压缩 */
    var hs = getComputedStyle(host);
    w = host.clientWidth - (parseFloat(hs.paddingLeft) || 0) - (parseFloat(hs.paddingRight) || 0);
  }
  if(!w || w < 60) w = LW;
  /* 图表按 800 逻辑宽绘制，字号在里面。若压缩到手机宽度，字会小到看不清，
     因此设下限，宁可让 .chart-box 横向滑动，也要保住可读字号。 */
  var MINW = 620;
  if(w < MINW) w = Math.min(MINW, LW);
  if(c._w === w){
    /* 尺寸没变，恢复原宽度即可，无需重绘 */
    c.style.width = w + 'px';
    return null;
  }
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var scale = w / LW;
  c.width = Math.round(w * dpr);
  c.height = Math.round(H * scale * dpr);
  /* 位图按 dpr 放大保证清晰，CSS 尺寸锁定到 w */
  c.style.width = w + 'px';
  c.style.height = (H * scale) + 'px';
  /* 允许比容器宽：超出部分由 .chart-box 横向滚动承接，不能用 max-width 压回去 */
  c.style.maxWidth = 'none';
  var ctx = c.getContext('2d');
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);

  c._w = w;

     环形/曲线/树状图是居中构图，居中显示才不空半边；

  if(host && host.scrollWidth > host.clientWidth + 1){

function rrect(ctx,x,y,w,h,r){

function drawNPV(){
  var p=prep(document.getElementById('npvCurve')); if(!p) return;
  var ctx=p.ctx, W=p.W, H=p.H;
  var pl=72, pb=44, pt=26, pr=30;
  var pw=W-pl-pr, ph=H-pt-pb;
  var inv=1000000, cf=280000, n=6, maxR=0.30;
  var pts=[], maxV=-1e9, minV=1e9;
  for(var rr=0; rr<=maxR+0.001; rr+=0.01){
    var pv=0; for(var t=1;t<=n;t++) pv+=cf/Math.pow(1+rr,t);
    var v=pv-inv; pts.push({r:rr,v:v});
    if(v>maxV) maxV=v; if(v<minV) minV=v;
  }
  var range=maxV-minV;
  function X(r){ return pl+pw*r/maxR; }
  function Y(v){ return pt+ph*0.1+ph*0.85*(maxV-v)/range; }
  ctx.strokeStyle='#a9c2d4'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pl,Y(0)); ctx.lineTo(W-pr,Y(0)); ctx.stroke();
  ctx.strokeStyle='#3a7076'; ctx.lineWidth=2; ctx.beginPath();
  pts.forEach(function(p2,i){ i===0?ctx.moveTo(X(p2.r),Y(p2.v)):ctx.lineTo(X(p2.r),Y(p2.v)); });
  ctx.stroke();
  var irr=0;
  for(var i=1;i<pts.length;i++){
    if(pts[i-1].v>0 && pts[i].v<=0){ irr=pts[i-1].r+(pts[i].r-pts[i-1].r)*pts[i-1].v/(pts[i-1].v-pts[i].v); break; }
  }
  ctx.fillStyle='#b04a33'; ctx.beginPath(); ctx.arc(X(irr),Y(0),4,0,7); ctx.fill();
  ctx.fillStyle='#b04a33'; ctx.font='600 12px "Source Han Serif SC","Songti SC",serif'; ctx.textAlign='center';
  ctx.fillText('IRR ≈ '+(irr*100).toFixed(1)+'%', X(irr), Y(0)+22);
  var v10=0; for(var t2=1;t2<=n;t2++) v10+=cf/Math.pow(1.10,t2); v10-=inv;
  if(v10>0){
    ctx.strokeStyle='#336f92'; ctx.setLineDash([3,3]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X(0.10),Y(0)); ctx.lineTo(X(0.10),Y(v10)); ctx.lineTo(pl,Y(v10)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#336f92'; ctx.beginPath(); ctx.arc(X(0.10),Y(v10),3.5,0,7); ctx.fill();
    ctx.textAlign='left'; ctx.font='11.5px "Microsoft YaHei",sans-serif';
    ctx.fillText('10% 时 NPV='+Math.round(v10).toLocaleString(), X(0.10)+8, Y(v10)-6);
  }
  ctx.strokeStyle='#cfe0ee'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pl,pt); ctx.lineTo(pl,pt+ph); ctx.lineTo(W-pr,pt+ph); ctx.stroke();
  ctx.fillStyle='#7e96a6'; ctx.font='11.5px "Microsoft YaHei",sans-serif'; ctx.textAlign='center';
  [0,0.1,0.2,0.3].forEach(function(r){ ctx.fillText((r*100)+'%', X(r), pt+ph+18); });
  ctx.fillText('折现率', W/2, H-8);
  ctx.save(); ctx.translate(18,H/2); ctx.rotate(-Math.PI/2); ctx.fillText('NPV（元）',0,0); ctx.restore();
}

function drawWACC(){
  var p=prep(document.getElementById('waccCurve')); if(!p) return;
  var ctx=p.ctx, W=p.W, H=p.H;
  var pl=64, pb=44, pt=26, pr=30;
  var pw=W-pl-pr, ph=H-pt-pb;
  var T=0.25, ke0=11.5, kd0=5.5;
  var pts=[];
  for(var wd=0; wd<=0.85; wd+=0.02){
    var kd=kd0+6*Math.pow(wd,2.4), ke=ke0+5*Math.pow(wd,2.0);
    pts.push({w:wd, v:wd*kd*(1-T)+(1-wd)*ke});
  }
  var minV=99, maxV=0, minW=0;
  pts.forEach(function(q){ if(q.v<minV){minV=q.v; minW=q.w;} if(q.v>maxV) maxV=q.v; });
  var rng=maxV-minV;
  function X(w){ return pl+pw*w/0.85; }
  function Y(v){ return pt+ph*0.08+ph*0.84*(v-minV)/rng; }
  ctx.strokeStyle='#e3edf5';
  for(var g=0;g<=4;g++){ var yy=pt+ph*g/4; ctx.beginPath(); ctx.moveTo(pl,yy); ctx.lineTo(W-pr,yy); ctx.stroke(); }
  ctx.strokeStyle='#3a7076'; ctx.lineWidth=2; ctx.beginPath();
  pts.forEach(function(q,i){ i===0?ctx.moveTo(X(q.w),Y(q.v)):ctx.lineTo(X(q.w),Y(q.v)); });
  ctx.stroke();
  ctx.strokeStyle='#b04a33'; ctx.setLineDash([3,3]); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(X(minW),pt+ph); ctx.lineTo(X(minW),Y(minV)); ctx.lineTo(pl,Y(minV)); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='#b04a33'; ctx.beginPath(); ctx.arc(X(minW),Y(minV),4,0,7); ctx.fill();
  ctx.font='600 12px "Source Han Serif SC","Songti SC",serif'; ctx.textAlign='left';
  ctx.fillText('最优负债率 ≈ '+Math.round(minW*100)+'%　WACC ≈ '+(minV*100).toFixed(2)+'%', X(minW)+10, Y(minV)-8);
  ctx.strokeStyle='#cfe0ee'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pl,pt); ctx.lineTo(pl,pt+ph); ctx.lineTo(W-pr,pt+ph); ctx.stroke();
  ctx.fillStyle='#7e96a6'; ctx.font='11.5px "Microsoft YaHei",sans-serif'; ctx.textAlign='center';
  [0,0.2,0.4,0.6,0.8].forEach(function(w){ ctx.fillText(Math.round(w*100)+'%', X(w), pt+ph+18); });
  ctx.fillText('负债占比 Wd', W/2, H-8);
  ctx.save(); ctx.translate(18,H/2); ctx.rotate(-Math.PI/2); ctx.fillText('WACC',0,0); ctx.restore();
}

function _poly(ctx, pts, stroke, fill){
  if(!pts.length) return;
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1.6; ctx.stroke(); }
}

  var labels=['盈利','成长','营运','偿债','现金流'];
  var a=[0.75,0.55,0.80,0.65,0.70], b=[0.60,0.50,0.62,0.60,0.58];
  var n=5;
  ctx.strokeStyle='#dfeaf3';ctx.lineWidth=1;
  [0.25,0.5,0.75,1].forEach(function(t){
    ctx.beginPath();
    for(var i=0;i<n;i++){
      var ang=-Math.PI/2+i*2*Math.PI/n, x=cx+R*t*Math.cos(ang), y=cy+R*t*Math.sin(ang);
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);

  });
  for(var i=0;i<n;i++){

    var pts=[];

      pts.push([cx+R*s[0][i]*Math.cos(ang),cy+R*s[0][i]*Math.sin(ang)]);

var _rsz;

<script>
/* ============================================================
   导航：侧栏（按 REG 生成）/ 章节切换 / 搜索 / 面板 / 首页

  var ROUTES = [

      +'<div class="home-sec"><h2><span class="sec-no">叁</span> 今日一图</h2><p>先把时间价值看明白，后面的估值和配置都站在这块地基上。</p>'

    Array.prototype.forEach.call(home.querySelectorAll('.route-card'), function(c){
      c.addEventListener('click', function(){ go(c.getAttribute('data-start')); });
    });
    Array.prototype.forEach.call(home.querySelectorAll('.vol-chip'), function(c){

        var v=+c.getAttribute('data-vol');
        var first=REG.filter(function(r){return r.v===v;})[0];

    Array.prototype.forEach.call(home.querySelectorAll('.ov-lane a,.ladder-mini a'), function(a){
      a.addEventListener('click', function(){ go(a.getAttribute('data-id')); });

    Array.prototype.forEach.call(home.querySelectorAll('.lm-all'), function(b){

  function goHome(){

    Array.prototype.forEach.call(document.querySelectorAll('.nav-item'), function(it){
      it.classList.remove('active');

  /* ---------- 章节切换 ---------- */

    if(!target) return;
    REG.forEach(function(x){ var s=secOf(x.id); if(s) s.classList.remove('active'); });

    var home = document.getElementById('home'); if(home) home.classList.add('hide');
    var cf = document.getElementById('cfoot'); if(cf) cf.style.visibility='visible';

    Array.prototype.forEach.call(document.querySelectorAll('.nav-item'), function(it){
      var on = it.getAttribute('data-id')===id;
      it.classList.toggle('active', on);
      it.style.borderLeftColor = on ? (r.l==='入'?'var(--green)':r.l==='进'?'var(--purple)':'var(--red)') : 'transparent';

    var actNav = document.querySelector('.nav-item.active');
    var navBox = document.getElementById('sbnav');

  var prevBtn=document.getElementById('prevBtn'), nextBtn=document.getElementById('nextBtn');
  if(prevBtn) prevBtn.addEventListener('click', function(){ if(window.CUR>0) go(REG[window.CUR-1].id); });
  if(nextBtn) nextBtn.addEventListener('click', function(){ if(window.CUR<REG.length-1) go(REG[window.CUR+1].id); });

  var ovb=document.getElementById('ovTopBtn'); if(ovb) ovb.addEventListener('click', function(){ if(window.ovOpen) window.ovOpen(); });

  /* ---------- 面板 ---------- */
  var searchPanel=document.getElementById('searchOverlay');
  var drawer=document.getElementById('fxDrawer');
  function openPanel(which){

  function closePanel(){

  window.openPanel=openPanel; window.closePanel=closePanel;
  document.addEventListener('click', function(e){

    if(b){ e.preventDefault(); openPanel(b.getAttribute('data-open')); }
    var kg=e.target.closest ? e.target.closest('[data-kg]') : null;

  });
  if(searchPanel) searchPanel.addEventListener('click', function(e){ if(e.target===searchPanel) closePanel(); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function(b){ b.addEventListener('click', closePanel); });

  /* ---------- 搜索 ---------- */
  var INDEX=[];
  function buildIndex(){
    REG.forEach(function(r){
      INDEX.push({id:r.id, n:r.n, t:r.t, text:r.t+' '+r.k.join(' ')+' '+window.regVolName(r.v), v:3});
    });
    Array.prototype.forEach.call(document.querySelectorAll('.chapter'), function(sec){
      var id=sec.getAttribute('data-id'), r=byId[id]; if(!r) return;
      sec.querySelectorAll('h3,h4,p,li,td,th,.card-t,.formula').forEach(function(el){
        var t=(el.textContent||'').replace(/\s+/g,' ').trim();

  window.renderSearch=function(){
    var res=document.getElementById('searchRes'), inp=document.getElementById('searchInput');
    if(!res||!inp) return;
    var q=inp.value.trim().toLowerCase();
    if(!q){ res.innerHTML='<div class="search-empty">输入关键词，搜索全部 100 个节点</div>'; return; }
    var hits=[], seen={};
    INDEX.forEach(function(it){
      if(it.text.toLowerCase().indexOf(q)>=0 && !seen[it.id+it.t]){
        seen[it.id+it.t]=1; hits.push(it);
      }
    });
    hits.sort(function(a,b){ return b.v-a.v || a.n-b.n; });
    res.innerHTML=hits.slice(0,40).map(function(it,i){
      return '<div class="search-row'+(i===0?' on':'')+'" data-id="'+it.id+'"><b>'+pad2(it.n)+'</b><span>'+it.t+'</span></div>';
    }).join('') || '<div class="search-empty">没有匹配结果</div>';
    Array.prototype.forEach.call(res.querySelectorAll('.search-row'), function(row){
      row.addEventListener('click', function(){ closePanel(); go(row.getAttribute('data-id')); });

  /* ---------- 键盘 / 滚动 ---------- */
  document.addEventListener('keydown', function(e){

    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPanel('search'); return; }
    if(e.key==='Escape'){ closePanel(); document.body.classList.remove('nav-open'); return; }

  },{passive:true});
  var toTop=document.getElementById('toTop');
  if(toTop) toTop.addEventListener('click', function(){ window.scrollTo({top:0,behavior:'smooth'}); });

  /* ---------- 打印时展开 ---------- */
  window.addEventListener('beforeprint', function(){

<script>
/* ============================================================
   启动：REG 一致性自检 + 骨架章节自动生成 + 首页初始化
   ============================================================ */
(function(){
  var REG = window.REG;
  if(!REG || !REG.length){ warn('章表未加载'); return; }
  function warn(msg){
    var w=document.getElementById('bootWarn');
    if(w){ w.style.display='block'; w.textContent='页面自检未通过：'+msg; }
  }

  /* ---------- 一致性自检 ---------- */
  function check(){
    var ids={}, errs=[];
    REG.forEach(function(r){
      if(ids[r.id]) errs.push('重复 id：'+r.id);
      ids[r.id]=r;
      if(!window.VOLS[r.v-1]) errs.push('未知卷号：'+r.id);
      if(['入','进','高'].indexOf(r.l)<0) errs.push('未知难度：'+r.id);
      if(['完','骨'].indexOf(r.d)<0) errs.push('未知深度：'+r.id);
    });
    REG.forEach(function(r){
      r.p.forEach(function(id){ if(!ids[id]) errs.push('前置不存在：'+r.id+' ← '+id); });
      r.rel.forEach(function(id){ if(!ids[id]) errs.push('延伸不存在：'+r.id+' → '+id); });
    });
    /* 环检测 */
    var color={};
    function dfs(id, stack){
      if(color[id]===1){ errs.push('前置关系成环：'+stack.concat(id).join(' → ')); return; }
      if(color[id]===2) return;
      color[id]=1;
      var r=ids[id];
      if(r) r.p.forEach(function(p){ dfs(p, stack.concat(id)); });
      color[id]=2;
    }
    REG.forEach(function(r){ dfs(r.id, []); });
    return errs;
  }
  var errs=check();
  if(errs.length){ warn(errs.slice(0,5).join('；')); }

  /* ---------- 骨架章自动生成 ---------- */
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function pad2(n){ n=String(n); return n.length<2?'0'+n:n; }
  function skeletons(){
    var frag=document.createDocumentFragment();
    var made=0;
    REG.forEach(function(r){
      if(r.d!=='骨') return;
      if(document.querySelector('.chapter[data-id="'+r.id+'"]')) return;
      var volName=window.regVolName(r.v);
      var pre=r.p.map(function(id){ var x=window.regById(id); return x?pad2(x.n)+' '+x.t:null; }).filter(Boolean).join('、')||'无';
      var rel=r.rel.map(function(id){ var x=window.regById(id); return x?pad2(x.n)+' '+x.t:null; }).filter(Boolean).join('、')||'待补充';
      var notes = (window.SKELETON_NOTES && window.SKELETON_NOTES[r.id]) || r.k;
      var pts = notes && notes.length ? notes.map(function(k){ return '<li>'+esc(k)+'</li>'; }).join('') : '<li>本章要点将在后续批次展开。</li>';
      var sec=document.createElement('section');
      sec.className='chapter';
      sec.setAttribute('data-id',r.id);
      sec.innerHTML=
        '<div class="chead"><span class="chnum">'+pad2(r.n)+'</span><div class="chead-body">'
        +'<div class="kicker">卷'+['一','二','三','四','五','六','七','八','九','十','十一','十二'][r.v-1]+' · '+esc(volName)+'　'+window.regLevelName(r.l)+' · '+window.regAudienceName(r.a)+'</div>'
        +'<h2>'+esc(r.t)+'</h2><div class="desc">骨架节点：已建立与全书的位置关系，正文在后续批次展开</div></div></div>'
        +'<div class="path-strip">前置：'+esc(pre)+'　|　当前：<b>'+esc(r.t)+'</b>　|　延伸：'+esc(rel)+'</div>'
        +'<h3>先记住这几件事</h3><ul class="bone-list">'+pts+'</ul>'
        +'<div class="bone-note">这是骨架章：概念、公式与例题将在后续批次补入，当前可先通过前置与延伸节点理解它在全书中的位置。此处内容仅作教学说明。</div>';
      frag.appendChild(sec);
      made++;
    });
    var main=document.getElementById('main');
    if(main && made) main.appendChild(frag);
    return made;
  }
  window.SKELETON_COUNT=skeletons();

  /* ---------- 章头视觉印记 ---------- */
  if(window.VISUALS){
    Array.prototype.forEach.call(document.querySelectorAll('.chapter .chead'), function(head){
      if(head.querySelector('.ch-mark')) return;
      var sec=head.parentNode;
      var r=window.regById(sec && sec.getAttribute('data-id'));
      if(!r) return;
      var wrap=document.createElement('div');
      wrap.className='ch-mark-wrap';
      wrap.innerHTML=window.VISUALS.chapterMark(r);
      head.appendChild(wrap);
    });
  }

  var em=document.getElementById('kgCount');
  if(em) em.textContent=REG.length+' 个知识点';

  if(typeof window.goHome==='function') window.goHome();
  if(!errs.length) window.bootOK=true;
  window.bootErrors=errs;
})();

<script>
/* ============================================================
   学习总览：三泳道（入门 / 进阶 / 高阶）+ 章内「在全书中的位置」
   数据源：js/registry.js 的 REG，不在别处重复维护章目
   ============================================================ */
(function(){
  var REG = window.REG;
  var byId = {};
  REG.forEach(function(r){ byId[r.id] = r; });
  var overlay=document.getElementById('ovOverlay');
  var body=document.getElementById('ovBody');
  var btn=document.getElementById('ovBtn');
  var closeBtn=document.getElementById('ovClose');
  function pad2(n){ n=String(n); return n.length<2?'0'+n:n; }

  function link(id, cls){
    var r=byId[id];
    var a=document.createElement('a');
    a.setAttribute('data-id',id);
    if(cls) a.className=cls;
    a.innerHTML='<i>'+pad2(r?r.n:0)+'</i>'+(r?r.t:id);
    a.addEventListener('click', function(){
      close();
      if(typeof window.go==='function') window.go(id);
    });
    return a;
  }

  function buildLanes(){
    if(!body) return;
    var html='';
    ['入','进','高'].forEach(function(lv){
      var items=REG.filter(function(r){ return r.l===lv; });
      var links=items.map(function(r){
        return '<a data-id="'+r.id+'" class="'+(r.d==='骨'?'bone':'')+'"><i>'+pad2(r.n)+'</i>'+r.t+'</a>';
      }).join('');
      html+='<div class="ov-lane lv-'+lv+'"><h5>'+window.regLevelName(lv)+'　'+items.length+' 节点</h5>'+links+'</div>';
    });
    html+='<div class="ov-lane"><h5>按卷浏览</h5>';
    window.VOLS.forEach(function(name,i){
      var v=i+1, count=REG.filter(function(r){ return r.v===v; }).length;
      html+='<div class="ov-vol"><b>卷'+['一','二','三','四','五','六','七','八','九','十','十一','十二'][i]+' · '+name+'</b>　'+count+' 节</div>';
    });
    html+='</div>';
    body.innerHTML='<div class="ov-lanes">'+html+'</div>'
      +'<div class="ov-footnote">实心章为完整课文，标注「骨架」的章已列出要点与前置关系，后续批次逐步展开。箭头关系可在知识图谱中查看。</div>';
    Array.prototype.forEach.call(body.querySelectorAll('a[data-id]'), function(a){
      a.addEventListener('click', function(){
        close();
        if(typeof window.go==='function') window.go(a.getAttribute('data-id'));
      });
    });
  }

  function cardFor(r){
    if(!r) return null;
    var card=document.createElement('div');
    card.className='poscard';
    var h=document.createElement('div'); h.className='pos-h'; h.textContent='在全书中的位置'; card.appendChild(h);
    var where=document.createElement('div'); where.className='pos-where';
    where.innerHTML='卷'+['一','二','三','四','五','六','七','八','九','十','十一','十二'][r.v-1]+' · '+window.regVolName(r.v)
      +'　<b>第 '+pad2(r.n)+' / 100 章</b>　<span class="lv '+r.l+'">'+window.regLevelName(r.l)+'</span>'
      +'<span class="au">'+window.regAudienceName(r.a)+'</span>';
    card.appendChild(where);
    var row=document.createElement('div'); row.className='pos-links';
    if(r.p.length){
      var s1=document.createElement('span'); s1.textContent='前置'; row.appendChild(s1);
      r.p.forEach(function(id){ row.appendChild(link(id)); });
    }
    if(r.rel.length){
      var s2=document.createElement('span'); s2.textContent='延伸'; row.appendChild(s2);
      r.rel.forEach(function(id){ row.appendChild(link(id)); });
    }
    if(row.childNodes.length) card.appendChild(row);
    return card;
  }

  REG.forEach(function(r){
    var sec=document.querySelector('.chapter[data-id="'+r.id+'"]');
    if(!sec) return;
    var card=cardFor(r);
    if(card) sec.appendChild(card);
  });

  window.updatePoscard=function(id){ /* 位置卡随章节静态生成，切换章节时无需重建 */ };

  function open(){ if(overlay) overlay.classList.add('open'); }
  function close(){ if(overlay) overlay.classList.remove('open'); }
  window.ovOpen=open; window.ovClose=close;
  if(btn) btn.addEventListener('click', open);
  if(closeBtn) closeBtn.addEventListener('click', close);
  if(overlay) overlay.addEventListener('click', function(e){ if(e.target===overlay) close(); });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && overlay && overlay.classList.contains('open')) close();
  });

  buildLanes();
})();

</script>
<script>
/* ============================================================
   kg2d.js —— 知识点网络 · 2D 环形图谱 + 公共面板逻辑
   依赖：registry.js（REG / VOLS / regById / regVolName ...）
   零依赖、无构建、不写 localStorage。
   与 kg3d.js 共同装配 window.KG：本文件提供核心方法与 2D 渲染，
   kg3d.js 在其后加载并挂上 open3d/close3d/redraw3d/goTo3d 等钩子。
   ============================================================ */
(function(){
  'use strict';

  var REG = window.REG || [];
  var NS  = 'http://www.w3.org/2000/svg';
  var COLORS = { '入':'#336f92', '进':'#3a7076', '高':'#b04a33' };
  var CX = 500, CY = 360;

  var KG = window.KG = window.KG || {};
  KG.mode = KG.mode || '2d';
  KG.currentId = KG.currentId || null;
  KG._state = KG._state || { vol:0, query:'' };

  /* ---------- 通用小工具 ---------- */
  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }
  function cls(el, name, on){
    if(!el) return;
    if(on) el.classList.add(name); else el.classList.remove(name);
  }
  function closestCls(el, name){
    while(el && el !== document){
      if(el.classList && el.classList.contains(name)) return el;
      el = el.parentNode;
    }
    return null;
  }
  function colorOf(r){ return COLORS[r.l] || '#336f92'; }
  function sv(tag, attrs, parent){
    var e = document.createElementNS(NS, tag);
    if(attrs) for(var k in attrs){ if(attrs.hasOwnProperty(k)) e.setAttribute(k, attrs[k]); }
    if(parent) parent.appendChild(e);
    return e;
  }
  function regById(id){ return window.regById ? window.regById(id) : null; }

  /* ---------- 共享可见性（卷筛选 + 搜索） ---------- */
  function isVisible(id){
    var m = KG._visibleMap;
    return !m || m[id] === true;
  }
  KG._isVisible = isVisible;

  KG._applyFilter = function(){
    var vol = KG._state.vol || 0;
    var q = (KG._state.query || '').trim().toLowerCase();
    var near = {};
    var i, r;
    if(vol){
      for(i=0;i<REG.length;i++){
        r = REG[i];
        if(r.v === vol) near[r.id] = true;
      }
      for(i=0;i<REG.length;i++){
        r = REG[i];
        if(r.v === vol){
          r.p.concat(r.rel).forEach(function(id){ near[id] = true; });
        }
      }
    }
    var map = {};
    for(i=0;i<REG.length;i++){
      r = REG[i];
      var okVol = !vol || !!near[r.id];
      var okQuery = !q || String(r.n) === q ||
        r.t.toLowerCase().indexOf(q) >= 0 || r.id.toLowerCase().indexOf(q) >= 0;
      map[r.id] = okVol && okQuery;
    }
    KG._visibleMap = map;

    var chips = $('kgChips') ? $('kgChips').querySelectorAll('button') : [];
    for(i=0;i<chips.length;i++){
      var active = Number(chips[i].getAttribute('data-v')) === vol;
      cls(chips[i], 'on', active);
      chips[i].style.borderColor = active ? '#b04a33' : 'var(--rule)';
      chips[i].style.color = active ? '#b04a33' : 'var(--ink2)';
    }
    var groups = $('kgList') ? $('kgList').querySelectorAll('.kg-g') : [];
    for(i=0;i<groups.length;i++){
      cls(groups[i], 'active', Number(groups[i].getAttribute('data-v')) === vol);
    }
    var links = $('kgList') ? $('kgList').querySelectorAll('.kg-link') : [];
    for(i=0;i<links.length;i++){
      cls(links[i], 'hide', !map[links[i].getAttribute('data-id')]);
    }
    if(KG._paint2d) KG._paint2d();
  };

  KG._setVol = function(v){
    v = Number(v) || 0;
    KG._state.vol = (KG._state.vol === v) ? 0 : v;
    KG._applyFilter();
  };

  /* ---------- 侧栏分组 / 卷 chips ---------- */
  function renderChips(){
    var box = $('kgChips');
    if(!box) return;
    var html = '<button type="button" data-v="0">全部</button>';
    for(var v=1; v<=12; v++){
      html += '<button type="button" data-v="' + v + '">' +
        (v < 10 ? '0' + v : v) + ' ' + esc(window.regVolName(v)) + '</button>';
    }
    box.innerHTML = html;
    // 桌面端默认隐藏 chips，这里显式放开；桌面另可用左侧卷标题筛选。
    box.style.display = 'flex';
    box.style.flexWrap = 'nowrap';
    box.style.overflowX = 'auto';
    if(window.innerWidth > 900) box.style.maxWidth = '52vw';
    var btns = box.querySelectorAll('button');
    for(var i=0;i<btns.length;i++){
      var b = btns[i];
      b.style.fontFamily = 'var(--sans)';
      b.style.fontSize = '10px';
      b.style.letterSpacing = '.6px';
      b.style.color = 'var(--ink2)';
      b.style.border = '1px solid var(--rule)';
      b.style.background = 'var(--sheet)';
      b.style.padding = '3px 8px';
      b.style.whiteSpace = 'nowrap';
    }
  }

  function renderList(){
    var box = $('kgList');
    if(!box) return;
    var byVol = {};
    REG.forEach(function(r){ (byVol[r.v] = byVol[r.v] || []).push(r); });
    var html = '';
    for(var v=1; v<=12; v++){
      var list = byVol[v] || [];
      if(!list.length) continue;
      html += '<div class="kg-g" data-v="' + v + '">' +
        '<i class="dot" style="background:' + colorOf(list[0]) + '"></i>' +
        '<span>' + (v < 10 ? '0' + v : v) + ' · ' + esc(window.regVolName(v)) + '</span>' +
        '<b>' + list.length + '</b></div>';
      list.forEach(function(r){
        html += '<div class="kg-link" data-id="' + r.id + '" title="' + esc(r.t) + '">' +
          '<span style="color:' + colorOf(r) + '">' + r.n + '</span> ' + esc(r.t) + '</div>';
      });
    }
    box.innerHTML = html;
  }

  /* ---------- 详情面板（2D / 3D 共用） ---------- */
  function legendHTML(){
    return '<div class="kg-legend">' +
      '<div><i style="background:#336f92"></i>入门 · 零基础可读</div>' +
      '<div><i style="background:#3a7076"></i>进阶 · 经管学生</div>' +
      '<div><i style="background:#b04a33"></i>高阶 · 投资实操</div>' +
      '<div><i style="background:#fbfdff;border:1px solid #7e96a6"></i>空心圈 = 骨架要点</div>' +
      '<div><i style="background:#b04a33"></i>连线方向 = 前置 → 后续</div>' +
      '</div>';
  }
  function emptyHTML(){
    return '<div class="kg-empty"><b>知识点网络</b>' +
      '100 个节点、12 个卷，按「入门 / 进阶 / 高阶」分层；前置关系构成一张有向图。' +
      '<br><br>点击任一节点，查看它所属卷、难度、读者、前置 / 延伸关系与要点。' +
      '<br>拖拽平移 · 滚轮缩放 · 右上可切换到 3D 图谱。' +
      '</div>' + legendHTML();
  }
  function relButtons(ids){
    if(!ids || !ids.length) return '<span style="font-size:12px;color:var(--muted)">无</span>';
    return ids.map(function(id){
      var r = regById(id);
      return '<button type="button" data-goto="' + id + '">' + esc(r ? r.t : id) + '</button>';
    }).join('');
  }
  KG._showDetail = function(id){
    var box = $('kgDetail');
    if(!box) return;
    var r = regById(id);
    if(!r){ box.innerHTML = emptyHTML(); return; }
    var col = colorOf(r);
    var def = (r.k && r.k.length) ? r.k.join('；') :
      ('《' + window.regVolName(r.v) + '》第 ' + r.n + ' 章 · ' + r.t +
       '。难度' + window.regLevelName(r.l) + '，面向' + window.regAudienceName(r.a) + '。');
    var pts = (r.k && r.k.length)
      ? r.k.map(function(t,i){ return (i+1) + '. ' + esc(t); }).join('<br>')
      : '本章为完整课文，要点与公式见章节正文。';
    box.innerHTML =
      '<div class="kg-dgroup"><i style="background:' + col + '"></i>' +
        esc(window.regLevelName(r.l)) + ' · 第' + r.v + '卷 · ' +
        esc(window.regVolName(r.v)) + ' · No.' + r.n + '</div>' +
      '<div class="kg-dname">' + esc(r.t) + '</div>' +
      '<div class="kg-ddef">' + esc(def) + '</div>' +
      '<a class="kg-dch" data-read="' + r.id + '" href="javascript:void(0)">阅读本章 →</a>' +
      '<div class="kg-dsec">读 者 / 深 度</div>' +
      '<div class="kg-ddef" style="margin-top:0">' + esc(window.regAudienceName(r.a)) +
        ' · ' + (r.d === '骨' ? '骨架要点' : '完整课文') + '</div>' +
      '<div class="kg-dsec">前 置</div><div class="kg-rel">' + relButtons(r.p) + '</div>' +
      '<div class="kg-dsec">延 伸</div><div class="kg-rel">' + relButtons(r.rel) + '</div>' +
      '<div class="kg-dsec">本 章 要 点</div><div class="kg-ddef" style="margin-top:0">' + pts + '</div>' +
      legendHTML();
  };

  function pathOf(id){
    var out = [], guard = {}, r = regById(id);
    while(r && !guard[r.id] && out.length < 5){
      guard[r.id] = true;
      out.unshift(r);
      r = r.p.length ? regById(r.p[0]) : null;
    }
    return out;
  }
  KG._updatePath = function(id){
    var el = $('kgPath');
    if(!el) return;
    var chain = pathOf(id);
    var html = '<span>知识网络</span>';
    chain.forEach(function(node, i){
      html += ' › ' + (i === chain.length - 1 ? '<b>' + esc(node.t) + '</b>' : esc(node.t));
    });
    el.innerHTML = html;
  };

  /* ---------- 选择 / 清除（共享） ---------- */
  KG._select = function(id){
    var r = regById(id);
    if(!r) return;
    KG.currentId = id;
    var ov = $('kgOverlay');
    if(ov) ov.classList.add('has-sel');
    var back = $('kgBack');
    if(back) back.disabled = false;
    KG._showDetail(id);
    KG._updatePath(id);
    if(KG._paint2d) KG._paint2d();
  };
  KG._clear = function(){
    KG.currentId = null;
    var ov = $('kgOverlay');
    if(ov) ov.classList.remove('has-sel');
    var back = $('kgBack');
    if(back) back.disabled = true;
    var pathEl = $('kgPath');
    if(pathEl) pathEl.innerHTML = '';
    var detail = $('kgDetail');
    if(detail) detail.innerHTML = emptyHTML();
    if(KG._paint2d) KG._paint2d();
  };

  /* ---------- 核心 API（供 nav.js 调用） ---------- */
  KG.open = function(){
    var ov = $('kgOverlay');
    if(!ov) return;
    ov.classList.add('show');
    cls(ov, 'mode3', KG.mode === '3d');
    var mb = $('kgMode');
    if(mb) mb.textContent = KG.mode === '3d' ? '2D 图谱' : '3D 图谱';
    KG.redraw();
  };
  KG.close = function(){
    var ov = $('kgOverlay');
    if(!ov) return;
    ov.classList.remove('show');
    if(KG.halt3d) KG.halt3d();
  };
  KG.redraw = function(){
    if(KG.mode === '3d'){
      if(KG.redraw3d) KG.redraw3d();
    } else {
      if(KG.redraw2d) KG.redraw2d();
    }
  };
  KG.goTo = function(id){
    if(!regById(id)) return;
    var st = KG._state;
    if(st.vol || st.query){
      st.vol = 0; st.query = '';
      var si = $('kgSearch'); if(si) si.value = '';
      KG._applyFilter();
    }
    KG._select(id);
    if(KG.mode === '2d' && KG.focus2d) KG.focus2d(id);
    if(KG.mode === '3d' && KG.focus3d) KG.focus3d(id);
  };
  KG.switchMode = function(m){
    if(m !== '2d' && m !== '3d') return;
    if(m === KG.mode) return;
    var ov = $('kgOverlay');
    if(m === '3d'){
      if(KG.close2d) KG.close2d();
      if(ov) ov.classList.add('mode3');
      var mb = $('kgMode'); if(mb) mb.textContent = '2D 图谱';
    } else {
      if(KG.halt3d) KG.halt3d();
      if(ov) ov.classList.remove('mode3');
      var mb2 = $('kgMode'); if(mb2) mb2.textContent = '3D 图谱';
    }
    KG.mode = m;
    if(ov && ov.classList.contains('show')) KG.redraw();
  };
  KG.toggleMode = function(){ KG.switchMode(KG.mode === '2d' ? '3d' : '2d'); };

  /* =========================================================
     2D 渲染
     ========================================================= */
  var svg = null, viewG = null, S = 1, TX = 0, TY = 0;
  var nodeMap = null, edgeEls = null, posMap = null, rot2d = 0;

  function layout(){
    var pos = {}, byVol = {};
    REG.forEach(function(r){ (byVol[r.v] = byVol[r.v] || []).push(r); });
    for(var v=1; v<=12; v++){
      var list = byVol[v] || [];
      var c = list.length;
      var sector = (v-1) * (Math.PI*2/12) - Math.PI/2 + rot2d;
      var per = Math.ceil(c / 2);
      list.forEach(function(r, j){
        var ring = j < per ? 0 : 1;
        var k = ring === 0 ? j : j - per;
        var cnt = ring === 0 ? per : c - per;
        var rad = ring === 0 ? 236 : 322;
        var spread = 26 * Math.PI / 180;
        var frac = cnt > 1 ? k / (cnt - 1) : 0.5;
        var th = sector + (frac - 0.5) * spread;
        pos[r.id] = { x: CX + rad * Math.cos(th), y: CY + rad * Math.sin(th), th: th, rad: rad };
      });
    }
    return pos;
  }

  function applyView(){
    if(viewG) viewG.setAttribute('transform', 'translate(' + TX.toFixed(2) + ',' + TY.toFixed(2) + ') scale(' + S.toFixed(3) + ')');
    if(svg) cls(svg, 'zoomed', S > 1.15);
  }
  function vbPerPixel(rect){
    return Math.max(1000 / Math.max(rect.width,1), 720 / Math.max(rect.height,1));
  }
  function zoomCenter(f){
    var ns = Math.max(0.55, Math.min(4, S * f));
    TX = CX - (CX - TX) / S * ns;
    TY = CY - (CY - TY) / S * ns;
    S = ns; applyView();
  }
  function zoomAt(clientX, clientY, f){
    var rect = svg.getBoundingClientRect();
    var k = vbPerPixel(rect);
    var px = (clientX - rect.left - rect.width/2) * k + CX;
    var py = (clientY - rect.top - rect.height/2) * k + CY;
    var ns = Math.max(0.55, Math.min(4, S * f));
    TX = px - (px - TX) / S * ns;
    TY = py - (py - TY) / S * ns;
    S = ns; applyView();
  }

  function render2d(){
    svg = $('kgSvg');
    if(!svg) return;
    while(svg.firstChild) svg.removeChild(svg.firstChild);

    var defs = sv('defs', null, svg);
    [['kgArrow','#336f92'], ['kgArrowRed','#b04a33']].forEach(function(d){
      var m = sv('marker', {
        id: d[0], viewBox:'0 0 10 10', refX:'9', refY:'5',
        markerWidth:'5', markerHeight:'5', orient:'auto'
      }, defs);
      sv('path', { d:'M0,0 L10,5 L0,10 z', fill:d[1], opacity:'.75' }, m);
    });

    viewG = sv('g', { id:'kgView' }, svg);
    var ringG = sv('g', null, viewG);
    [236, 322].forEach(function(rad){
      sv('circle', { class:'kg-ring', cx:CX, cy:CY, r:rad }, ringG);
    });

    posMap = layout();
    var byVol = {};
    REG.forEach(function(r){ (byVol[r.v] = byVol[r.v] || []).push(r); });
    for(var v=1; v<=12; v++){
      var list = byVol[v] || [];
      if(!list.length) continue;
      var a = (v-1) * (Math.PI*2/12) - Math.PI/2 + rot2d;
      var lx = CX + 180 * Math.cos(a), ly = CY + 180 * Math.sin(a);
      var lab = sv('text', { class:'kg-glabel', x:lx.toFixed(1), y:ly.toFixed(1), 'text-anchor':'middle' }, ringG);
      lab.textContent = window.regVolName(v);
    }

    var edgeG = sv('g', { id:'kgEdges' }, viewG);
    var nodeG = sv('g', { id:'kgNodes' }, viewG);
    edgeEls = [];

    REG.forEach(function(r){
      r.p.forEach(function(pid){
        var a = posMap[pid], b = posMap[r.id];
        if(!a || !b) return;
        var dx = b.x - a.x, dy = b.y - a.y;
        var d = Math.sqrt(dx*dx + dy*dy) || 1;
        var ux = dx/d, uy = dy/d;
        var ln = sv('line', {
          class:'kg-edge',
          x1:(a.x + ux*13).toFixed(1), y1:(a.y + uy*13).toFixed(1),
          x2:(b.x - ux*14).toFixed(1), y2:(b.y - uy*14).toFixed(1),
          'marker-end':'url(#kgArrow)',
          'data-from':pid, 'data-to':r.id
        }, edgeG);
        ln.style.strokeOpacity = '.16';
        edgeEls.push({ el:ln, from:pid, to:r.id });
      });
    });

    nodeMap = {};
    REG.forEach(function(r){
      var p = posMap[r.id];
      var col = colorOf(r);
      var g = sv('g', {
        class:'kg-node' + (r.d === '骨' ? ' skel' : ''),
        'data-id':r.id,
        transform:'translate(' + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ')'
      }, nodeG);
      var circle = sv('circle', { r: r.d === '骨' ? 9.5 : 11 }, g);
      var text = sv('text', { y:24, 'text-anchor':'middle' }, g);
      text.textContent = r.t;
      if(r.d === '骨') circle.style.strokeDasharray = '3 2';
      nodeMap[r.id] = { g:g, circle:circle, fill:(r.d === '骨' ? '#fbfdff' : col), stroke:col };
    });

    var center = sv('g', { class:'kg-node center', transform:'translate(' + CX + ',' + CY + ')' }, viewG);
    var cc = sv('circle', { r:31 }, center);
    cc.style.fill = '#fbfdff'; cc.style.stroke = '#8d7a4c';
    var ct = sv('text', { y:2, 'text-anchor':'middle' }, center);
    ct.textContent = '金融学';
    var ct2 = sv('text', { y:18, 'text-anchor':'middle', class:'kg-center2' }, center);
    ct2.style.fontSize = '10px';
    ct2.textContent = '12 卷 · 100 节点';
    center.addEventListener('click', function(){ KG._clear(); });

    S = 1; TX = 0; TY = 0;
    applyView();
    KG._paint2d();
  }

  function paint2d(){
    if(!nodeMap) return;
    var sel = KG.currentId;
    var neigh = {};
    if(sel){
      var r = regById(sel);
      if(r) r.p.concat(r.rel).forEach(function(id){ neigh[id] = true; });
    }
    REG.forEach(function(r){
      var m = nodeMap[r.id];
      if(!m) return;
      var vis = isVisible(r.id);
      cls(m.g, 'hide', !vis);
      cls(m.g, 'sel', false); cls(m.g, 'rel', false); cls(m.g, 'fade', false);
      if(!vis) return;
      m.circle.style.fill = m.fill;
      m.circle.style.stroke = m.stroke;
      m.circle.style.strokeWidth = '1.4';
      if(sel){
        if(r.id === sel){
          cls(m.g, 'sel', true);
          m.circle.style.fill = '#b04a33';
          m.circle.style.stroke = '#b04a33';
          m.circle.style.strokeWidth = '2.6';
        } else if(neigh[r.id]){
          cls(m.g, 'rel', true);
          m.circle.style.stroke = '#b04a33';
          m.circle.style.strokeWidth = '1.8';
        } else {
          cls(m.g, 'fade', true);
        }
      }
    });
    if(edgeEls){
      edgeEls.forEach(function(e){
        var vis = isVisible(e.from) && isVisible(e.to);
        cls(e.el, 'hide', !vis);
        var on = !!(sel && (e.from === sel || e.to === sel));
        cls(e.el, 'on', on);
        e.el.style.strokeOpacity = !vis ? '0' : (on ? '.62' : '.16');
        e.el.style.stroke = on ? '#b04a33' : '';
        e.el.setAttribute('marker-end', on ? 'url(#kgArrowRed)' : 'url(#kgArrow)');
      });
    }
    var links = $('kgList') ? $('kgList').querySelectorAll('.kg-link') : [];
    for(var i=0;i<links.length;i++){
      cls(links[i], 'on', links[i].getAttribute('data-id') === sel);
    }
  }

  function focus2d(id){
    if(!posMap || !posMap[id]) return;
    TX = CX - posMap[id].x * S;
    TY = CY - posMap[id].y * S;
    applyView();
  }

  /* ---------- 2D 交互绑定 ---------- */
  var panDrag = null, suppressClick = false;
  function bind2d(){
    svg = $('kgSvg');
    if(!svg) return;

    svg.addEventListener('pointerdown', function(e){
      if(closestCls(e.target, 'kg-node')) return;
      panDrag = { x:e.clientX, y:e.clientY, tx:TX, ty:TY, moved:false };
      var st = $('kgStage'); if(st) st.classList.add('drag');
      if(svg.setPointerCapture) { try { svg.setPointerCapture(e.pointerId); } catch(err){} }
    });
    svg.addEventListener('pointermove', function(e){
      if(!panDrag) return;
      var rect = svg.getBoundingClientRect();
      var k = vbPerPixel(rect);
      var dx = (e.clientX - panDrag.x) * k, dy = (e.clientY - panDrag.y) * k;
      if(Math.abs(dx) + Math.abs(dy) > 3) panDrag.moved = true;
      TX = panDrag.tx + dx; TY = panDrag.ty + dy;
      applyView();
    });
    function endPan(){
      if(panDrag) suppressClick = panDrag.moved;
      panDrag = null;
      var st = $('kgStage'); if(st) st.classList.remove('drag');
    }
    svg.addEventListener('pointerup', endPan);
    svg.addEventListener('pointercancel', endPan);

    svg.addEventListener('click', function(e){
      if(suppressClick){ suppressClick = false; return; }
      var node = closestCls(e.target, 'kg-node');
      if(!node || !node.getAttribute('data-id')) return;
      KG.goTo(node.getAttribute('data-id'));
    });
    svg.addEventListener('wheel', function(e){
      e.preventDefault();
      zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1/1.12);
    }, { passive:false });

    var zoom2d = $('kgZoom2d');
    if(zoom2d){
      zoom2d.addEventListener('click', function(e){
        var t = e.target;
        while(t && t !== zoom2d && !t.getAttribute('data-z')) t = t.parentNode;
        if(!t || t === zoom2d) return;
        var z = t.getAttribute('data-z');
        if(z === 'in') zoomCenter(1.22);
        else if(z === 'out') zoomCenter(1/1.22);
        else if(z === 'reset'){ S=1; TX=0; TY=0; applyView(); }
        else if(z === 'relayout'){
          rot2d += Math.PI*2/12;
          render2d();
        }
      });
    }
  }

  /* ---------- 面板 / 按钮事件（只绑定一次） ---------- */
  function bindUI(){
    var close = $('kgClose');
    if(close) close.addEventListener('click', function(){ KG.close(); });
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' || e.keyCode === 27){
        var ov = $('kgOverlay');
        if(ov && ov.classList.contains('show')) KG.close();
      }
    });

    var mode = $('kgMode');
    if(mode) mode.addEventListener('click', function(){ KG.toggleMode(); });

    var back = $('kgBack');
    if(back){ back.disabled = true; back.addEventListener('click', function(){ KG._clear(); }); }

    var search = $('kgSearch');
    if(search){
      search.addEventListener('input', function(){
        KG._state.query = search.value || '';
        KG._applyFilter();
      });
    }

    var chips = $('kgChips');
    if(chips){
      chips.addEventListener('click', function(e){
        var b = closestCls(e.target, 'kg-chips');
        if(!b) return;
        var t = e.target;
        while(t && t !== chips && !t.getAttribute('data-v')) t = t.parentNode;
        if(t && t !== chips) KG._setVol(t.getAttribute('data-v'));
      });
    }

    var list = $('kgList');
    if(list){
      list.addEventListener('click', function(e){
        var link = closestCls(e.target, 'kg-link');
        if(link){ KG.goTo(link.getAttribute('data-id')); return; }
        var grp = closestCls(e.target, 'kg-g');
        if(grp) KG._setVol(grp.getAttribute('data-v'));
      });
    }

    var detail = $('kgDetail');
    if(detail){
      detail.addEventListener('click', function(e){
        var a = e.target;
        while(a && a !== detail && !a.getAttribute('data-goto') && !a.getAttribute('data-read')) a = a.parentNode;
        if(!a || a === detail) return;
        var id = a.getAttribute('data-goto');
        if(id){ KG.goTo(id); return; }
        id = a.getAttribute('data-read');
        if(id){
          if(typeof CustomEvent !== 'undefined'){
            window.dispatchEvent(new CustomEvent('kg:read', { detail:{ id:id } }));
          }
          if(KG.onRead) KG.onRead(id);
        }
      });
      detail.innerHTML = emptyHTML();
    }
  }

  /* ---------- 暴露方法 ---------- */
  KG.redraw2d = render2d;
  KG.close2d = function(){ /* 2D 无循环，留空占位，供模式切换调用 */ };
  KG.paint2d = paint2d;
  KG._paint2d = paint2d;
  KG.focus2d = focus2d;
  KG.zoom2d = zoomCenter;

  renderChips();
  renderList();
  bindUI();
  bind2d();
  KG._applyFilter();
})();

</script>
<script>
/* ============================================================
   kg3d.js —— 知识点网络 · 伪 3D 椭球云团（原生 Canvas，无 Three.js）
   依赖：registry.js、kg2d.js（后者提供 window.KG 核心与共享面板）
   本文件只补充 3D 相关方法到 window.KG，不覆盖核心 open/close/
   redraw/goTo，保证 2D / 3D 共用同一份选择状态与详情面板。
   ============================================================ */
(function(){
  'use strict';

  var REG = window.REG || [];
  var KG = window.KG = window.KG || {};
  var COLORS = { '入':'#336f92', '进':'#3a7076', '高':'#b04a33' };

  var canvas = null, ctx = null, dpr = 1, cw = 0, ch = 0;
  var base = null, clusters = null, projected = [], projById = {};
  var bound = false, running = false, raf = 0, lastT = 0;
  var seed = 0;
  var drag = null;

  var st = {
    yaw: 0,
    pitch: 0.42,
    zoom: 1,
    autoRot: true,
    vy: 0,
    vp: 0,
    targetYaw: null
  };

  function $(id){ return document.getElementById(id); }
  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
  function shortest(a){
    a = (a + Math.PI) % (Math.PI*2);
    if(a < 0) a += Math.PI*2;
    return a - Math.PI;
  }
  function colorOf(r){ return COLORS[r.l] || '#336f92'; }
  function regById(id){ return window.regById ? window.regById(id) : null; }

  /* ---------- 基础坐标：12 卷沿椭圆分布，每卷一小团 ---------- */
  function buildBase(){
    var byVol = {}, i, r;
    for(i=0;i<REG.length;i++){
      r = REG[i];
      (byVol[r.v] = byVol[r.v] || []).push(r);
    }
    var arr = [], cl = [];
    for(var v=1; v<=12; v++){
      var a = (v-1) * (Math.PI*2/12) - Math.PI/2 + seed;
      var ccx = 300 * Math.cos(a);
      var ccz = 205 * Math.sin(a);
      var ccy = ((v % 4) - 1.5) * 16;
      cl.push({ name: window.regVolName(v), x:ccx, y:ccy, z:ccz });
      var list = byVol[v] || [];
      var c = list.length;
      var rad = 15 + 8 * Math.sqrt(c);
      for(var j=0;j<c;j++){
        var u = (j + 0.5) / c;
        var phi = Math.acos(clamp(1 - 2*u, -1, 1));
        var theta = Math.PI * (1 + Math.sqrt(5)) * j;
        arr.push({
          r: list[j],
          x: ccx + rad * Math.sin(phi) * Math.cos(theta),
          y: ccy + rad * Math.cos(phi) * 0.7,
          z: ccz + rad * Math.sin(phi) * Math.sin(theta),
          th: a
        });
      }
    }
    clusters = cl;
    return arr;
  }

  function project(p){
    var cy = Math.cos(st.yaw), sy = Math.sin(st.yaw);
    var cp = Math.cos(st.pitch), sp = Math.sin(st.pitch);
    var x1 = p.x*cy + p.z*sy;
    var z1 = -p.x*sy + p.z*cy;
    var y2 = p.y*cp - z1*sp;
    var z2 = p.y*sp + z1*cp;
    var s = 900 / (900 + z2);
    return {
      x: cw/2 + x1 * s * st.zoom,
      y: ch/2 + y2 * s * st.zoom,
      s: s,
      z: z2
    };
  }

  /* ---------- 尺寸 / DPR ---------- */
  function resize(){
    if(!canvas || !ctx) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cw = canvas.clientWidth || 1;
    ch = canvas.clientHeight || 1;
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  /* ---------- 绘制 ---------- */
  function draw(){
    if(!ctx || !cw || !ch) return;
    ctx.clearRect(0, 0, cw, ch);

    // 云团中心的题眼
    ctx.save();
    ctx.textAlign = 'center';
    ctx.globalAlpha = .20;
    ctx.fillStyle = '#7e96a6';
    ctx.font = '600 ' + Math.round(26 * Math.min(st.zoom, 1.6)) + 'px "Optima","Microsoft YaHei",sans-serif';
    ctx.fillText('金融学', cw/2, ch/2 - 2);
    ctx.font = '10px "Optima","Microsoft YaHei",sans-serif';
    ctx.fillText('12 卷 · 100 节点', cw/2, ch/2 + 18);
    ctx.restore();

    // 卷名（淡）
    if(clusters && st.zoom > .7){
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '11px "Optima","Microsoft YaHei",sans-serif';
      clusters.forEach(function(c){
        var p = project(c);
        ctx.globalAlpha = clamp((p.s - .65) * .9, .04, .28);
        ctx.fillStyle = '#7e96a6';
        ctx.fillText(c.name, p.x, p.y + 4);
      });
      ctx.restore();
    }

    projected = [];
    projById = {};
    var i, r, pp;
    for(i=0;i<base.length;i++){
      r = base[i].r;
      if(!KG._isVisible(r.id)) continue;
      pp = project(base[i]);
      pp.r = r;
      pp.radius = clamp((r.d === '骨' ? 5.2 : 6.4) * pp.s * st.zoom, 2.6, 12);
      projected.push(pp);
      projById[r.id] = pp;
    }
    projected.sort(function(a, b){ return b.z - a.z; }); // 远的先画

    var sel = KG.currentId;
    var neigh = {};
    if(sel){
      var sr = regById(sel);
      if(sr) sr.p.concat(sr.rel).forEach(function(id){ neigh[id] = true; });
    }

    // 前置关系连线
    ctx.save();
    ctx.lineCap = 'round';
    for(i=0;i<REG.length;i++){
      r = REG[i];
      if(!projById[r.id]) continue;
      for(var k=0;k<r.p.length;k++){
        var from = projById[r.p[k]];
        if(!from) continue;
        var to = projById[r.id];
        var on = !!(sel && (r.p[k] === sel || r.id === sel));
        ctx.beginPath();
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
        ctx.strokeStyle = on ? 'rgba(176,74,51,.62)' : 'rgba(51,111,146,.15)';
        ctx.lineWidth = on ? 1.6 : 1;
        ctx.stroke();
      }
    }
    ctx.restore();

    var showAllLabels = st.zoom >= 1.3;
    for(i=0;i<projected.length;i++){
      pp = projected[i];
      r = pp.r;
      var isSel = (r.id === sel);
      var isRel = !!neigh[r.id];
      var col = isSel ? '#b04a33' : colorOf(r);
      var alpha = clamp((pp.s - .6) * 1.5, .35, 1);
      if(sel && !isSel && !isRel) alpha *= .45;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(pp.x, pp.y, isSel ? pp.radius + 3 : pp.radius, 0, Math.PI*2);
      if(r.d === '骨' && !isSel){
        ctx.fillStyle = '#fbfdff';
        ctx.fill();
        ctx.setLineDash([2, 2]);
      } else {
        ctx.fillStyle = col;
        ctx.fill();
      }
      ctx.strokeStyle = col;
      ctx.lineWidth = (isSel || isRel) ? 2 : 1.2;
      ctx.stroke();
      ctx.restore();

      if(showAllLabels || isSel || isRel){
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = (isSel ? '600 12px ' : '11px ') + '"Source Han Serif SC","SimSun",serif';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(235,243,251,.95)';
        ctx.strokeText(r.t, pp.x, pp.y + pp.radius + 13);
        ctx.fillStyle = isSel ? '#b04a33' : '#41545f';
        ctx.fillText(r.t, pp.x, pp.y + pp.radius + 13);
        ctx.restore();
      }
    }
  }

  /* ---------- 动画循环 ---------- */
  function update(dt){
    if(!drag){
      if(Math.abs(st.vy) > .00002 || Math.abs(st.vp) > .00002){
        st.yaw += st.vy * dt / 16;
        st.pitch = clamp(st.pitch + st.vp * dt / 16, -1.35, 1.35);
        st.vy *= .92;
        st.vp *= .92;
      } else if(st.targetYaw != null){
        var d = shortest(st.targetYaw - st.yaw);
        st.yaw += d * .09;
        if(Math.abs(d) < .008) st.targetYaw = null;
      } else if(st.autoRot){
        st.yaw += .0018 * dt / 16;
      }
    }
  }
  function tick(t){
    if(!running) return;
    raf = requestAnimationFrame(tick);
    var dt = lastT ? Math.min(48, t - lastT) : 16;
    lastT = t;
    update(dt);
    draw();
  }
  function start(){
    if(running) return;
    var ov = $('kgOverlay');
    if(document.hidden || !ov || !ov.classList.contains('show') || KG.mode !== '3d') return;
    running = true; lastT = 0;
    raf = requestAnimationFrame(tick);
  }
  function stop(){
    running = false;
    if(raf) cancelAnimationFrame(raf);
    raf = 0; lastT = 0;
  }

  /* ---------- 命中检测 ---------- */
  function pick(x, y){
    var best = null, bd = 1e9;
    for(var i=0;i<projected.length;i++){
      var p = projected[i];
      var dx = p.x - x, dy = p.y - y;
      var d = dx*dx + dy*dy;
      var rr = Math.max(13, p.radius + 7);
      if(d < rr*rr && d < bd){ bd = d; best = p; }
    }
    return best;
  }

  /* ---------- 交互（只绑定一次） ---------- */
  function bind3d(){
    if(bound || !canvas) return;
    bound = true;

    canvas.addEventListener('pointerdown', function(e){
      drag = { x:e.clientX, y:e.clientY, sx:e.clientX, sy:e.clientY, moved:false };
      st.vy = 0; st.vp = 0;
      if(canvas.setPointerCapture){ try{ canvas.setPointerCapture(e.pointerId); }catch(err){} }
    });
    canvas.addEventListener('pointermove', function(e){
      if(!drag) return;
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag.x = e.clientX; drag.y = e.clientY;
      if(Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 4) drag.moved = true;
      st.yaw += dx * .006;
      st.pitch = clamp(st.pitch + dy * .006, -1.35, 1.35);
      st.vy = dx * .006;
      st.vp = dy * .006;
      st.targetYaw = null;
    });
    function endDrag(e){
      if(!drag) return;
      var moved = drag.moved;
      drag = null;
      if(!moved && e){
        var rect = canvas.getBoundingClientRect();
        var hit = pick(e.clientX - rect.left, e.clientY - rect.top);
        if(hit) KG.goTo(hit.r.id);
      }
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', function(){ drag = null; });
    canvas.addEventListener('wheel', function(e){
      e.preventDefault();
      st.zoom = clamp(st.zoom * (e.deltaY < 0 ? 1.12 : 1/1.12), .45, 3.2);
    }, { passive:false });

    var zoom3d = $('kgZoom3d');
    if(zoom3d){
      zoom3d.addEventListener('click', function(e){
        var t = e.target;
        while(t && t !== zoom3d && !t.getAttribute('data-k3')) t = t.parentNode;
        if(!t || t === zoom3d) return;
        var k = t.getAttribute('data-k3');
        if(k === 'rot') KG.toggleRot3d();
        else if(k === 'in') st.zoom = clamp(st.zoom * 1.2, .45, 3.2);
        else if(k === 'out') st.zoom = clamp(st.zoom / 1.2, .45, 3.2);
        else if(k === 'reset'){ st.yaw = 0; st.pitch = .42; st.zoom = 1; st.vy = 0; st.vp = 0; st.targetYaw = null; }
        else if(k === 'relayout'){ seed += Math.PI/6; base = buildBase(); }
      });
    }

    window.addEventListener('resize', function(){
      if(KG.mode === '3d') resize();
    });
    if(typeof ResizeObserver !== 'undefined' && $('kgStage')){
      new ResizeObserver(function(){
        if(KG.mode === '3d') resize();
      }).observe($('kgStage'));
    }
    document.addEventListener('visibilitychange', function(){
      if(document.hidden) stop();
      else start();
    });
  }

  /* ---------- 挂到 window.KG ---------- */
  KG.redraw3d = function(){
    canvas = canvas || $('kg3d');
    if(!canvas || !canvas.getContext) return;
    if(!ctx){ ctx = canvas.getContext('2d'); bind3d(); }
    if(!base) base = buildBase();
    resize();
    start();
  };
  KG.halt3d = stop;
  KG.wake3d = start;
  KG.open3d = KG.redraw3d;
  KG.close3d = stop;
  KG.zoom3d = function(f){ st.zoom = clamp(st.zoom * f, .45, 3.2); };
  KG.reset3d = function(){
    st.yaw = 0; st.pitch = .42; st.zoom = 1;
    st.vy = 0; st.vp = 0; st.targetYaw = null;
  };
  KG.relayout3d = function(){ seed += Math.PI/6; base = buildBase(); };
  KG.toggleRot3d = function(){
    st.autoRot = !st.autoRot;
    var b = $('kgZoom3d') && $('kgZoom3d').querySelector('[data-k3="rot"]');
    if(b){ b.textContent = st.autoRot ? '⏸' : '▶'; b.setAttribute('aria-label', st.autoRot ? '暂停旋转' : '继续旋转'); }
  };
  KG.focus3d = function(id){
    if(!base) return;
    for(var i=0;i<base.length;i++){
      if(base[i].r.id === id){
        st.targetYaw = base[i].th + Math.PI/2;
        st.zoom = Math.max(st.zoom, 1.15);
        st.vy = 0; st.vp = 0;
        break;
      }
    }
