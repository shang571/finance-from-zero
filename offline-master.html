window.__CH_VOL2 = `
<section class="chapter" data-id="statements-overview">
  <div class="chead">
    <span class="chnum">09</span>
    <div class="chead-body">
      <div class="kicker">卷二 · 看懂财报　入门 · 零基础 / 学生</div>
      <h2>三大报表全景</h2>
      <div class="desc">先看清资产负债表、利润表、现金流量表各回答什么问题，再谈怎么读一家公司。</div>
    </div>
  </div>
  <div class="path-strip">前置：无，进入财报卷的起点　|　当前：<b>三大报表全景</b>　|　延伸：会计等式与复式记账 · 权责发生制vs收付实现制</div>

  <h3>三张表，三个问题</h3>
  <p>财务报表（Financial Statements）不是三张互不相干的表格，而是同一个企业活动的三种观察角度。资产负债表回答"在某个时点上，公司拥有什么、欠什么"；利润表回答"过去一段时间里，公司是赚了还是亏了"；现金流量表回答"同一段时间里，现金究竟从哪来、到哪去"。三张表合起来，才构成一幅完整的图景，只看其中一张容易得出片面的结论。</p>
  <p>一个有用的比喻是：资产负债表像一张照片，定格在某一天；利润表和现金流量表像两段录像，记录一段时期的变化。照片告诉你家底，录像告诉你这段日子是怎么过来的。把照片和录像对照着看，才能既看到结果，也看到过程。</p>

  <div class="tbl-scroll"><table><thead><tr><th>报表</th><th>时间属性</th><th>核心问题</th></tr></thead><tbody><tr><td>资产负债表</td><td>某一时点（快照）</td><td>拥有什么、欠什么、剩下什么</td></tr><tr><td>利润表</td><td>一段时期（录像）</td><td>收入多少、费用多少、赚亏多少</td></tr><tr><td>现金流量表</td><td>一段时期（录像）</td><td>现金从哪来、花到哪去</td></tr></tbody></table></div>

  <h3>报表之间的钩稽关系</h3>
  <p>三张表不是松散地摆在一起，它们之间有明确的勾连。最核心的一条：本期赚得的净利润，经过分配之后，最终进入资产负债表的所有者权益，成为净资产的一部分。另一条：现金流量表期末的现金余额，应当与资产负债表上的货币资金项目对得上。这些对应关系叫作钩稽关系，是检查报表是否自洽的重要线索。</p>
  <p>理解钩稽关系，能帮你避免最常见的误读。比如一家公司利润表上利润很漂亮，现金流量表的经营活动现金流却持续为负——这未必是造假，但至少说明利润还没有变成真金白银，可能有大量货款尚未收回，或存货积压。利润和现金的背离，正是三张表对照阅读才能发现的问题。</p>

  <div class="defn">
    <p>财务报表：以表格形式系统反映企业财务状况、经营成果和现金流量的文件，通常包括资产负债表、利润表、现金流量表及所有者权益变动表和附注。</p>
    <p>钩稽关系：不同报表项目之间存在的、在数额上应当相互印证或衔接的对应关系。</p>
  </div>

  <div class="formula">资产 = 负债 + 所有者权益</div>
  <div class="formula-note">这是资产负债表的基本结构，也是全部复式记账的出发点：左边是资金的去向（资产），右边是资金的来源（负债与权益），两边必然相等。下一章会专门展开它的含义。这里的"必然相等"来自记账规则，而非巧合。</div>

  <h3>读一套财报的顺序</h3>
  <p>拿到一套报表，不宜从头逐行读下去更有效率的做法是先看整体结构，再看细节。可以先在资产负债表上确认家底的规模与构成，接着到利润表看这段时间赚了多少钱、靠什么赚的，然后到现金流量表验证这些利润有没有现金支撑。三步走完，心里先有个大概轮廓，细节才有落脚点。</p>
  <p>还要养成一个习惯：看绝对数的同时看结构和变化。营业收入增长 20% 听起来不错，但如果应收账款增长 80%，就需要追问增长是不是靠放宽赊销换来的。把数字放到表格的上下文里、和上一期比较、和同行口径比较，报表才会从一堆静态数字变成能讲出故事的材料。</p>

  <div class="card soft"><div class="card-t">先建框架，再填细节</div><p>初读财报最忌一上来就盯住某个亮眼数字。先花几分钟弄清三张表分别在说什么、彼此怎么衔接，再往下深挖，效率会高很多。框架清晰的人读报表，是在找证据；框架不清的人读报表，只是在看数字。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="accounting-equation">
  <div class="chead">
    <span class="chnum">10</span>
    <div class="chead-body">
      <div class="kicker">卷二 · 看懂财报　入门 · 零基础 / 学生</div>
      <h2>会计等式与复式记账</h2>
      <div class="desc">搞懂资产负债表为什么必然平衡，以及每一笔业务如何留下两个方向的记录。</div>
    </div>
  </div>
  <div class="path-strip">前置：三大报表全景　|　当前：<b>会计等式与复式记账</b>　|　延伸：资产负债表拆解 · 利润表到净利润</div>

  <h3>会计等式：一切从平衡开始</h3>
  <p>会计等式（Accounting Equation）是整个财务会计的地基：资产等于负债加所有者权益。它的含义并不神秘。公司手里的每一样资产，追根溯源都有出处——要么是借来的（形成负债），要么是股东投入或经营累积留下的（形成所有者权益）。资金去向与资金来源，是同一件事的两个侧面，因此两边必然相等。</p>
  <p>这里的关键是"必然"，而不是"碰巧相等"。任何一笔经济业务发生时，都会同时影响等式的至少两个项目，而且影响的方向和金额经过设计，使等式始终保持平衡。下面用一组假设数据来走一遍，你会看到四步之后等式依然成立：甲公司起初资产 500 万元、负债 200 万元、所有者权益 300 万元。</p>

  <div class="chart-box"><canvas id="eqBal"></canvas><div class="cap">图注：假设数据，甲公司经历借款、还款、盈利四步业务后，资产 = 负债 + 所有者权益始终成立（教学示意）。</div></div>

  <div class="tbl-scroll"><table><thead><tr><th>业务</th><th>资产</th><th>负债</th><th>所有者权益</th></tr></thead><tbody><tr><td>初始状态</td><td>500 万</td><td>200 万</td><td>300 万</td></tr><tr><td>借款 +100 万</td><td>600 万</td><td>300 万</td><td>300 万</td></tr><tr><td>还债 −50 万</td><td>550 万</td><td>250 万</td><td>300 万</td></tr><tr><td>盈利 +50 万</td><td>600 万</td><td>250 万</td><td>350 万</td></tr></tbody></table></div>

  <div class="formula">资产 = 负债 + 所有者权益</div>
  <div class="formula-note">资产表示资金的占用形态，负债与所有者权益表示资金的来源渠道；两者是同一笔资金的不同描述，因此恒等。假设数据见上表：借款增加现金与负债，还债减少现金与负债，盈利最终增加所有者权益，每一步等式两边都同步变化。</div>

  <h3>复式记账：每笔业务都有两个落点</h3>
  <p>让等式保持平衡的办法，叫复式记账（Double-Entry Bookkeeping）：每一笔业务，都要以相等金额、相反方向，记入两个或两个以上相互关联的账户。比如用银行存款购买一台设备，设备的价值记在资产端，银行存款同时减少——资产内部一增一减，总额不变，等式依然平衡。再比如借入一笔款项，现金增加的同时负债也增加，等式两边同增，仍然平衡。</p>
  <p>借贷是这套方法的记账符号，"借"与"借入"不是一回事。对资产类科目，增加记借方；对负债和所有者权益类科目，增加记贷方。一条最实用的检查规则是：有借必有贷，借贷必相等。每一笔分录都满足它，所有分录加总之后自然平衡，这就是试算平衡能够成立的理由。</p>

  <div class="defn">
    <p>复式记账：对每一项经济业务，都以相等金额在两个或两个以上相互联系的账户中进行登记的方法。</p>
    <p>会计分录：标明某笔业务应借应贷的科目名称、方向和金额的记录，是登记账簿的依据。</p>
  </div>

  <h3>从一张凭证到一套报表</h3>
  <p>会计等式和复式记账不是纸面规则，它们贯穿一条完整的工作流程。业务发生，先取得原始凭证；会计人员据此编制记账凭证，写成会计分录；再根据分录登记账簿；期末进行调整和核对，确认无误后编制财务报表。这条链条中每一步都以前一步为基础，而等式平衡是贯穿全程的检查绳。</p>
  <div class="chart-box"><canvas id="flowChart"></canvas><div class="cap">图注：从经济业务到财务报表的核算流程——原始凭证 → 记账凭证 → 账簿 → 财务报表，环节之间需要核对（教学示意）。</div></div>
  <p>理解这条流程，你就明白财务报表不是期末凭空"做"出来的，而是日常一笔笔记录的自然结果。报表质量的上限，早在业务发生的那一刻、凭证填制的那一步就已经决定了。事后调整能修正差错，却无法凭空创造真实。</p>

  <div class="card soft"><div class="card-t">把等式当成检查工具</div><p>读报表时，随时可以用会计等式自检：资产总计是否等于负债与所有者权益总计？若对不上，要么数字抄错，要么口径不同，要么存在需要附注解释的特殊项目。一个简单的恒等式，往往是最快的校验器。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="balance-sheet">
  <div class="chead">
    <span class="chnum">11</span>
    <div class="chead-body">
      <div class="kicker">卷二 · 看懂财报　入门 · 零基础 / 学生</div>
      <h2>资产负债表拆解</h2>
      <div class="desc">沿着结构与科目层级，读懂一张资产负债表里真正重要的信息。</div>
    </div>
  </div>
  <div class="path-strip">前置：三大报表全景　|　当前：<b>资产负债表拆解</b>　|　延伸：附注与关联交易 · 比率分析全景</div>

  <h3>先看结构：左边资产，右边来源</h3>
  <p>资产负债表的基本布局，是把会计等式的两边并排呈现：一侧列资产，另一侧列负债和所有者权益，两侧总计相等。资产这边按流动性从高到低排列，越靠近顶部越容易变成现金；权益那边则按偿还的紧迫程度安排。理解了这个排列逻辑，读表时就不必逐行死记，顺着结构的方向看下去即可。</p>
  <p>下面是一组假设数据的简表，某公司期末资产总计 1000 万元，负债 400 万元，所有者权益 600 万元。为了突出结构，项目做了大量简化，真实报表要详尽得多。</p>
  <div class="tbl-scroll"><table><thead><tr><th>资产</th><th>金额</th><th>负债与权益</th><th>金额</th></tr></thead><tbody><tr><td>货币资金</td><td>150 万</td><td>短期借款</td><td>100 万</td></tr><tr><td>应收账款</td><td>200 万</td><td>应付账款</td><td>150 万</td></tr><tr><td>存货</td><td>250 万</td><td>长期借款</td><td>150 万</td></tr><tr><td>固定资产</td><td>400 万</td><td>所有者权益</td><td>600 万</td></tr><tr><td>资产总计</td><td>1000 万</td><td>负债与权益总计</td><td>1000 万</td></tr></tbody></table></div>

  <h3>流动与非流动，是两把不同的尺</h3>
  <p>资产被分成流动资产和非流动资产，分界线通常是"一年内能否变现或耗用"。货币资金、应收账款、存货属于前者；厂房、设备、长期投资属于后者。这个分类之所以重要，是因为它把"能多快变成钱"的信息直接写进了报表结构里。一家流动负债很高而流动资产很少的公司，即便总资产庞大，也可能面临短期周转压力。</p>
  <p>负债同样分流动与非流动。短期借款、应付账款要在一年内偿还，长期借款则给了更宽裕的时间。把资产的期限结构和负债的期限结构放在一起看，才能判断一家公司的偿债节奏是否健康。用短期借款去支撑回收期很长的项目，是财报里典型的危险信号之一。</p>

  <div class="defn">
    <p>流动资产：预计在一个正常营业周期或一年内变现、出售或耗用的资产。</p>
    <p>固定资产：为生产经营持有、使用期限较长的有形资产，如房屋建筑物与机器设备。</p>
  </div>

  <div class="formula">资产负债率 = 负债总额 ÷ 资产总额 × 100%</div>
  <div class="formula-note">该比率反映资产中有多少靠负债支撑，衡量长期偿债能力与财务杠杆水平。假设数据：负债 400 万元、资产 1000 万元，资产负债率 = 40%。比率高低没有统一标准，须结合行业特点与债务结构判断。</div>

  <h3>科目层级：从总账到明细</h3>
  <p>报表上的"存货""固定资产"是一个个汇总项目，它们背后是层级分明的会计科目。以原材料为例：最上层是一级科目，由制度统一规定；其下可以设二级科目，再往下是更细的明细科目。层级越往下，信息越具体，也越接近业务现场。下面这张示意图展示了这种逐级细化的关系。</p>
  <div class="chart-box"><canvas id="subjTree"></canvas><div class="cap">图注：会计科目的三级结构示例——一级科目（原材料）→ 二级科目（原料及主要材料、辅助材料）→ 明细科目（甲材料、乙材料等，教学示意）。</div></div>
  <p>为什么要关心层级？因为汇总数字会掩盖差异。存货总额上升，可能是畅销品备货增加，也可能是滞销品积压；只有拆到明细，才能看清变化来自哪里。报表分析里很多有价值的发现，都藏在汇总项目之下的结构里。</p>

  <div class="card soft"><div class="card-t">看表顺序</div><p>先读总计确认整体规模，再看结构比例判断重心，最后拆到明细追问变化来源。三步下来，一张资产负债表就从静态数字变成了有层次的材料。切忌只盯着总额——总额相等是记账规则决定的，真正的信息在结构里。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="income-statement">
  <div class="chead">
    <span class="chnum">12</span>
    <div class="chead-body">
      <div class="kicker">卷二 · 看懂财报　入门 · 零基础 / 学生</div>
      <h2>利润表到净利润</h2>
      <div class="desc">沿着营业收入一路往下走，看清每一层利润是怎么扣出来的。</div>
    </div>
  </div>
  <div class="path-strip">前置：三大报表全景　|　当前：<b>利润表到净利润</b>　|　延伸：权责发生制vs收付实现制 · 折旧摊销与资本化</div>

  <h3>从收入到净利润的台阶</h3>
  <p>利润表（Income Statement）讲的是一段时间里的经营成果，它的结构像一组台阶：从营业收入出发，依次减去营业成本、各种费用、所得税，最后落到净利润。每一级台阶都有名字——营业利润、利润总额、净利润，理解每一级扣掉了什么，比记住净利润这个终点更重要。</p>
  <p>看一组假设数据的例子。某制造企业本期营业收入 1000 万元，营业成本 600 万元，毛利为 400 万元；再扣除销售费用、管理费用、财务费用合计 200 万元，得到营业利润 200 万元；假设没有其他收支，利润总额同为 200 万元；按 25% 缴纳所得税 50 万元，净利润为 150 万元。数字按整数设计，便于手算。</p>

  <div class="tbl-scroll"><table><thead><tr><th>项目</th><th>假设金额</th><th>含义</th></tr></thead><tbody><tr><td>营业收入</td><td>1000 万</td><td>销售商品与提供劳务所得</td></tr><tr><td>减：营业成本</td><td>−600 万</td><td>售出商品自身的成本</td></tr><tr><td>毛利</td><td>400 万</td><td>收入减成本</td></tr><tr><td>减：期间费用</td><td>−200 万</td><td>销售、管理、财务费用</td></tr><tr><td>营业利润</td><td>200 万</td><td>日常经营产生的利润</td></tr><tr><td>减：所得税</td><td>−50 万</td><td>按 25% 计算</td></tr><tr><td>净利润</td><td>150 万</td><td>最终归属股东的利润</td></tr></tbody></table></div>

  <h3>每一层扣的是什么</h3>
  <p>营业成本与期间费用容易被混为一谈，区别却很关键。营业成本与卖出去的商品直接对应，卖得多它就多；期间费用则主要与期间和组织结构相关，比如管理人员薪酬、办公开支、借款利息，它们不随某件商品的销售直接变动。把两者分清楚，才能判断利润的变化是来自销售规模，还是来自费用控制。</p>
  <p>毛利率是观察盈利能力的第一把尺：毛利除以营业收入，假设数据中是 400 ÷ 1000 = 40%。它反映产品本身的赚钱空间。之后再看营业利润率 200 ÷ 1000 = 20%，中间下降的 20 个百分点，正是期间费用侵蚀的结果。一层层看下来，你能定位利润是在哪一步被消耗掉的。</p>

  <div class="defn">
    <p>净利润：利润总额扣除所得税费用后的余额，是归属于企业股东的最终经营成果。</p>
    <p>期间费用：不能直接或间接归入营业成本、应直接计入当期损益的各项费用，通常包括销售费用、管理费用和财务费用。</p>
  </div>

  <div class="formula">净利润 = 营业收入 − 营业成本 − 期间费用 − 所得税</div>
  <div class="formula-note">该式是对利润表主要台阶的简化，省略了税金及附加、资产减值、公允价值变动、投资收益等项目，真实报表层次更多。假设数据：1000 − 600 − 200 − 50 = 150 万元。各项目须取自同一会计期间。</div>

  <h3>净利润不是现金，也不是终点</h3>
  <p>净利润很重要，但它既不等于收到的现金，也不是评价经营的唯一尺度。利润按权责发生制确认：只要满足收入确认条件，货款尚未收到也可以计入收入；同样，费用也可能先计提后支付。于是出现一种常见情形：利润表上盈利，银行账户却并不宽裕。要弄清这件事，必须请出第三张表——现金流量表。</p>
  <p>净利润还会受到会计估计的影响。折旧年限、减值计提、存货计价方法的选择，都会在合法范围内改变利润数字。这不是说利润不可信，而是提醒你：读利润表时要配套看附注，留意那些依赖判断的项目。一个数字越是"看起来完美"，越值得追问它的构成。</p>

  <div class="card soft"><div class="card-t">逐层提问</div><p>读利润表时养成三层追问：收入靠什么增长？毛利为什么升或降？净利润和经营现金流是否背离？这三个问题能帮你从"净利润是多少"走到"这个利润是怎么来的"，后者才是判断质量的关键。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="cashflow-statement">
  <div class="chead">
    <span class="chnum">13</span>
    <div class="chead-body">
      <div class="kicker">卷二 · 看懂财报　入门 · 零基础 / 学生</div>
      <h2>现金流量表三活动</h2>
      <div class="desc">把企业的现金往来分成经营、投资、筹资三类，看清利润与现金的差别。</div>
    </div>
  </div>
  <div class="path-strip">前置：三大报表全景　|　当前：<b>现金流量表三活动</b>　|　延伸：权责发生制vs收付实现制 · 营运资本与现金周期</div>

  <h3>利润不等于现金</h3>
  <p>现金流量表（Cash Flow Statement）记录的是一段时期里现金的实际进出，它以收付实现制为基础：钱真正到账或付出，才计入这张表。这与利润表采用的权责发生制形成对照——后者看的是权利与义务是否发生，而不是钱有没有到位。两套口径的差异，正是理解这张表价值的关键。</p>
  <p>举个假设数据的例子：本期确认收入 1000 万元，但其中 300 万元尚未收到货款；本期确认的成本费用也有 100 万元尚未支付。按权责发生制算出的利润，与按收付实现制算出的现金净流入，自然会不一样。这不是哪个数字错了，而是它们在回答不同的问题。利润衡量经营成果，现金流衡量支付能力，两者缺一不可。</p>

  <h3>三类活动，各管一摊</h3>
  <p>现金流量表把企业的所有现金往来归入三类。经营活动（Operating Activities）来自日常主营业务，比如销售收款、支付供应商货款和员工薪酬；投资活动（Investing Activities）涉及长期资产的购建和处置，比如购买设备、出售厂房；筹资活动（Financing Activities）则关乎资本的来源与偿还，比如取得借款、偿还债务、吸收投资、分配股利。</p>
  <p>分类的意义在于，它让你可以分别评价企业的"造血""换血"与"输血"能力。经营活动现金流是自我造血，长期应为正且稳定；投资活动现金流为负，往往意味着在扩张，未必是坏事；筹资活动现金流反映了对外部资金的依赖程度。三者放在一起看，才能判断一家公司的现金结构是否可持续。</p>
  <div class="chart-box"><canvas id="cashflow3"></canvas><div class="cap">图注：现金流量表的三类活动——经营活动、投资活动、筹资活动，三者净额相加得到现金及现金等价物的净增加额（教学示意）。</div></div>

  <div class="tbl-scroll"><table><thead><tr><th>活动类别</th><th>假设净额</th><th>典型内容</th></tr></thead><tbody><tr><td>经营活动</td><td>+300 万</td><td>销售收款减去采购、薪酬等支出</td></tr><tr><td>投资活动</td><td>−200 万</td><td>购置设备、厂房等长期资产</td></tr><tr><td>筹资活动</td><td>−50 万</td><td>偿还借款、分配股利</td></tr><tr><td>现金净增加额</td><td>+50 万</td><td>三类合计</td></tr></tbody></table></div>

  <div class="defn">
    <p>经营活动现金流：由企业日常主营业务及其直接相关的活动产生的现金流入与流出。</p>
    <p>收付实现制：以款项是否实际收付作为确认标准，与以权利义务是否发生为标准的权责发生制相对。</p>
  </div>

  <div class="formula">现金净增加额 = 经营活动净额 + 投资活动净额 + 筹资活动净额</div>
  <div class="formula-note">三类活动的净额分别为该类现金流入减流出，三者相加得到本期现金及现金等价物的净增加额（不考虑汇率影响）。假设数据：300 − 200 − 50 = 50 万元，该数应与资产负债表货币资金的变动相衔接。</div>

  <h3>把三张表连起来读</h3>
  <p>现在是时候把三张表串起来了。资产负债表给出期末家底，利润表解释这段时间赚了多少，现金流量表则说明这些利润背后有没有现金支撑。现金流量表期末的现金余额，应当与资产负债表的货币资金项目一致；净利润经过调整，可以间接推算出经营活动现金流。这些勾连是报表自洽的证明，也是交叉验证的工具。</p>
  <p>实务中特别值得关注的一种信号，是净利润持续增长而经营活动现金流长期为负。它未必意味着造假，但通常提示货款回收困难或存货积压——利润停留在账面上，没有变成可支配的钱。把利润和现金放在一起看，是识别经营质量最朴素也最有效的办法。</p>

  <div class="card soft"><div class="card-t">一张表的三个追问</div><p>经营活动现金流是否长期为正？投资活动的流出是在扩张还是在维持？筹资活动是否过度依赖借款？这三个问题分别指向造血能力、扩张方向与债务压力。读懂这三问，现金流量表的基本信息就已经掌握了。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="accrual-vs-cash">
  <div class="chead">
    <span class="chnum">14</span>
    <div class="chead-body">
      <div class="kicker">卷二 · 看懂财报　入门 · 零基础 / 学生</div>
      <h2>权责发生制vs收付实现制</h2>
      <div class="desc">搞懂利润和现金为什么不是一回事，以及收入究竟在哪一刻才算"赚到"。</div>
    </div>
  </div>
  <div class="path-strip">前置：利润表到净利润　|　当前：<b>权责发生制vs收付实现制</b>　|　延伸：应收与存货的水分 · 现金流量表三活动</div>

  <h3>两把尺子，量的是不同的东西</h3>
  <p>读财报时最让人困惑的一件事，是利润表显示公司赚了钱，银行账户却没多出相应的现金。这未必是报表出错，而是两张表用了不同的确认标准。权责发生制（Accrual Basis）看的是权利与义务是否已经发生：只要商品交付、服务完成、收款权利确立，就算作本期收入，哪怕钱还没到账。收付实现制（Cash Basis）只看现金有没有实际进出：钱到了才算收入，钱付了才算费用。一个问"该不该算"，一个问"到没到钱"，口径不同，数字自然不同。</p>
  <p>两种标准没有绝对的优劣，它们服务于不同目的。企业日常记账、编制利润表要用权责发生制，因为它能把收入和为赚取这些收入付出的成本配在同一个期间，真实反映经营成果；而个人记账、一些小微企业以及现金流量表，则采用收付实现制，因为它简单直观，直接反映手头有没有钱。</p>

  <h3>收入确认的那一刻，而不是收到钱的那一刻</h3>
  <p>把收入确认的时点讲清楚，是理解权责发生制的关键。假设甲公司在 12 月向客户交付一批货物，合同约定次年 2 月付款。按权责发生制，这批货在 12 月就确认收入，同时记一笔应收账款；按收付实现制，要等到次年 2 月真正收到货款，才计入收入。同一笔生意，在两个体系里落到了不同的月份。反方向的情况也存在：客户提前预付了下一年的服务费，钱今年到账，但服务尚未提供，权责发生制下不能算今年收入，而要先记成一笔负债，等服务实际提供时再转为收入。</p>
  <div class="tbl-scroll"><table><thead><tr><th>业务情景（假设）</th><th>权责发生制</th><th>收付实现制</th></tr></thead><tbody><tr><td>12 月交货，次年 2 月收款</td><td>12 月确认收入</td><td>次年 2 月确认收入</td></tr><tr><td>今年预收明年服务费</td><td>先记负债，不确认收入</td><td>今年确认收入</td></tr><tr><td>本月计提工资，下月发放</td><td>本月确认费用</td><td>下月确认费用</td></tr></tbody></table></div>

  <h3>两套数字，各回答一个问题</h3>
  <p>权责发生制下算出的利润，衡量的是一段时期的经营成果：这段时间做了多少生意、消耗了多少资源。收付实现制下的现金流，衡量的是支付能力：账上到底有多少可用的钱，能不能按时发工资、还借款。一个偏"战绩"，一个偏"体力"，判断一家公司时两者缺一不可。利润好而现金差，提示货款可能没收回或存货积压；现金好而利润差，则可能来自预收款或变卖资产，未必代表主营业务健康。</p>
  <div class="formula">经营活动现金流 ≈ 净利润 + 非现金费用 − 营运资本增加</div>
  <div class="formula-note">这是用间接法从净利润推算经营活动现金流的核心思路。净利润按权责发生制计算，加回折旧摊销这类不花现金的费用，再扣除应收账款、存货增加等占用资金的部分。假设数据：净利润 150 万元，加回折旧 40 万元，减去应收与存货增加合计 70 万元，经营活动现金流约 120 万元。该式是简化表达，实际编制还需调整应付项目、税费等。</div>

  <h3>权责发生制的代价：估计与判断</h3>
  <p>权责发生制并非没有代价。因为它依赖"何时算完成"的判断，就给估计和选择留下了空间：收入确认时点能不能提前？坏账要计提多少？存货按什么方法计价？这些判断在合法范围内都会影响利润数字。这不是说权责发生制不可信，而是提醒读者：利润是一个经过加工的信息，它的质量取决于判断的审慎程度。看利润表时配套看附注、看现金流，正是对这种加工过程的必要交叉验证。</p>
  <div class="defn">
    <p>权责发生制：以权利和义务是否发生作为确认收入与费用的标准，而不以款项是否实际收付为准。</p>
    <p>收付实现制：以款项是否实际收到或付出作为确认标准，直接反映现金的流入与流出。</p>
  </div>

  <div class="card soft"><div class="card-t">把两张表对照着看</div><p>看到利润增长，先翻到现金流量表问一句：经营活动现金流同步增长了吗？看到经营现金流为负，再回到利润表追问：是应收变多、存货积压，还是正处于扩张投入期？把权责发生制的结果和收付实现制的结果放在一起，很多看似矛盾的数字就能得到解释。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="depreciation-capitalization">
  <div class="chead">
    <span class="chnum">15</span>
    <div class="chead-body">
      <div class="kicker">卷二 · 看懂财报　进阶 · 学生</div>
      <h2>折旧摊销与资本化</h2>
      <div class="desc">看清一笔支出如何先变成资产、再分期变成费用，以及这中间的判断空间。</div>
    </div>
  </div>
  <div class="path-strip">前置：利润表到净利润　|　当前：<b>折旧摊销与资本化</b>　|　延伸：应收与存货的水分 · 比率分析全景</div>

  <h3>支出不一定当期就成费用</h3>
  <p>企业花出一笔钱，未必立刻变成当期费用。买一台设备、投入一笔开发开支，往往要在多个会计期间里发挥作用；如果把全部成本压在付款那一年，那一年的利润会被严重压低，之后年份却凭空多出利润。为了更准确地匹配收入与成本，会计上把支出分成两条路：能带来未来经济利益的，先记作资产，再在使用期内分期转入费用，这条叫资本化；受益期仅限于当期、或与未来收益关系不明确的，直接在当期记作费用，这条叫费用化。这条分界线，是理解折旧与摊销的起点。</p>

  <h3>折旧：把资产成本摊到使用年限里</h3>
  <p>固定资产的成本通过折旧逐期进入利润表。折旧既不是资产评估，也不是真的把钱存起来买新设备，它只是一种成本分摊：当初买设备花出去的钱，在这台设备服务的每一年里确认一部分。最直观的是直线法。假设甲公司花 110 万元买一台设备，预计使用 10 年、期末残值 10 万元，那么每年折旧 =（110 − 10）÷ 10 = 10 万元。这里要特别强调：折旧额不随设备的市场报价变化，二手价涨了跌了，都不改变每年摊 10 万这个账务事实。</p>
  <div class="tbl-scroll"><table><thead><tr><th>折旧方法</th><th>计提特点</th><th>对前期利润的影响</th></tr></thead><tbody><tr><td>直线法</td><td>每年等额计提</td><td>平稳，不前低后高</td></tr><tr><td>加速折旧法</td><td>前期多提、后期少提</td><td>前期利润被压低，后期抬高</td></tr><tr><td>工作量法</td><td>按实际产量或工时计提</td><td>随开工率波动</td></tr></tbody></table></div>
  <div class="formula">年折旧额 =（资产原值 − 预计净残值）÷ 预计使用年限</div>
  <div class="formula-note">这是直线法的算法。原值含使资产达到可使用状态的相关支出，净残值是预计使用期满处置时能收回的金额，使用年限属于会计估计。假设数据：（110 − 10）÷ 10 = 10 万元/年。加速折旧法须按制度允许的方法计算，不能在年度间随意切换。</div>

  <h3>摊销，与折旧的同与不同</h3>
  <p>无形资产的成本分摊叫摊销，逻辑与折旧一致，只是对象换成了专利权、软件、土地使用权这类没有实物形态的资产。两者关键差别在于：折旧通常要考虑净残值，摊销一般按预计使用年限平均摊完，而且当使用年限受法律或合同约束时，不能由企业随意拉长。比如一项花 60 万元购入的软件使用权，合同约定 5 年，每年摊销 12 万元，这个年限就不是管理层想延长就能延长的。理解这一点，就能明白为什么无形资产较多的公司，利润对"摊销年限"这一假设格外敏感。</p>

  <h3>判断空间：年限与方法如何改变利润</h3>
  <p>折旧年限、净残值、折旧方法一经确定不能随意更改，但确定之初的估计会显著影响利润。仍用上面那台设备：若使用年限从 10 年改成 8 年，年折旧从 10 万元升到 12.5 万元，当年利润相应减少；若预计净残值从 10 万元抬到 30 万元，年折旧降到 8 万元，利润就被抬高。这些调整都可以合规进行，但读者应当追问：变化有没有业务上的理由？是不是为了抹平利润波动？把折旧政策与同行业口径对照，是识别这类影响的有效办法。</p>
  <div class="defn">
    <p>资本化：把符合条件的支出记作资产，在其受益期内逐期转为费用，而不是一次性计入当期损益。</p>
    <p>折旧：固定资产成本在使用年限内的系统分摊；摊销：无形资产成本在使用年限内的系统分摊。</p>
  </div>

  <h3>资本化的边界，也是风险点</h3>
  <p>资本化还有一条更微妙的边界：什么样的支出够格记作资产？开发支出、装修费用、大额维护，在实务中都可能被资本化。规则要求只有在未来经济利益很可能流入、金额能够可靠计量时才可资本化，但"很可能"本身就包含判断。过度资本化会把当期费用推到以后年度，短期内抬高利润，代价是未来若干年都要背着摊销包袱。读财报时若发现某公司利润上升，而无形资产、长期待摊费用也在同步膨胀，就需要多问一句：这些投入真的能带来未来收益吗？</p>

  <div class="card soft"><div class="card-t">把折旧加回来看</div><p>折旧摊销是不花现金的费用，因此评估一家公司的现金创造能力时，常把折旧加回净利润。但要记住：加回只是为了还原现金流，不等于这笔钱真的"省下来了"——设备终归要更新，只是更新的时点未必与折旧的年份重合。既看加回后的现金流，也看资本支出，才是完整的判断。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="receivables-inventory">
  <div class="chead">
    <span class="chnum">16</span>
    <div class="chead-body">
      <div class="kicker">卷二 · 看懂财报　进阶 · 学生 / 实操</div>
      <h2>应收与存货的水分</h2>
      <div class="desc">学会用账龄、减值准备和周转率，看出资产负债表里那些"还没变成钱"的部分。</div>
    </div>
  </div>
  <div class="path-strip">前置：权责发生制vs收付实现制　|　当前：<b>应收与存货的水分</b>　|　延伸：比率分析全景 · 营运资本与现金周期</div>

  <h3>收入确认了，钱还在路上</h3>
  <p>应收账款是权责发生制的直接产物：当企业确认收入但客户尚未付款时，差额就挂在应收账款上。它既是一项资产，代表收取款项的权利，也提示这笔收入还没有变成现金。假设甲公司全年营业收入 1000 万元，其中 250 万元是赊销形成的应收，那么真正"落袋"的部分只有 750 万元。应收本身并不是坏事，适度赊销是正常的商业条件；需要警惕的是应收的增长速度与收入增长速度严重脱节——那往往意味着增长是靠放宽信用条件换来的。</p>

  <h3>账龄与坏账：质量比数量更重要</h3>
  <p>同样一笔应收账款，账龄不同，回收概率差别很大。账龄分析法把应收按拖欠时间分组：三个月以内的通常比较安全，超过一年的回收风险明显上升，超过三年的可能只剩很小一部分能收回。会计上对预计收不回的部分计提坏账准备，计入当期费用。假设某公司应收账款余额 200 万元，其中 140 万元账龄在三个月以内、40 万元在三到六个月、20 万元超过一年并按 50% 计提坏账，那么坏账准备合计 12 万元，资产负债表上列示的账面价值为 188 万元。这个"账面价值"，才是扣除水分之后的数字。</p>
  <div class="tbl-scroll"><table><thead><tr><th>账龄（假设）</th><th>余额</th><th>计提比例</th><th>坏账准备</th></tr></thead><tbody><tr><td>三个月以内</td><td>140 万</td><td>0%</td><td>0</td></tr><tr><td>三到六个月</td><td>40 万</td><td>5%</td><td>2 万</td></tr><tr><td>一年以上</td><td>20 万</td><td>50%</td><td>10 万</td></tr><tr><td>合计</td><td>200 万</td><td>—</td><td>12 万</td></tr></tbody></table></div>

  <h3>存货：压在仓库里的资金</h3>
  <p>存货包括原材料、在产品和产成品。它同样属于资产，但离现金更远一步：要先卖出去、变成应收，再收回货款，才算走完循环。存货过多会占用资金、增加仓储成本，还可能因过时或变质而贬值。会计上对成本高于可变现净值的部分计提存货跌价准备。假设某制造企业存货账面成本 250 万元，其中一批产品因更新换代只能折价出售，可变现净值 40 万元、成本 60 万元，就要计提 20 万元跌价准备，存货账面价值降为 230 万元。这类减值一旦计提，通常不能随意转回，因此它也是判断管理层是否激进的一个观察点。</p>

  <h3>周转率：把余额与流量放在一起</h3>
  <p>单独看应收 200 万元或存货 250 万元，很难判断是高是低，必须与收入、成本这些"流量"指标配合。应收账款周转率 = 营业收入 ÷ 平均应收账款，反映一年里应收转成收入多少次；存货周转率 = 营业成本 ÷ 平均存货，反映存货一年周转几次。周转天数 = 360 ÷ 周转率，把"次数"翻译成"平均多少天周转一次"。假设数据：营业收入 1000 万元、平均应收 200 万元，应收周转率 5 次、周转天数 72 天；营业成本 600 万元、平均存货 240 万元，存货周转率 2.5 次、周转天数 144 天。</p>
  <div class="formula">应收账款周转率 = 营业收入 ÷ 平均应收账款<br>存货周转率 = 营业成本 ÷ 平均存货</div>
  <div class="formula-note">平均余额通常取期初与期末的算术平均；分子用营业收入还是含税销售额、分母用余额还是平均余额，不同口径结果会有差异，跨公司比较必须先统一。周转天数 = 360 ÷ 周转率，天数越短一般意味着资金占用越少，但过短也可能反映信用政策过紧、错失客户，需结合行业特征判断。</div>

  <h3>交叉验证：增长是不是靠赊销堆出来的</h3>
  <p>把增长和周转放在一起看，常常能发现单看利润看不出的问题。假设甲公司今年收入增长 20%，应收账款却增长 80%，这意味着新增收入里很大一部分还没有变成钱，可能是放宽了信用条件换来的。同样的逻辑适用于存货：存货增速明显高于营业成本增速，可能预示产品滞销。这里强调的是"预警"而非"定罪"——周转恶化有可能是扩张期的正常现象，也可能来自行业季节波动，它提示你进一步追问，而不是直接下结论。</p>
  <div class="defn">
    <p>坏账准备：对应收账款中预计无法收回的部分预先计提的损失，作为应收的抵减项目列示。</p>
    <p>存货跌价准备：存货成本高于其可变现净值部分计提的损失，反映存货的实际贬值。</p>
  </div>

  <div class="card soft"><div class="card-t">三步检查法</div><p>先看余额：应收和存货是不是明显变大？再看结构：账龄分布、库龄分布有没有恶化？最后看速度：周转率是不是持续下降？三步走完，你就能把"数字变大了"这个模糊印象，变成"哪一类资产出了问题、严重到什么程度"的具体判断。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>
`;

<script>
window.__CH_VOL3 = `
<section class="chapter" data-id="ratio-overview">
  <div class="chead">
    <span class="chnum">19</span>
    <div class="chead-body">
      <div class="kicker">卷三 · 分析与估值　进阶 · 学生 / 实操</div>
      <h2>比率分析全景</h2>
      <div class="desc">把孤立的数字变成可比较的指标，建立一张看财报的"体检表"。</div>
    </div>
  </div>
  <div class="path-strip">前置：资产负债表拆解 · 利润表到净利润　|　当前：<b>比率分析全景</b>　|　延伸：杜邦分析ROE · 相对估值PEPBPS</div>

  <h3>为什么要把数字变成比率</h3>
  <p>财报上的绝对数很难直接比较。甲公司净利润 1 亿元，乙公司 2000 万元，能说甲公司更强吗？如果甲公司资产有 200 亿元而乙公司只有 5 亿元，结论可能完全相反。比率的本质是把两个相关数字相除，消除规模差异，让不同体量的公司站在同一条线上。它还能揭示结构：毛利率告诉你每 100 元收入里有多少是毛利，资产负债率告诉你每 100 元资产里有多少是借来的。一个设计得当的比率，往往比一堆绝对数更能说明问题。</p>

  <h3>四类比率，四个观察角度</h3>
  <p>实务中通常把比率分成四组。偿债能力看"能不能按时还钱"，包括流动比率、资产负债率、利息保障倍数；营运能力看"资产用得勤不勤"，包括存货周转率、应收账款周转率、总资产周转率；盈利能力看"赚钱效率高不高"，包括毛利率、净利率、净资产收益率；成长能力看"规模扩张快不快"，包括营业收入增长率、净利润增长率。四组分别对应安全、效率、回报、前景，缺任何一组，公司画像都不完整。</p>
  <div class="tbl-scroll"><table><thead><tr><th>类别</th><th>代表指标（假设）</th><th>回答的问题</th></tr></thead><tbody><tr><td>偿债能力</td><td>资产负债率 40%</td><td>借来的钱占比多高，能否按时偿还</td></tr><tr><td>营运能力</td><td>存货周转率 2.5 次</td><td>资产周转快不快，有没有积压</td></tr><tr><td>盈利能力</td><td>净利率 15%</td><td>每元收入最终留下多少利润</td></tr><tr><td>成长能力</td><td>收入增长率 20%</td><td>规模是在扩张还是收缩</td></tr></tbody></table></div>
  <div class="defn">
    <p>比率分析：通过将两个相关财务项目相除，消除规模差异、揭示结构关系，从而评价企业经营与财务状况的方法。</p>
    <p>共同比报表：把报表各项目表示为某一基准项目的百分比，便于比较结构及其变化。</p>
  </div>

  <h3>比怎么比：横向、纵向与结构</h3>
  <p>算出一个比率只是起点，关键在于比较。横向比较是与同行比：把公司的毛利率放进行业区间，才知道 35% 究竟算高还是算低。纵向比较是与自己的历史比：连续五年的净利率若单边下滑，即便绝对值仍不错，也值得追查原因。第三种是结构比较，也就是共同比分析——把利润表每项都写成收入的百分比，把资产负债表每项都写成总资产的百分比，结构变化便一目了然。下面的雷达图用假设数据把某制造企业五个维度的表现画在一起，便于直观看到长处与短板。</p>
  <div class="chart-box"><canvas id="ratioRadar"></canvas><div class="cap">图注：假设数据，某制造企业在偿债、营运、盈利、成长、现金流五个维度上的比率表现（教学示意，各维度已标准化）。</div></div>
  <div class="formula">共同比 = 某项目金额 ÷ 基准项目金额 × 100%</div>
  <div class="formula-note">基准项目在利润表通常取营业收入，在资产负债表通常取资产总额。假设数据：营业收入 1000 万元、销售费用 120 万元，销售费用共同比 = 12%，表示每 100 元收入中有 12 元用于销售费用。比较不同期间或不同公司时，必须保持基准口径一致，否则百分比不可比。</div>

  <h3>比率的局限：四个常见误区</h3>
  <p>比率好用，也很容易被误用。第一，口径要一致：不同公司的折旧方法、收入确认时点可能不同，直接比数字会失真。第二，时点指标与时期指标要匹配：资产负债表余额是时点数，利润表金额是时期数，计算周转率时用期末余额还是平均余额，结果会有差异。第三，比率受会计估计影响，净利率高可能是成本控制的功劳，也可能是折旧年限拉长的结果。第四，单一比率容易被短期行为修饰，比如期末临时偿还借款，就能把流动比率做得好看。因此比率应当成组使用，并结合附注与现金流交叉验证。</p>

  <div class="card soft"><div class="card-t">先看套路，再看数字</div><p>面对一组比率，先问三件事：这些指标是不是同一口径？和谁比、比的是什么期间？有没有某个指标与其他指标相互矛盾？三问过后，再去看具体高低。顺序反过来，就容易盯着一个漂亮数字得出过头结论。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="dupont-roe">
  <div class="chead">
    <span class="chnum">20</span>
    <div class="chead-body">
      <div class="kicker">卷三 · 分析与估值　进阶 · 学生 / 实操</div>
      <h2>杜邦分析ROE</h2>
      <div class="desc">把股东回报拆成三块，看清高ROE究竟来自哪条路，以及各自藏着什么风险。</div>
    </div>
  </div>
  <div class="path-strip">前置：比率分析全景　|　当前：<b>杜邦分析ROE</b>　|　延伸：营运资本与现金周期 · 股利折现与DCF</div>

  <h3>ROE 为什么值得单独研究</h3>
  <p>净资产收益率（ROE）衡量股东每投入 1 元资本，一段时间里赚回多少利润。它把利润表的净利润与资产负债表的股东权益连在一起，是评价公司为股东创造价值效率的核心指标。假设甲公司净利润 150 万元，平均所有者权益 1000 万元，那么 ROE = 15%。这个数字看似简单，背后却可能藏着完全不同的经营路径：一家公司靠高利润率赚钱，另一家靠薄利多销、快速周转赚钱，还有一家主要靠借钱放大回报。三条路的风险截然不同，只看 ROE 数字无法区分，这正是杜邦分析要解决的问题。</p>

  <h3>杜邦拆解：三个因子相乘</h3>
  <p>杜邦分析的思路，是把 ROE 拆成三个因子的乘积，让每条路径现形。净利率 = 净利润 ÷ 营业收入，衡量每元收入留下多少利润，代表盈利能力；总资产周转率 = 营业收入 ÷ 平均总资产，衡量每元资产创造多少收入，代表运营效率；权益乘数 = 平均总资产 ÷ 平均所有者权益，衡量资产中有多少靠负债撬动，代表财务杠杆。三者相乘恰好等于 ROE，因为收入和总资产在相乘过程中相互抵消。这不是巧合，而是代数上的恒等变形。</p>
  <div class="formula">ROE = 净利率 × 总资产周转率 × 权益乘数<br>= (净利润 ÷ 营业收入) × (营业收入 ÷ 平均总资产) × (平均总资产 ÷ 平均所有者权益)</div>
  <div class="formula-note">这是三因子杜邦分解式。前提是使用同一会计期间的数据，平均余额取期初与期末的算术平均。假设数据：净利率 15%、总资产周转率 0.5 次、权益乘数 2，则 ROE = 15% × 0.5 × 2 = 15%。若公司没有负债，权益乘数为 1，杠杆项不影响结果。</div>

  <h3>用一组假设数据走一遍</h3>
  <p>把上文的例子补全。某制造企业营业收入 1000 万元，净利润 150 万元，平均总资产 2000 万元，平均所有者权益 1000 万元。净利率 = 150 ÷ 1000 = 15%；总资产周转率 = 1000 ÷ 2000 = 0.5 次；权益乘数 = 2000 ÷ 1000 = 2；三者相乘 = 15%，与 ROE = 150 ÷ 1000 = 15% 完全一致。下面的树状图把这条分解路径画出来，从 ROE 往下逐层展开到三个因子，便于看清每个数字来自哪里。</p>
  <div class="chart-box"><canvas id="dupontTree"></canvas><div class="cap">图注：假设数据，ROE 的三因子杜邦分解树——净利率、总资产周转率、权益乘数及其分子分母（教学示意）。</div></div>
  <div class="tbl-scroll"><table><thead><tr><th>因子</th><th>假设值</th><th>代表的能力</th></tr></thead><tbody><tr><td>净利率</td><td>15%</td><td>每 100 元收入留下 15 元利润</td></tr><tr><td>总资产周转率</td><td>0.5 次</td><td>每 1 元资产创造 0.5 元收入</td></tr><tr><td>权益乘数</td><td>2</td><td>资产总额是股东权益的 2 倍</td></tr></tbody></table></div>

  <h3>三条路径，三种风险</h3>
  <p>拆解的价值在于归因。假设两家公司 ROE 都是 15%：甲公司靠净利率 15%、周转率 0.5、乘数 2；乙公司靠净利率 5%、周转率 1.5、乘数 2。甲的利润率高，可能来自品牌溢价或成本优势；乙的周转率高，往往是薄利多销、资产较轻的模式。两者的护城河和脆弱点完全不同。第三种情况更值得警惕：如果 ROE 主要靠权益乘数撑起来，说明高回报来自高负债，一旦经营现金流下滑，偿债压力会迅速放大风险。把分解结果放回行业背景里看，才知道哪种组合更可持续。</p>

  <h3>拆解的边界在哪</h3>
  <p>杜邦分析不是万能的。它依赖会计数字，而净利润本身受折旧、减值、应收计提等估计影响；周转率使用平均资产，可能掩盖资产在期内的剧烈变化；权益乘数只看总量，不区分有息负债与无息负债，而这两种负债的偿债压力差别很大。此外，分解只解释"过去为什么"，不能直接预测未来。把杜邦结果与现金流分析、行业特征放在一起看，结论才会更稳。</p>
  <div class="defn">
    <p>净资产收益率（ROE）：净利润与平均所有者权益的比值，衡量股东投入资本的回报效率。</p>
    <p>权益乘数：资产总额相当于股东权益的倍数，倍数越高说明财务杠杆越强。</p>
  </div>

  <div class="card soft"><div class="card-t">别把高ROE一句话带过</div><p>看到 ROE 达到 20%，不要立刻给出"经营优秀"的结论。先拆开看：净利率是不是靠一次性收益撑起来的？周转率是不是异常高、有没有可能是资产已大幅减值？权益乘数是不是明显高于同行？拆完再下判断，才算真正读懂了这个数字。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="working-capital-cycle">
  <div class="chead">
    <span class="chnum">21</span>
    <div class="chead-body">
      <div class="kicker">卷三 · 分析与估值　进阶 · 学生 / 实操</div>
      <h2>营运资本与现金周期</h2>
      <div class="desc">看清一家公司从付钱采购到收回货款之间，资金究竟被占用了多久。</div>
    </div>
  </div>
  <div class="path-strip">前置：应收与存货的水分　|　当前：<b>营运资本与现金周期</b>　|　延伸：杜邦分析ROE · 股利折现与DCF</div>

  <h3>营运资本是什么</h3>
  <p>营运资本通常指流动资产减去流动负债，反映企业在日常经营中垫付的净资金。它不是越多越好，也不是越少越好：太少可能导致周转失灵，无法按时支付供应商与员工；太多则说明大量资金躺在存货和应收账款里，没有参与创造收益。理解这个概念，关键是看清资金的旅程：企业先付钱买原料，原料变成在产品、产成品，卖出去形成应收，最后收回现金。这段旅程每多走一天，资金就被多占用一天，而资金占用是有成本的。</p>

  <h3>现金周期的三段路</h3>
  <p>现金转换周期把这段旅程拆成三段时间。存货周转天数，是从购入存货到卖出存货平均需要的天数；应收账款周转天数，是从确认收入到收回货款的平均天数；应付账款周转天数，是从收到供应商货物到实际付款的平均天数。前两段是资金被自己占用的时间，第三段是占用别人资金的时间，因此现金周期等于存货天数加应收天数，再减去应付天数。减法这一步很关键：供应商给账期，等于为企业提供了一笔无息资金。</p>
  <div class="formula">现金周期 = 存货周转天数 + 应收账款周转天数 − 应付账款周转天数<br>存货周转天数 ≈ 360 ÷ (营业成本 ÷ 平均存货)<br>应收账款周转天数 ≈ 360 ÷ (营业收入 ÷ 平均应收账款)</div>
  <div class="formula-note">360 为假设的一年天数（也可按 365 计算，但须与比较对象口径一致）；分母用平均余额，取期初与期末的算术平均。应付账款周转天数同理，分母为平均应付账款。该指标衡量企业从付出采购现金到收回销售现金之间的净天数，前提是使用同一会计期间的数据，且应付账款主要指经营性应付。</div>

  <h3>用假设数据算一遍</h3>
  <p>某制造企业一年中：平均存货 240 万元，营业成本 600 万元，存货周转率 = 600 ÷ 240 = 2.5 次，存货天数 = 360 ÷ 2.5 = 144 天；平均应收账款 200 万元，营业收入 1000 万元，应收周转率 5 次，应收天数 72 天；平均应付账款 150 万元，应付周转率 = 600 ÷ 150 = 4 次，应付天数 90 天。代入公式：现金周期 = 144 + 72 − 90 = 126 天。这意味着公司平均每 126 天，才完成一次"付钱—生产—销售—收款"的循环，这段时间里资金是被锁住的。</p>
  <div class="tbl-scroll"><table><thead><tr><th>环节</th><th>假设天数</th><th>含义</th></tr></thead><tbody><tr><td>存货周转天数</td><td>144 天</td><td>存货平均压在库里的时间</td></tr><tr><td>应收账款周转天数</td><td>72 天</td><td>赊销后平均收回货款的时间</td></tr><tr><td>应付账款周转天数</td><td>90 天</td><td>平均占用供应商资金的时间</td></tr><tr><td>现金周期</td><td>126 天</td><td>净占用自有资金的时间</td></tr></tbody></table></div>

  <h3>周期长短说明什么</h3>
  <p>现金周期越短，同样的销售规模下占用资金越少，对外部融资的依赖也越低。零售业的企业常常接近零甚至为负——先收到顾客现金，过一段时间才付供应商货款，等于用别人的钱做生意。重资产制造企业的周期则普遍较长，资金沉淀在生产环节。周期拉长的信号要拆开看：是存货卖不动，还是客户回款变慢，还是供应商缩短了账期？三种原因对应完全不同的应对办法，笼统地说"资金周转慢"没有帮助。</p>

  <h3>缩短周期的代价与边界</h3>
  <p>缩短周期并非没有代价。压缩存货可能带来缺货、错失订单；收紧信用政策可能赶走客户；拖延付款会损伤与供应商的关系，甚至失去更优惠的采购条件。真正可持续的改善来自流程本身——按需生产减少积压、加强应收管理加快回款、与供应商协商更合理的账期，而不是简单地把压力转嫁给上下游。判断一家公司的营运资本管理是否健康，既要看周期数字，也要看它与行业惯例、商业模式的匹配程度。</p>
  <div class="defn">
    <p>营运资本：流动资产减去流动负债后的净额，反映日常经营中净投入的资金。</p>
    <p>现金转换周期：从支付采购现金到收回销售现金的平均净天数，衡量资金的占用时间。</p>
  </div>

  <div class="card soft"><div class="card-t">把周期翻译成一句话</div><p>如果现金周期是 126 天，可以试着这样向自己复述："公司每做一笔生意，要先垫钱约四个月，之后钱才回来。"这句话比一堆公式更容易记住，也更容易发现异常——当你知道一家公司的账期只有 30 天、周转却要 120 天，资金缺口有多大就一目了然。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="annuity-tvm">
  <div class="chead">
    <span class="chnum">22</span>
    <div class="chead-body">
      <div class="kicker">卷三 · 分析与估值　进阶 · 学生</div>
      <h2>年金与现值终值</h2>
      <div class="desc">把一串等额、定期的现金流折算到同一时点，学会年金终值与现值的算法。</div>
    </div>
  </div>
  <div class="path-strip">前置：钱的时间价值　|　当前：<b>年金与现值终值</b>　|　延伸：股利折现与DCF · 相对估值PEPBPS</div>

  <h3>年金是什么</h3>
  <p>年金指在一定时期内、每隔相同时间收到或支付的一串等额款项。分期偿还的贷款、逐期领取的养老金、按年缴纳的租金，都是现实中的年金。之所以要单独研究，是因为逐笔折现虽然准确，但当期数很多时十分繁琐；年金公式把一串现金流打包处理，一步算出它的现值或终值。这里先讨论最常见的普通年金——每期期末发生收付的那种，这也是贷款和债券中最常见的安排。</p>

  <h3>普通年金终值：每期存一点，最后有多少</h3>
  <p>年金终值回答：如果每期期末存入一笔钱，到第 n 期末连本带息一共变成多少？假设甲公司每年年末存入 100 万元，年利率 5%，连续存 5 年。第一笔存满 4 年，最后一笔只存了 0 年，因此各笔的终值不同，把它们相加就得到总终值。公式已经把这段等比求和的过程压缩好了，使用时只需确认三个条件：金额相等、间隔均匀、利率口径与期数一致。</p>
  <div class="formula">普通年金终值 FV = C × [ (1 + r)^n − 1 ] ÷ r</div>
  <div class="formula-note">C 为每期末收付的等额款项，r 为每期利率，n 为期数。要求 r ≠ 0，且款项发生在每期期末，r 与 n 的口径必须一致（按年存款用年利率，按月存款用月利率）。假设数据：C = 100 万元、r = 5%、n = 5，FV = 100 × (1.05^5 − 1) ÷ 0.05 ≈ 552.56 万元。</div>

  <h3>普通年金现值：未来的串钱，今天值多少</h3>
  <p>年金现值回答：未来一串等额款项，折算到今天一共值多少？它是终值的镜像，也是贷款定价与债券估值的基础。假设一项合约约定每年年末支付 100 万元，共 5 年，折现率 5%，把五笔钱分别折回今天再加总，就得到现值。折现率越高，现值越低，因为未来的钱在更高的机会成本下"更不值钱"。</p>
  <div class="formula">普通年金现值 PV = C × [ 1 − (1 + r)^(−n) ] ÷ r</div>
  <div class="formula-note">符号含义同上，r 为折现率，n 为期数，要求 r ≠ 0 且付款发生在每期期末。假设数据：C = 100 万元、r = 5%、n = 5，PV = 100 × [1 − 1.05^(−5)] ÷ 0.05 ≈ 432.95 万元。注意现值与终值使用同一组 C、r、n，只是折现方向相反。</div>

  <h3>预付年金与永续年金</h3>
  <p>如果款项在每期期初收付，叫预付年金。同样条件下，预付年金的每一笔都比普通年金多计息一期，因此终值与现值都等于普通年金结果乘以 (1 + r)。上面那个 5 年期、每年 100 万元的例子，若改为年初付款，终值约为 552.56 × 1.05 ≈ 580.19 万元。另一种极端是永续年金——没有到期日、一直支付下去，它的现值有一个极简表达式：PV = C ÷ r。假设每年永久支付 100 万元、折现率 5%，现值就是 2000 万元。</p>
  <div class="tbl-scroll"><table><thead><tr><th>类型</th><th>收付时点</th><th>期限</th><th>计算特点</th></tr></thead><tbody><tr><td>普通年金</td><td>每期期末</td><td>有限 n 期</td><td>使用基准公式</td></tr><tr><td>预付年金</td><td>每期期初</td><td>有限 n 期</td><td>基准结果 × (1 + r)</td></tr><tr><td>永续年金</td><td>每期期末</td><td>无限期</td><td>现值 = C ÷ r</td></tr></tbody></table></div>
  <div class="chart-box"><canvas id="annuityTL"></canvas><div class="cap">图注：假设数据，年金时间轴示意——普通年金在每期期末（1 至 n）收付，预付年金在每期期初（0 至 n−1）收付（教学示意）。</div></div>

  <h3>用对公式的前提</h3>
  <p>年金公式好用，前提是对得上。第一，每期金额必须相等，不等额的现金流只能逐笔折现再相加。第二，间隔必须均匀，且利率口径与间隔一致——按月付款要用月利率，不能拿年利率直接套进去。第三，要分清期初还是期末，差一个时点，结果就差一个 (1 + r) 因子。第四，折现率的选择本身带有判断，它应反映资金的机会成本与相应风险，而不是随手填的一个数字。</p>
  <div class="defn">
    <p>年金：在一定时期内每期等额收付的系列款项，按收付时点分为普通年金与预付年金。</p>
    <p>永续年金：没有到期日、无限期等额收付的年金，其现值为每期金额除以折现率。</p>
  </div>

  <div class="card soft"><div class="card-t">画一条时间轴再动笔</div><p>年金题最容易错在时点。做题前先在纸上画一条时间轴，标出 0、1、2、3……n，再把每笔钱放到对应位置：普通年金从 1 开始，预付年金从 0 开始。位置摆对了，选公式就水到渠成；位置摆错了，算得再快也是错的。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="dcf-ddm">
  <div class="chead">
    <span class="chnum">24</span>
    <div class="chead-body">
      <div class="kicker">卷三 · 分析与估值　进阶 · 学生 / 实操</div>
      <h2>股利折现与DCF</h2>
      <div class="desc">用未来现金流折回今天，理解内在价值怎么算，以及它对假设有多敏感。</div>
    </div>
  </div>
  <div class="path-strip">前置：年金与现值终值 · 杜邦分析ROE　|　当前：<b>股利折现与DCF</b>　|　延伸：相对估值PEPBPS · 估值陷阱与安全边际</div>

  <h3>内在价值的基本思路</h3>
  <p>前面几章教的是怎么读一家公司，这一章开始回答一个更直接的问题：它值多少钱？内在价值法的基本信念是，一项资产的价值等于它未来能带来的全部现金折回今天后的总和。这个思路把估值变成一道翻译题：把分散在未来的现金，用合适的折现率搬到今天，再相加。它不依赖市场情绪，但非常依赖对未来现金与折现率的判断——输入稍有变化，结果就明显不同。承认这一点，是正确使用模型的前提。</p>

  <h3>股利折现与戈登增长模型</h3>
  <p>如果假设公司长期稳定经营、每年分红，且股利以固定比例 g 持续增长，就可以用戈登增长模型一步算出价值。假设甲公司下一期每股股利 2 元，股东要求回报率 10%，永续增长率 3%，那么 V = 2 ÷ (10% − 3%) ≈ 28.6 元。这个模型非常简洁，却有一条硬约束：g 必须小于 r。否则分母为零或为负，公式在数学上失效，经济含义也不成立——一家公司的永续增长率不可能长期超过整个经济所要求的回报率。</p>
  <div class="formula">V = D₁ ÷ (r − g)，其中必须满足 g < r</div>
  <div class="formula-note">D₁ 为下一期股利，r 为股权要求回报率（折现率），g 为永续增长率。前提有三：g < r；公司已进入稳定期；分红政策与增长率可持续。假设数据：D₁ = 2 元、r = 10%、g = 3%，V ≈ 28.6 元。注意 g 每变动一个百分点，结果都会大幅改变，因此这个模型对 g 的假设格外敏感。</div>

  <h3>DCF：从股利换到自由现金流</h3>
  <p>很多公司并不分红，或者分红与盈利能力脱节，这时更常用的口径是自由现金流——企业在满足必要再投资之后，真正可以自由支配的现金。DCF 模型把未来若干年的自由现金流逐年折现，再加上期末终值，得到企业整体价值。终值通常用戈登公式估算，前提同样是公司进入稳定增长阶段且 g < r。假设数据：未来 5 年自由现金流分别为 80、90、100、110、120 万元，折现率 10%，终值按第 5 年后永续增长 3% 估计，逐年折现相加即可得到企业价值的近似数。</p>
  <div class="formula">V = Σ FCFₜ ÷ (1 + r)^t + TV ÷ (1 + r)^n　　TV = FCFₙ₊₁ ÷ (r − g)</div>
  <div class="formula-note">FCFₜ 为第 t 期的自由现金流，r 为折现率（通常用加权平均资本成本），n 为详细预测期年数，TV 为预测期末的终值，g 为终值阶段的永续增长率且必须 g < r。假设数据见正文。Σ 表示把第 1 年到第 n 年的折现值逐项相加；终值也要按第 n 期折回今天，不能直接与原值相加。</div>

  <h3>敏感性：模型最诚实的部分</h3>
  <p>DCF 最容易被误解的地方，是有人把算出的那个数字当成"精确答案"。事实上，折现率从 10% 调到 9%，或永续增长率从 3% 调到 4%，估值结果可能相差两成以上。下面这张敏感性图用假设数据展示：在 r 与 g 的不同组合下，同一家公司的估值如何变化。这张图传达的信息比单一数字更重要——估值是一个区间，不是一个点。把假设的变化范围画出来，比反复调整参数去凑一个舒服的数字更有意义。</p>
  <div class="chart-box"><canvas id="dcfSens"></canvas><div class="cap">图注：假设数据，DCF 估值对折现率 r 与永续增长率 g 的敏感性——行列不同组合下估值结果的差异（教学示意，g 均小于 r）。</div></div>

  <h3>模型的边界</h3>
  <p>内在价值法的局限同样明显。第一，终值往往占估值结果的很大比重，而它依赖最遥远的假设；第二，折现率难以精确确定，风险溢价的选择带有主观判断；第三，自由现金流本身来自会计数字，受资本支出节奏、营运资本波动影响，单一年份可能失真。因此 DCF 更适合用来识别明显偏高或偏低的情形，而不是给出精确到小数点的定价。把模型结果与相对估值、情景分析放在一起，判断才会更稳健。</p>
  <div class="defn">
    <p>内在价值：由资产未来可产生的现金流折现决定的价值，区别于市场短期形成的交易价格。</p>
    <p>自由现金流：企业在维持必要经营与再投资之后，可供债权人、股东等分配而不影响持续经营的现金。</p>
  </div>

  <div class="card soft"><div class="card-t">先改假设，再看结果</div><p>用 DCF 时不妨养成习惯：先把 g 和 r 各调高调低一档，看看结果落在什么区间。如果区间很宽，说明这个估值对假设高度敏感，结论应当保留余地；如果结论只在某个特定假设下才成立，更要追问那个假设凭什么成立。模型的价值在于暴露判断，而不是掩盖判断。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="relative-valuation">
  <div class="chead">
    <span class="chnum">25</span>
    <div class="chead-body">
      <div class="kicker">卷三 · 分析与估值　进阶 · 实操</div>
      <h2>相对估值PEPBPS</h2>
      <div class="desc">用可比公司的价格倍数给资产定位，并看懂倍数背后的驱动因素。</div>
    </div>
  </div>
  <div class="path-strip">前置：股利折现与DCF · 比率分析全景　|　当前：<b>相对估值PEPBPS</b>　|　延伸：估值陷阱与安全边际</div>

  <h3>相对估值的思路</h3>
  <p>相对估值不试图算出一个绝对价值，而是先用同类资产当尺子：如果同行业、同模式、同阶段的公司普遍按某个价格倍数交易，那么目标公司也应当落在相近区间。它的优点是简单、贴近市场，缺点是完全依赖"可比"这个前提——如果整个行业都被推高，相对估值会告诉你这家公司"合理"，却无法提示系统性风险。所以它适合回答"在同类中偏高还是偏低"，而不是"到底值多少"。清楚这个边界，才能用好这个工具。</p>

  <h3>PE：最常用的那把尺</h3>
  <p>市盈率 PE = 每股市价 ÷ 每股收益，也可以理解为按当前盈利水平，多少年的利润能覆盖价格。假设甲公司每股市价 20 元，每股收益 2 元，PE = 10 倍。倍数高低受什么驱动？经典框架把 PE 与增长率、分红率联系起来：增长更快、分红更稳定的公司往往享有更高倍数；盈利波动大、依赖一次性收益的公司，倍数通常被压低。因此比较 PE 之前，必须先看清盈利质量，不能只比数字大小。</p>
  <div class="formula">PE = 每股市价 ÷ 每股收益（EPS）<br>EPS = 归属于普通股股东的净利润 ÷ 发行在外普通股加权平均数</div>
  <div class="formula-note">分母通常用最近四个季度的滚动每股收益，也可用预测每股收益，但必须与比较对象保持同一口径。假设数据：每股市价 20 元、每股收益 2 元，PE = 10 倍。若每股收益含一次性收益，应先剔除后再计算，否则倍数会被人为压低，失去可比性。</div>

  <h3>PB 与 PS：换个角度看价格</h3>
  <p>市净率 PB = 每股市价 ÷ 每股净资产，适合资产密集、账面价值有意义的行业，如制造与金融；它不依赖当期盈利，因此在亏损年份仍能比较。市销率 PS = 每股市价 ÷ 每股销售收入，适合尚在投入期、利润暂时为负的公司，因为收入比利润更稳定、也更难被会计手段影响。三种倍数各有盲区：PE 受盈利波动与一次性项目干扰，PB 对轻资产公司几乎失效，PS 则完全不看成本与盈利能力。把它们搭配使用，比单用一种更可靠。</p>
  <div class="tbl-scroll"><table><thead><tr><th>倍数</th><th>公式（假设）</th><th>适用场景</th><th>主要盲区</th></tr></thead><tbody><tr><td>PE</td><td>股价 20 元 ÷ EPS 2 元 = 10 倍</td><td>盈利较稳定</td><td>一次性损益扭曲盈利</td></tr><tr><td>PB</td><td>股价 20 元 ÷ 每股净资产 10 元 = 2 倍</td><td>资产密集型行业</td><td>轻资产公司会失真</td></tr><tr><td>PS</td><td>股价 20 元 ÷ 每股收入 8 元 = 2.5 倍</td><td>早期或暂时亏损</td><td>忽略成本与盈利能力</td></tr></tbody></table></div>

  <h3>怎么比才有意义</h3>
  <p>倍数要放在两个坐标里看。第一是自己的历史区间：把某公司过去若干年的 PE 画成带状图，可以看出当前处在自身的高位还是低位。第二是可比公司：选业务结构、规模、成长阶段相近的一组公司，比较中位数而不是单个对手，以免被极端值带偏。下面这张带状图用假设数据画出某制造企业五年间的市盈率波动区间，帮助判断当前倍数是偏高还是偏低。</p>
  <div class="chart-box"><canvas id="peBand"></canvas><div class="cap">图注：假设数据，某制造企业五年市盈率波动带状示意——上沿、中位与下沿反映倍数区间（教学示意，不构成任何判断结论）。</div></div>

  <h3>倍数是提问的起点</h3>
  <p>相对估值最大的风险，是把"便宜"直接当成结论。一只资产的 PE 只有 6 倍，可能因为盈利即将明显下滑，价格已经提前反映了预期；另一只 PE 30 倍，可能因为后续增长足以消化这个倍数。倍数本身不解释原因，它只是把市场共识压缩成一个数字。负责任的做法，是把倍数当作提问的起点：为什么它的倍数低于同行？这种差异能持续多久？市场担心的事情是否已经发生？回答了这些问题，倍数才从数字变成判断依据。</p>
  <div class="defn">
    <p>相对估值：通过与可比公司的价格倍数比较来判断资产相对高低的方法。</p>
    <p>可比公司：在业务结构、规模、成长阶段和风险特征上与目标公司相近的一组公司。</p>
  </div>

  <div class="card soft"><div class="card-t">先问可比，再问倍数</div><p>比较两个倍数之前，先确认两家公司是不是真的可比：产品结构、区域市场、资产轻重、会计政策是否相近？如果差异很大，再精确的倍数比较也没有意义。很多时候，倍数方面的分歧其实来自口径不一致，而不是估值判断本身。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="valuation-traps">
  <div class="chead">
    <span class="chnum">26</span>
    <div class="chead-body">
      <div class="kicker">卷三 · 分析与估值　高阶 · 实操</div>
      <h2>估值陷阱与安全边际</h2>
      <div class="desc">识别低倍数背后的坑，理解为什么给判断留出余地比追求精确更重要。</div>
    </div>
  </div>
  <div class="path-strip">前置：相对估值PEPBPS · 股利折现与DCF　|　当前：<b>估值陷阱与安全边际</b>　|　延伸：回到卷二重读财报质量</div>

  <h3>便宜未必是好事</h3>
  <p>初学估值的人常有一个直觉：倍数越低，越是机会。现实里，低倍数往往是对某种风险的定价，而不是市场的疏漏。所谓价值陷阱，指那些看起来便宜、但价值长期不回归甚至继续恶化的情形。识别它的关键，是理解"低"背后的原因——是短期情绪造成的错杀，还是基本面正在发生结构性变化？前者可能提供机会，后者则会让等待变成消耗。区分这两者，需要回到财报本身去找证据。</p>

  <h3>几种常见的陷阱</h3>
  <p>第一类是用周期顶部的利润算出的低 PE。原材料、航运等行业盈利波动剧烈，景气高点时利润暴增、PE 显得很低，随后利润回落，倍数反而升高。第二类是靠一次性收益撑高的利润：处置资产、政府补助、债务重组都能让某一年的净利润突然放大，从而拉低当年 PE，但这种收益无法复制。第三类是会计口径差异：不同公司的折旧年限、研发支出处理方式不同，净利润的可比性因此打折。第四类是高杠杆：账面净资产看起来厚实，但其中相当部分是借来的，一旦资产减值，股东权益会迅速缩水。</p>
  <div class="tbl-scroll"><table><thead><tr><th>陷阱类型</th><th>表面现象</th><th>应当追问</th></tr></thead><tbody><tr><td>周期顶部</td><td>利润暴增、PE 很低</td><td>当前盈利水平能否持续</td></tr><tr><td>一次性收益</td><td>净利润突然放大</td><td>扣除一次性项目后利润如何</td></tr><tr><td>会计口径差异</td><td>同行倍数相差悬殊</td><td>会计政策是否可比</td></tr><tr><td>高杠杆</td><td>PB 看起来很低</td><td>有息负债与资产质量如何</td></tr></tbody></table></div>

  <h3>安全边际：给错误留一点余地</h3>
  <p>既然估值依赖假设，而假设几乎一定会出错，那么理性的做法不是追求更精确的数字，而是在判断中留出余地。安全边际指的是估算价值与实际付出价格之间的缓冲：当估算的价值明显高于价格时，即便判断偏差一部分，仍不至于陷入被动。假设甲公司估算的每股内在价值为 30 元，若坚持只在 20 元以下才考虑，就留下了约三分之一的缓冲。这不是保守，而是承认自己会犯错——估值本质上是概率判断，不是精确科学。</p>
  <div class="formula">安全边际率 = (估算内在价值 − 实际价格) ÷ 估算内在价值 × 100%</div>
  <div class="formula-note">估算内在价值来自 DCF、股利折现或相对估值的综合判断，本身就是一个区间而非定点。假设数据：估算价值 30 元、实际价格 20 元，安全边际率 ≈ 33%。该指标只反映缓冲的厚度，不能替代对基本面恶化的判断；如果内在价值估算本身偏高，再大的名义安全边际也会失效。</div>

  <h3>一张可以照着走的检查清单</h3>
  <p>为了避免被低倍数吸引而忽略风险，可以在每次判断前依次问几个问题：利润来自主营业务还是一次性项目？当前盈利处在周期的什么位置？应收账款和存货的增长是否健康？负债结构中有多少是有息负债？经营活动现金流能否覆盖净利润？同行的低倍数是普遍现象还是个别情况？这些问题不需要复杂模型，却能过滤掉大部分明显的陷阱。把检查过程写下来，还能在日后复盘时看清自己当时依据什么做判断，哪些假设被现实证伪。</p>
  <div class="defn">
    <p>价值陷阱：表面估值偏低，但基本面持续恶化、低估值长期难以修复的情形。</p>
    <p>安全边际：估算价值与实际价格之间的缓冲区间，用于容纳判断误差与未知风险。</p>
  </div>

  <h3>估值是过程，不是数字</h3>
  <p>最后要强调的是心态。估值不是为了得到一个可以照抄的价格，而是强迫自己把模糊的直觉拆成可以检验的假设：未来现金有多少？增长能持续多久？风险溢价该给多少？把假设写清楚，日后就能对照现实检验哪里想错了。一个愿意不断修正框架的读者，比一个记住很多倍数的人更接近专业。这也是本卷最后一章想留下的东西——方法比结论重要，边界比数字重要。</p>

  <div class="card soft"><div class="card-t">把"便宜"当成问题，而不是答案</div><p>每当看到一个很低的倍数，先不要急着下结论，而是把它改写成一句提问："市场为什么给出这个价格？"接下来去财报里找支持或反驳的证据。找不到解释的低倍数，往往不是机会被你发现了，而是风险还没被你看见。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>
`;

window.__CH_VOL4 = `
<section class="chapter" data-id="risk-return-var">
  <div class="chead">
    <span class="chnum">28</span>
    <div class="chead-body">
      <div class="kicker">卷四 · 投资学　进阶 · 学生</div>
      <h2>风险收益、方差与协方差</h2>
      <div class="desc">用概率和统计量把「预期回报」与「不确定性」讲清楚，为组合理论打地基。</div>
    </div>
  </div>
  <div class="path-strip">前置：收益率与概率分布　|　当前：<b>风险收益、方差与协方差</b>　|　延伸：组合理论与分散化 · CAPM与SML</div>

  <h3>期望收益：给不确定的未来打一个平均分</h3>
  <p>投资面对的是未来，而未来不止一种可能。一个稳妥的起点，是把每种可能的结果和它发生的概率放在一起，算一个加权平均，这就是期望收益率。它不是承诺，而是「如果同样的情形反复出现很多次，平均下来大约是多少」。概率来自估计，所以期望值天然带着判断的成分；把它当成思考的锚，而不是精确的预言，才不会误用。</p>
  <p>看一组假设数据。甲公司股票在景气、平淡、低迷三种状态下的收益分别是 15%、8%、0%，对应概率 0.3、0.5、0.2；某债券在同样状态下的收益是 4%、6%、6%。把每个收益乘以对应概率再相加，就得到各自的期望收益。</p>

  <div class="tbl-scroll"><table><thead><tr><th>市场状态</th><th>概率</th><th>甲公司股票</th><th>某债券</th></tr></thead><tbody><tr><td>景气</td><td>0.3</td><td>15%</td><td>4%</td></tr><tr><td>平淡</td><td>0.5</td><td>8%</td><td>6%</td></tr><tr><td>低迷</td><td>0.2</td><td>0%</td><td>6%</td></tr></tbody></table></div>

  <div class="formula">E(r) = Σ pi × ri</div>
  <div class="formula-note">pi 为第 i 种状态发生的概率，ri 为该状态下的收益率，Σ 表示对所有互斥且穷尽的状态求和。前提：所有概率之和为 1。代入上表：股票 E(r) = 0.3×15% + 0.5×8% + 0.2×0% = 8.5%；债券 E(r) = 0.3×4% + 0.5×6% + 0.2×6% = 5.4%。</div>

  <h3>方差与标准差：把波动量出来</h3>
  <p>只看期望收益还不够。两只资产可能期望相同，但一只四平八稳、另一只大起大落，持有体验截然不同。方差衡量的就是实际结果偏离期望的程度：把每一次偏离先平方、再按概率加权，离得越远、发生越频繁，方差就越大。标准差是方差的正平方根，和收益率用同一种单位，读起来更直观。</p>
  <p>继续用上表的假设数据。股票的方差约为 27.3，开方后标准差约 5.2%；债券的方差约 0.84，标准差约 0.9%。同样一块钱，放在股票上要承受的上下起伏明显大于放在债券上。这里没有谁优谁劣，只是风险特征不同，适合的需求也不同。</p>

  <div class="formula">σ² = Σ pi × (ri − E(r))²　，　σ = √σ²</div>
  <div class="formula-note">σ² 为方差，σ 为标准差，E(r) 为期望收益率。先求期望，再算各状态相对期望的偏离，平方后乘概率求和，最后开方。前提：使用同一组状态概率；平方使正负偏离都计入风险，不会相互抵消。</div>

  <div class="defn">
    <p>期望收益率：各种可能收益率按发生概率加权平均得到的中心值，反映长期平均水平，不等于任何一次的确定结果。</p>
    <p>标准差：方差的正平方根，衡量收益率围绕期望值的离散程度，是最常用的绝对风险度量；数值越大，波动越剧烈。</p>
  </div>

  <h3>协方差与相关系数：两只资产会不会一起动</h3>
  <p>单看每只资产的风险仍然不够，组合的关键在于资产之间如何互动。协方差回答一个问题：当甲高于自己的期望时，乙是倾向于高于还是低于自己的期望？同向变动为正，反向变动为负。但协方差带着量纲，大小不便解读，于是把它除以两只资产各自的标准差，得到取值在 −1 到 +1 之间的相关系数 ρ：+1 表示完全同向，−1 表示完全反向，0 表示没有线性关联。</p>
  <p>按上表数据计算，股票与债券的协方差约为 −3.9，相关系数约为 −0.8。负号说明在这个假设情境里，股票表现较差的时候债券往往表现好一些。这种此消彼长的关系，正是下一章分散化能够起作用的根源。</p>

  <div class="formula">Cov(rA, rB) = Σ pi × (rAi − E(rA)) × (rBi − E(rB))　，　ρAB = Cov(rA, rB) ÷ (σA × σB)</div>
  <div class="formula-note">Cov 为协方差，ρ 为相关系数，σA、σB 为两只资产各自的标准差。括号里分别是同一状态下两资产相对各自期望的偏离，乘积再乘概率求和。前提：−1 ≤ ρ ≤ +1；ρ 只反映线性关系，不能捕捉所有相依结构，也不能单独说明因果。</div>

  <div class="card soft"><div class="card-t">别把相关当成因果</div><p>两只资产一起涨跌，不代表其中一个导致另一个。它们可能只是共同受第三个因素影响，比如经济周期。相关系数描述的是「同时出现的倾向」，用途是估计组合风险，而不是讲故事。把它当作统计事实，比当作因果解释要稳妥得多。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="portfolio-diversification">
  <div class="chead">
    <span class="chnum">29</span>
    <div class="chead-body">
      <div class="kicker">卷四 · 投资学　进阶 · 学生 / 实操</div>
      <h2>组合理论与分散化</h2>
      <div class="desc">看清为什么收益可以简单加权、风险却不能，以及分散化到底消掉了什么。</div>
    </div>
  </div>
  <div class="path-strip">前置：风险收益、方差与协方差　|　当前：<b>组合理论与分散化</b>　|　延伸：CAPM与SML · 有效前沿</div>

  <h3>两资产组合：收益是加权的，风险不是</h3>
  <p>把资金分给两只资产，权重分别为 w1 和 w2，两者相加等于 1。组合的期望收益就是各自期望收益的加权平均，这一点很直观，也容易算。但组合的风险并不是两只资产标准差的加权平均——除非它们完全同向变动。组合方差公式中多出来的那一项来自协方差，它决定了分散化能起多大的作用。</p>

  <div class="formula">E(rp) = w1×E(r1) + w2×E(r2)　，　σp² = w1²σ1² + w2²σ2² + 2×w1×w2×ρ×σ1×σ2</div>
  <div class="formula-note">w1、w2 为两资产权重且 w1 + w2 = 1，ρ 为两者相关系数，σ1、σ2 为各自标准差。前提：单期收益、权重固定；公式描述的是方差而非标准差，开方后才得到波动幅度。这条两资产组合方差是后面一切分散化讨论的起点。</div>

  <p>沿用上一章的假设数据：甲公司股票期望收益 8.5%、标准差 5.2%，某债券期望收益 5.4%、标准差 0.9%，相关系数约 −0.8。若按 60% 与 40% 分配，组合期望收益 = 0.6×8.5% + 0.4×5.4% ≈ 7.3%；代入方差公式，组合标准差约 2.8%，明显低于按权重平均得到的 3.5%。差的那一截，就是负相关带来的分散效果。</p>

  <h3>相关系数决定分散的力度</h3>
  <p>公式里 ρ 的位置很关键。当 ρ = 1 时，交叉项取最大值，组合标准差退回加权平均，分散化一点也没起作用；只要 ρ 小于 1，组合风险就低于加权平均；当 ρ 接近 −1 时，两只资产此消彼长，波动被大幅抵消。下面固定 60% 与 40% 的权重，看看相关系数从 +1 走到 −1 时组合标准差如何变化。</p>

  <div class="tbl-scroll"><table><thead><tr><th>相关系数 ρ</th><th>+1</th><th>+0.5</th><th>0</th><th>−0.5</th><th>−0.8</th><th>−1</th></tr></thead><tbody><tr><td>组合标准差（假设）</td><td>3.5%</td><td>3.3%</td><td>3.2%</td><td>3.0%</td><td>2.8%</td><td>2.8%</td></tr></tbody></table></div>

  <div class="chart-box"><canvas id="diversify"></canvas><div class="cap">图注：假设数据，随着组合中互不相关的资产数量增加，非系统性风险被逐步摊薄，总风险下降并趋近于无法分散的系统性风险底线（教学示意）。</div></div>

  <p>表中区间不算宽，是因为债券本身的波动已经很小；换成多只波动相近、彼此弱相关的资产，分散效果会更明显。图里画的是更一般的规律：资产数量增加时，组合风险先快速下降，随后越来越慢，最终趋向一条底线。那条底线，谁也躲不开。</p>

  <h3>系统性风险与非系统性风险</h3>
  <p>能被分散掉的那部分，来自公司特有、彼此无关的扰动：一次产品失误、一位关键人员变动、一场局部事故。把它们放在一起，各自的意外互相抵消，这就是非系统性风险。另一部分来自共同因素——经济周期、利率变化、通货膨胀，它们几乎同时影响所有资产，无论怎么组合都无法消除，这就是系统性风险。市场愿意补偿的，是后一种。</p>

  <div class="defn">
    <p>非系统性风险：源于单个公司或行业的特有事件，可以通过持有足够分散的组合显著降低甚至基本消除。</p>
    <p>系统性风险：源于影响整个市场的共同因素，无法通过分散化消除，是组合风险在资产数量趋于无穷时仍保留下来的部分。</p>
  </div>

  <div class="card soft"><div class="card-t">分散不是万能的</div><p>分散化改善的是「同样预期收益下承担多少波动」，它不保证不亏钱：系统性风险仍在，而且相关性在市场剧烈波动时可能同时上升，原本有用的分散会打折扣。理解分散的边界，比迷信分散的神奇更重要。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="capm-sml">
  <div class="chead">
    <span class="chnum">30</span>
    <div class="chead-body">
      <div class="kicker">卷四 · 投资学　进阶 · 学生</div>
      <h2>CAPM与SML</h2>
      <div class="desc">把「风险该得到多少回报」写成一条直线，理解 Beta 为何是唯一的定价尺度。</div>
    </div>
  </div>
  <div class="path-strip">前置：组合理论与分散化　|　当前：<b>CAPM与SML</b>　|　延伸：有效前沿 · 市场均衡与因子模型</div>

  <h3>为什么要给风险定价</h3>
  <p>上一章得到一个关键结论：可以分散掉的风险，不该要求额外回报，因为投资者自己就能免费把它分散掉。于是在充分分散的市场里，一项资产应得的收益率，只取决于它无法被分散的那部分风险。这个洞见把「风险」从笼统的感觉，变成一个可度量的量——资产收益率对市场整体波动的敏感度，也就是 Beta。</p>

  <h3>CAPM：一条关于要求回报率的直线</h3>
  <p>资本资产定价模型把上述想法写成一个简洁的式子。无风险利率是对放弃当前消费的基本补偿；在此之上，再按资产的系统性风险加上一份溢价，这份溢价等于市场风险溢价乘以 Beta。资产自身的特点、公司的故事都不进入公式，原因还是那句话：特有的东西可以被分散，市场不为可分散的风险付钱。</p>

  <div class="formula">E(Ri) = Rf + βi × [E(Rm) − Rf]</div>
  <div class="formula-note">E(Ri) 为资产 i 的要求收益率，Rf 为无风险利率，E(Rm) 为市场组合的预期收益率，E(Rm) − Rf 为市场风险溢价，βi 为资产相对市场的敏感度。前提：市场有效、无交易成本、投资者可自由借入贷出无风险资产且预期一致。β 用历史数据估计会有误差，结果是估计值而非精确值。</div>

  <p>用一组假设数据感受一下。设无风险利率为 3%，市场整体预期收益为 10%，市场风险溢价就是 7%。Beta 为 0.5 的资产，要求收益 = 3% + 0.5×7% = 6.5%；Beta 为 1 的资产与市场同步，要求收益 10%；Beta 为 1.5 的资产波动更剧烈，要求收益 13.5%。Beta 越高，要求回报越高，关系是线性的。</p>

  <div class="tbl-scroll"><table><thead><tr><th>Beta（假设）</th><th>0.5</th><th>1.0</th><th>1.5</th></tr></thead><tbody><tr><th>要求收益率</th><th>6.5%</th><th>10.0%</th><th>13.5%</th></tr></tbody></table></div>

  <div class="chart-box"><canvas id="frontCap"></canvas><div class="cap">图注：假设 Rf=3%、市场收益=10%，证券市场线给出每个 Beta 对应的要求收益率；β=1 处恰为市场组合（教学示意）。</div></div>

  <h3>证券市场线怎么读</h3>
  <p>图中这条线叫证券市场线，纵轴是要求收益率，横轴是 Beta。它有两个天然坐标：横轴为零处对应无风险利率，Beta 等于 1 处对应市场组合。任何资产都可以按自己的 Beta 在线上找到要求的回报水平。落在上方的资产，按它的风险衡量，给出的回报预期高于要求水平；落在下方则相反。这是描述性的对照，不等于对任何资产的买卖判断。</p>
  <p>还要记住模型的边界。它依赖一组理想化假设，现实中有交易成本、税收、融资约束，投资者预期也并不一致；Beta 由历史数据估计，本身不稳定。因此 CAPM 更适合作为思考风险补偿的框架，而不是精确计算某个资产合理价格的机器。理解它为什么成立，比机械套公式更有价值。</p>

  <div class="defn">
    <p>Beta：资产收益率变动对市场整体变动的敏感度，大于 1 表示比市场更敏感，小于 1 表示更迟钝，是衡量系统性风险的常用指标。</p>
    <p>证券市场线：在「要求收益率—Beta」坐标中，由 CAPM 给出的直线，表示每一单位系统性风险对应的要求回报。</p>
  </div>

  <div class="card soft"><div class="card-t">把模型当尺子，不当裁判</div><p>CAPM 的价值在于揭示「只有不可分散的风险才值得补偿」这条逻辑。用它来理解风险与回报的关系很合适；用它去宣称某个资产的精确合理价位，则超出了它能承担的范围。一把尺子能量长度，但不能替你决定做什么。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>
`;

window.__CH_VOL5 = `
<section class="chapter" data-id="active-passive-funds">
  <div class="chead">
    <span class="chnum">38</span>
    <div class="chead-body">
      <div class="kicker">卷五 · 基金与配置　入门 · 零基础</div>
      <h2>基金主动与被动</h2>
      <div class="desc">先弄清基金帮你买到了什么，再看主动与被动两种管理方式的根本差别。</div>
    </div>
  </div>
  <div class="path-strip">前置：无，进入基金卷的起点　|　当前：<b>基金主动与被动</b>　|　延伸：指数基金与ETF · 净值与费率陷阱</div>

  <h3>基金是什么：把钱交给专业管理人</h3>
  <p>想象你想参与一篮子证券，却没有时间逐个研究，也没有足够资金买齐。基金提供了现成的办法：许多人把钱汇集起来，交给管理人统一投资，收益和风险按份额共享共担。你买到的是基金份额，对应的是这一篮子资产的一部分，而不是某一家公司的股票。理解这一点，很多后续问题都会变得清楚。</p>
  <p>这种集合投资有两个直接好处：一是门槛被摊低，小额资金也能参与到一篮子资产；二是专业分工，研究、交易、托管都有人负责。代价同样明确——你要支付费用，并把具体决策交给别人。所以对基金合理的期待是「买到服务与分散」，而不是买到确定性。</p>

  <h3>主动与被动：两种截然不同的目标</h3>
  <p>按管理人如何决策，基金大致分为两类。主动管理型的目标是跑赢某个比较基准：通过研究和判断，试图获得高于市场平均的收益。被动管理型则相反，它不追求超越，只求尽量贴合一个既定的指数，指数涨多少它就涨多少（扣除费用之前）。一个靠判断取胜，一个靠规则运行，思路完全不同。</p>

  <div class="tbl-scroll"><table><thead><tr><th>对比维度</th><th>主动管理</th><th>被动管理</th></tr></thead><tbody><tr><td>目标</td><td>跑赢比较基准</td><td>贴合标的指数</td></tr><tr><td>决策依据</td><td>研究与判断</td><td>公开透明的编制规则</td></tr><tr><td>费用水平（假设）</td><td>通常较高</td><td>通常较低</td></tr><tr><td>对管理人的依赖</td><td>强</td><td>弱</td></tr></tbody></table></div>

  <div class="defn">
    <p>主动管理：由基金管理人自主选择投资对象与时机，力求取得超越比较基准的收益。</p>
    <p>被动管理：不依赖主观判断，按既定规则复制指数构成，目标是把跟踪偏离控制在尽可能小的范围内。</p>
  </div>

  <h3>如何看「跑赢市场」</h3>
  <p>主动基金并非没有价值，但「跑赢」比想象中难。市场整体回报由所有参与者共同创造，扣除成本之后，全体投资者平均只能拿到市场水平；要让一部分人持续高于平均，就意味着另一部分人持续低于平均。长期看，能持续跑赢的只是少数，而且事前很难知道是哪一只。过去两年的亮眼业绩，并不自动通向未来的亮眼业绩。</p>
  <p>另一个常被忽略的因素是成本。研究和交易都要花钱，这些费用从收益里扣除，是确定的支出；超额收益却是不确定的。两者的不对称，决定了费率在长期里分量极重。这不是说主动一定不好，而是提醒你：面对主动基金，先问清它靠什么赢、代价是多少，再看历史回报。</p>

  <div class="formula">投资者实际到手收益 ≈ 基金公布收益 − 持有期间各项费用</div>
  <div class="formula-note">这里是对收益口径的简化提醒：基金公布的回报通常已扣除管理费等日内计提项目，但申购费、赎回费等仍由投资者另行承担。前提：比较不同基金时统一口径，避免把毛收益与净收益混为一谈。</div>

  <div class="card soft"><div class="card-t">先问代价，再看业绩</div><p>判断一只基金之前，把它「凭什么赚钱、要花多少钱、风险落在哪里」三个问题问一遍。业绩是结果，机制才是原因；只盯着结果，很容易在下一轮风格切换时失去方向。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="index-etf">
  <div class="chead">
    <span class="chnum">39</span>
    <div class="chead-body">
      <div class="kicker">卷五 · 基金与配置　入门 · 零基础</div>
      <h2>指数基金与ETF</h2>
      <div class="desc">认识指数这把尺，以及跟踪它的两类工具：场外指数基金与交易所ETF。</div>
    </div>
  </div>
  <div class="path-strip">前置：基金主动与被动　|　当前：<b>指数基金与ETF</b>　|　延伸：净值与费率陷阱 · 股债平衡配置</div>

  <h3>指数：一把测量市场的尺</h3>
  <p>指数是什么？把一组证券按规则放在一起，用它们的价格算出一个数，这个数就是指数。它像一把尺子，量的是某一类资产整体的涨跌。比如某宽基指数，挑选了一大批覆盖面广的公司股票，按市值加权，常用来描述整个股票市场的表现。你无法直接买入「指数」本身，但可以购买跟踪它的基金。</p>
  <p>指数有明确的编制规则：选哪些证券、各占多少权重、多久调整一次，规则公开透明。正因为规则清楚，跟踪指数的基金不需要管理人临场发挥，既减少了主观失误的空间，也压低了运营成本。理解指数，是理解被动投资的第二步。</p>

  <h3>指数基金：把指数复制下来</h3>
  <p>指数基金的目标是跟上指数。最常见的办法是完全复制——按指数的成分和权重买入；当成分股太多或有些不便买入时，也可以用抽样复制，挑一部分有代表性的证券近似跟踪。无论哪种做法都不可能分毫不差，实际收益与指数收益之间的差距叫跟踪误差，通常越小越好。</p>

  <div class="formula">跟踪误差 ≈ 基金收益率 − 标的指数收益率（常用绝对值或波动幅度衡量偏离）</div>
  <div class="formula-note">差值只是最直观的近似；严谨的计算还会考虑费用、现金拖累、复制方式与调仓时点。前提：比较基金与指数时使用同一时间段、同一收益口径（价格指数或全收益指数），否则差距会被口径不同的噪音放大。</div>

  <div class="defn">
    <p>指数基金：以特定指数为标的，按指数构成配置资产，力求复制其表现的基金。</p>
    <p>跟踪误差：基金实际表现与标的指数表现之间的偏离，用来衡量复制效果；偏离越小，复制越紧密。</p>
  </div>

  <h3>ETF：能像股票一样买卖的指数基金</h3>
  <p>ETF 本质上也是一种跟踪指数的基金，特别之处在于它可以在交易所像股票一样买卖。这带来两个便利：交易时间内价格实时变化，随时可以成交；买卖方式和股票账户一致，资金效率较高。它背后还有一套大额实物申赎机制，主要由机构完成，普通投资者多数时候只在二级市场买卖份额。</p>
  <p>因为是实时交易，ETF 的市场价格可能短暂偏离它所持资产的实际价值，这个偏离叫折溢价。偏离通常很小，但在情绪剧烈时可能放大。买入前留意一下溢价程度，是基本的功课。场外指数基金则按每天收盘后的净值成交，一天只有一个价格，没有盘中折溢价的问题，但也不能盘中逃顶或抄底。</p>

  <div class="tbl-scroll"><table><thead><tr><th>对比维度</th><th>场外指数基金</th><th>ETF</th></tr></thead><tbody><tr><td>成交价格</td><td>每日收盘后一个净值</td><td>盘中实时变动</td></tr><tr><td>交易方式</td><td>按净值申购赎回</td><td>像股票一样买卖</td></tr><tr><td>折溢价</td><td>无盘中折溢价</td><td>可能出现小幅折溢价</td></tr><tr><td>适合情形（假设）</td><td>定额投入、长期持有</td><td>希望盘中灵活成交</td></tr></tbody></table></div>

  <div class="card soft"><div class="card-t">工具服务于节奏</div><p>场外基金一天一个价，适合不盯盘的定投；ETF 盘中可成交，适合对交易时点有要求的人。两者都能实现跟踪指数的目标，差别在交易方式而非投资逻辑。先确定自己的持有节奏，再选顺手的工具，顺序不要颠倒。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="fees-navigation">
  <div class="chead">
    <span class="chnum">40</span>
    <div class="chead-body">
      <div class="kicker">卷五 · 基金与配置　入门 · 零基础</div>
      <h2>净值与费率陷阱</h2>
      <div class="desc">看懂单位净值的含义，再把藏在明细里的各项费用算清楚。</div>
    </div>
  </div>
  <div class="path-strip">前置：指数基金与ETF　|　当前：<b>净值与费率陷阱</b>　|　延伸：股债平衡配置 · 组合实用构建</div>

  <h3>单位净值：别被「便宜」误导</h3>
  <p>基金每天公布单位净值，等于基金净资产除以总份额，可以理解成「一份值多少钱」。新手常有一个误解：单位净值 1 元的基金比 3 元的更便宜，买它更划算。其实净值高低只反映基金成立以来的累计涨跌和分红情况，与它未来能涨多少没有关系。同样一笔钱，买到的资产比例是一样的。</p>
  <p>要看历史表现，应该看累计净值或复权增长率，它们把分红再投资的影响考虑了进去。只盯单位净值的绝对数字，就好比只看价格高低就判断贵贱——价格低不等于估值低。把净值当作记账单位，而不是价格标签，这一步跨过去，很多误导就失效了。</p>

  <h3>一路上的费用：哪些会扣你的钱</h3>
  <p>持有基金的成本不止买入时那一笔。常见费用包括：申购费（买入时收）、赎回费（卖出时收，持有越久通常越低）、管理费（按年从资产中计提，付给管理人）、托管费（付给托管机构）、销售服务费（部分份额按年收取）。有的在你交易时明示，有的每天悄悄从净值里扣掉，不细看很难察觉。</p>

  <div class="tbl-scroll"><table><thead><tr><th>费用类型</th><th>收取时点</th><th>假设特点</th></tr></thead><tbody><tr><td>申购费</td><td>买入时</td><td>一次性，常随金额增大而降低</td></tr><tr><td>赎回费</td><td>卖出时</td><td>持有期越短通常越高</td></tr><tr><td>管理费</td><td>每日计提</td><td>按年费率折算，不另收款</td></tr><tr><td>托管费</td><td>每日计提</td><td>费率通常较低</td></tr><tr><td>销售服务费</td><td>按年计提</td><td>常见于不收申购费的份额</td></tr></tbody></table></div>

  <div class="defn">
    <p>单位净值：基金某一时点的净资产除以基金总份额，代表每一份基金对应的价值。</p>
    <p>费率：基金运作与交易过程中收取的各项费用占资产或金额的比例，是侵蚀长期收益的确定性因素。</p>
  </div>

  <h3>费率如何悄悄吃掉收益</h3>
  <p>费用的影响靠复利放大。假设本金 10 万元，基金每年毛收益 8%，持有 20 年：若每年各项费用合计 1.5%，实际年化约 6.5%，期末约 35 万元；若费用合计 0.2%，实际年化约 7.8%，期末约 44 万元，相差近 9 万元。两笔本金相同的投资，差别不在行情，而在每年被扣掉的那一点。</p>

  <div class="formula">FV = PV × (1 + r净)^n　，其中 r净 ≈ r毛 − 年费用率</div>
  <div class="formula-note">PV 为本金，r净 为扣除费用后的实际年化收益率，n 为持有年数。前提：毛收益按年复利、费用按年等额扣除，忽略交易时点与税费细节。这里用减法估算净收益，仅用于演示数量级，精确计算应逐年逐项扣除。</div>

  <p>这个演示故意用整数假设，只为说明方向：费率是确定的拖累，持有时间越长，拖累被复利放大得越明显。它提醒我们，比较基金时应把费率放在与历史业绩同等重要的位置。当然，低费率不是唯一标准，跟踪质量与服务能力同样要紧；只是别让看不见的小数字，悄悄改写长期结果。</p>

  <div class="card soft"><div class="card-t">把费用表读一遍</div><p>买入之前，花两分钟把招募说明书里的费用表看完：哪些一次性收取、哪些按年计提、持有多久免赎回费。把这笔「确定的支出」摆到台面上，你才会知道自己的收益预期里，究竟有多少要先分给成本。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="stock-bond-allocation">
  <div class="chead">
    <span class="chnum">41</span>
    <div class="chead-body">
      <div class="kicker">卷五 · 基金与配置　进阶 · 零基础 / 实操</div>
      <h2>股债平衡配置</h2>
      <div class="desc">理解股与债为什么互补，怎样定比例，以及市场把比例打乱后如何拉回来。</div>
    </div>
  </div>
  <div class="path-strip">前置：净值与费率陷阱　|　当前：<b>股债平衡配置</b>　|　延伸：组合实用构建 · 再平衡</div>

  <h3>为什么要把股和债放在一起</h3>
  <p>股票长期回报通常较高，但波动大，遇到下跌年份可能很难熬；债券收益相对温和、波动小，在股市低迷时往往更稳。两者的节奏并不完全同步，把它们搭配起来，组合的波动常常低于单独持有股票，而长期回报又不至于像全债券那样受限。这不是什么秘密技巧，只是利用了不同资产在不同环境下表现不同这一事实。</p>
  <p>配置要回答的问题不是「买哪一只」，而是「各放多少」。比例决定了组合的整体气质：股票多，进攻性强但起伏大；债券多，稳健但可能跑不过通胀。找到与自己匹配的比例，比挑中某一只产品更根本，也更值得花时间。</p>

  <h3>常见的起点与它的局限</h3>
  <p>常听到一个经验法则：股票比例约等于 100 减去年龄。三十岁的人股票占七成，六十岁的人占四成。道理是年轻时离用钱的时间远，承受能力更强，可以多用一些波动资产。但这只是起点，不是公式：同样三十岁的人，收入稳定性、家庭负担、心理承受力差别很大，对回撤的感受也完全不同。</p>

  <div class="tbl-scroll"><table><thead><tr><th>股 / 债比例（假设）</th><th>20/80</th><th>60/40</th><th>80/20</th></tr></thead><tbody><tr><td>长期特征</td><td>波动小、回报温和</td><td>攻守较为均衡</td><td>波动大、更依赖股市</td></tr><tr><td>适合情形（假设）</td><td>临近用钱、厌恶波动</td><td>中长期、平衡型</td><td>期限长、能承受起伏</td></tr></tbody></table></div>

  <div class="chart-box"><canvas id="allocRing"></canvas><div class="cap">图注：假设的 60/40 股债配置，每一块代表一类资产在总盘子里的份额，一块变大另一块就会变小（教学示意）。</div></div>

  <p>图中给出一个 60/40 的假设配置。环形图强调的是「比例」这个整体概念：任何一块变大，另一块就会变小。记住这个此消彼长的关系，再平衡就更容易理解——你调整的不是某只产品，而是整个盘子的结构。</p>

  <h3>再平衡：把比例拉回轨道</h3>
  <p>市场涨跌会悄悄改变比例。假设起初股票 60%、债券 40%，股票大涨后可能变成 70% 和 30%，组合的风险特征也就跟着变了——你并没有主动改主意，是市场替你改了。再平衡就是定期、或在偏离达到阈值时，卖掉一部分涨多的、补回跌多的，让比例回到原定轨道。</p>
  <p>再平衡本质是一种纪律：它迫使你高抛低吸，对抗追涨杀跌的本能。但它也有成本——交易费用、税费，以及可能的税务影响，所以不必过于频繁。常见的做法是设定时间检查点或偏离阈值，触发才动手，其余时间让它自己运行。</p>

  <div class="formula">组合收益 ≈ w股 × R股 + w债 × R债（忽略费用与再平衡时点的影响）</div>
  <div class="formula-note">w股、w债 为两类资产的权重且相加为 1，R股、R债 为各自期间收益率。前提：权重在期内保持稳定；实际发生再平衡后，权重会变化，收益需分段计算。这个近似式用于说明「比例决定组合表现的大部分」。</div>

  <div class="defn">
    <p>资产配置：决定资金在不同大类资产之间如何分配的过程，是决定组合风险收益特征的主要因素。</p>
    <p>再平衡：当资产比例偏离目标时，通过买卖把权重拉回既定水平的操作，用以维持既定的风险特征。</p>
  </div>

  <div class="card soft"><div class="card-t">比例比选品更关键</div><p>与其纠结哪一只产品更好，不如先确定股债各占多少。前者是细节，后者是结构；结构错了，细节再优也补不回来。把比例写下来，市场喧闹时它就是你的定盘星。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="portfolio-building">
  <div class="chead">
    <span class="chnum">42</span>
    <div class="chead-body">
      <div class="kicker">卷五 · 基金与配置　进阶 · 实操</div>
      <h2>组合实用构建</h2>
      <div class="desc">从目标倒推工具，用核心、卫星与缓冲三层搭出一个能长期坚持的组合。</div>
    </div>
  </div>
  <div class="path-strip">前置：股债平衡配置　|　当前：<b>组合实用构建</b>　|　延伸：长期持有与复盘 · 行为偏差</div>

  <h3>从目标出发，而不是从产品出发</h3>
  <p>很多人搭组合的顺序是反的：先听说某个产品不错，再想办法把它塞进自己的计划。更稳妥的顺序是先问自己几个问题——这笔钱多久以后要用？能接受最大的一段下跌是多少？希望它完成什么任务？答案清楚了，再去找合适的工具。工具是为目标服务的，顺序颠倒，人容易在市场波动中动摇。</p>
  <p>期限、用途和承受力，是三个必须先想清楚的变量。短期要用的钱，经不起大幅波动；长期不用的钱，才有底气承受股票的起伏。把它们写在纸上，日后市场喧闹时，这些文字就是你判断的锚，比任何一时的消息都可靠。</p>

  <h3>核心、卫星与缓冲：一个可操作的框架</h3>
  <p>一个简洁的搭建思路，是把组合分成几层。核心层占大头，由低费率、覆盖广的工具构成，负责拿到市场的平均回报；卫星层占小头，用来配置一些你认为有额外机会、但风险也更高的部分；再留一部分现金或类现金资产作缓冲，应对突发支出和再平衡的需要。</p>

  <div class="tbl-scroll"><table><thead><tr><th>层次</th><th>假设比例</th><th>承担的任务</th></tr></thead><tbody><tr><td>核心层</td><td>70%</td><td>低费率、广覆盖，取得市场平均回报</td></tr><tr><td>卫星层</td><td>20%</td><td>补充特定机会，风险与不确定性更高</td></tr><tr><td>缓冲层</td><td>10%</td><td>应对支出与再平衡，避免被迫卖出</td></tr></tbody></table></div>

  <p>比例没有标准答案。核心层占大头，是因为它成本最低、最不依赖判断；卫星层要克制，因为它考验你的判断，而判断会出错；缓冲层看似收益低，却能在你需要钱时避免被迫卖出核心资产，价值常常被低估。三层各司其职，组合才有韧性。</p>

  <h3>分散、成本与纪律</h3>
  <p>搭好框架之后，剩下三件事值得反复检查。一是分散：不只在资产类别之间，也在地域、行业之间分散，避免把身家压在同一种命运上。二是成本：把各层费用加权算一算，看似不起眼的费率累积起来会吞掉不少收益。三是纪律：写下自己的规则——多久检查一次、偏离多少才调整、什么情况下不改——然后把执行交给规则，而不是情绪。</p>

  <div class="formula">组合年费用率 ≈ Σ wi × 各层费率i</div>
  <div class="formula-note">wi 为第 i 层的资金占比，各层费率i 为该层工具按年计提与摊销的费用率，Σ 对各层求和。前提：费率口径一致（同为年化），且忽略申赎等一次性费用。这个近似式用来提醒你：总成本是各部分按权重的加总，容易被单项的低费率掩盖。</div>

  <p>最后要接受一个事实：构建组合不是一次性工程，而是长期习惯。市场会变，人生阶段也会变，你的比例需要偶尔复核。但复核不等于频繁改动；多数时候，最好的动作是按既定规则继续持有，把注意力留给工作与生活。</p>

  <div class="defn">
    <p>核心—卫星结构：以低费率、分散化的工具为主体，辅以少量承担特定机会的小仓位，兼顾稳定与灵活。</p>
    <p>投资纪律：事先写明并被执行的规则，用来约束情绪化决策，使长期计划在市场波动中保持一致。</p>
  </div>

  <div class="card soft"><div class="card-t">把计划写下来</div><p>把目标、比例、检查周期和调整规则写成一页纸，放在能随时看到的地方。写下它，是为了在上涨时不至于贪心加码，在下跌时不至于恐慌离场。好的组合不是最复杂的那个，而是你能坚持执行的那个。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>
`;

<section class="chapter" data-id="corporate-finance-value">
  <div class="chead">
    <span class="chnum">47</span>
    <div class="chead-body">
      <div class="kicker">卷六 · 公司金融　进阶 · 学生</div>
      <h2>公司金融创造价值</h2>
      <div class="desc">弄清公司金融回答的三个基本问题，以及"创造价值"究竟用哪把尺子衡量。</div>
    </div>
  </div>
  <div class="path-strip">前置：财报与现金流基础　|　当前：<b>公司金融创造价值</b>　|　延伸：资本预算与NPV · 资本成本WACC</div>

  <h3>公司金融管三件事</h3>
  <p>把一家公司看成一台把资金变成更多资金的机器，公司金融（Corporate Finance）关心的就是三个问题。第一，钱投向哪里：新建厂房、购置设备、收购业务，这些投资决策决定公司未来能赚什么钱。第二，钱从哪里来：发行股票、举借债务、留存收益，这些融资决策决定资金成本与偿还压力。第三，赚到的钱怎么分：继续投入、分红还是回购，影响股东的长期回报。三者彼此牵连：投资机会决定资金需求，融资方式决定折现率，分配政策又影响下一次能筹到多少资金。</p>
  <p>问题很多，就需要统一的目标来排序。公司金融通常把企业价值最大化作为目标，而不是利润最大化。利润是会计数字，受折旧方法、收入确认时点影响，也不体现投入资本的多少。一家公司投入十亿元赚一亿元，与投入两亿元赚八千万元相比，后者的资本效率更高。价值视角要求把规模、时间、风险一并纳入，这正是时间价值与风险收益原则在企业层面的应用。</p>

  <h3>价值来自回报与成本的差额</h3>
  <p>判断一项业务是否创造价值，最有用的问题是：它赚取的回报率，是否高于资金提供方要求的回报率？后者就是资本成本。假设甲公司投入资本 1000 万元，税后经营净利润 120 万元，投入资本回报率 ROIC 为 12%；若加权平均资本成本 WACC 为 9%，两者相差 3 个百分点，乘以 1000 万元约得 30 万元经济增加值——这才是扣除资金成本之后的真实贡献。</p>
  <p>差额的方向至关重要。ROIC 高于资本成本，增长才创造价值；低于资本成本，规模越大、增长越快，毁灭的价值越多。很多扩张故事听起来振奋，但若新增业务回报覆盖不了资金成本，扩张只是在放大亏损。成熟公司把资本纪律写进考核，而不是单纯追求营收增速，原因就在这里。</p>

  <div class="tbl-scroll"><table><thead><tr><th>决策类型</th><th>回答的问题</th><th>常用分析工具</th></tr></thead><tbody><tr><td>投资决策</td><td>钱投向哪里</td><td>资本预算、NPV、情景分析</td></tr><tr><td>融资决策</td><td>钱从哪里来、成本多少</td><td>资本成本、资本结构、杠杆分析</td></tr><tr><td>分配决策</td><td>赚到的钱怎么分</td><td>股利政策、回购、再投资机会</td></tr></tbody></table></div>

  <div class="defn">
    <p>企业价值：公司全部资产按未来可产生现金流的现值衡量的价值，通常等于股权价值与债权价值之和。</p>
    <p>投入资本回报率（ROIC）：税后经营利润与投入资本之比，衡量公司运用资本创造利润的效率。</p>
    <p>代理问题：所有权与经营权分离后，管理者目标与股东目标不一致而产生的冲突。</p>
  </div>

  <div class="formula">经济增加值 EVA = NOPAT − WACC × 投入资本 = (ROIC − WACC) × 投入资本</div>
  <div class="formula-note">NOPAT 为税后净营业利润，ROIC = NOPAT ÷ 投入资本，WACC 为加权平均资本成本。假设数据：投入资本 1000 万元、NOPAT 120 万元，则 ROIC=12%；若 WACC=9%，EVA=(12%−9%)×1000=30 万元。计算时 NOPAT 与 WACC 的口径须一致：前者是税后经营口径，后者也须用税后债务成本加权。</div>

  <h3>把人的因素也放进模型</h3>
  <p>数字之外还有代理问题。股东希望价值最大化，管理者可能更在意规模与短期业绩；债权人关心本息安全，股东却可能倾向投资风险更高的项目。这些冲突不会自动消失，只能靠制度缓解：绩效薪酬把管理者利益与股东部分绑定，董事会与信息披露形成监督，债务契约约束高风险行为。制度的目的不是消灭分歧，而是让分歧不系统性地损害价值。</p>
  <p>本节最值得带走的不是某个公式，而是一套判断顺序：先看项目回报率，再与资本成本比较，然后追问这个比较能否持续、是否计入风险。公司金融的全部工具，本质上都在把这三步做得更精确。</p>

  <div class="card soft"><div class="card-t">利润不等于价值</div><p>利润高只说明这一期赚得多，价值高还要求回报超过资金成本、并且能够持续。读一家公司时，把"赚了多少"和"占用多少资本、承受多少风险"放在一起看，才不容易被漂亮的增长数字带偏。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="capital-budgeting-npv">
  <div class="chead">
    <span class="chnum">48</span>
    <div class="chead-body">
      <div class="kicker">卷六 · 公司金融　进阶 · 学生</div>
      <h2>资本预算与NPV</h2>
      <div class="desc">学会用净现值判断长期项目该不该做，并理解它与内部收益率冲突时如何取舍。</div>
    </div>
  </div>
  <div class="path-strip">前置：公司金融创造价值 · 折现与现值　|　当前：<b>资本预算与NPV</b>　|　延伸：项目现金流预测 · 资本成本WACC</div>

  <h3>为什么回收期不能单独拍板</h3>
  <p>资本预算（Capital Budgeting）就是把资金分配到长期项目上的过程。最直觉的指标是回收期：多久能收回初始投资。假设甲公司一项投资需 100 万元，每年净现金流入 25 万元，回收期为 4 年。这个指标简单，却有两个硬伤：它不考虑回收之后的现金流，也不考虑四年里现金流入的时间分布。两个项目回收期相同，一个前三年集中回款、一个最后一年才回款，风险完全不同。折现回收期补上了时间价值，但仍然忽略了回收期之后的贡献。</p>
  <p>所以回收期适合做流动性筛查，不能充当最终判据。它回答"多久回本"，却回答不了"这个项目该不该做"。</p>

  <h3>NPV 是价值的尺子</h3>
  <p>净现值（NPV）的思路与折现一脉相承：把项目寿命期内每一期的现金流按资本成本折回今天，再减去初始投资。假设初始投资 100 万元、之后每年净现金流 28 万元、持续 6 年、折现率 10%，六笔现金流现值合计约 122 万元，NPV 约 22 万元。NPV 为正，说明项目在覆盖资金成本之后还有富余，做它会增加公司价值；为负则减少价值。判定规则简单明确：NPV 大于零就接受，小于零就放弃。</p>

  <div class="tbl-scroll"><table><thead><tr><th>指标</th><th>回答的问题</th><th>局限</th></tr></thead><tbody><tr><td>回收期</td><td>多久回本</td><td>忽略回收后现金流与时间价值</td></tr><tr><td>折现回收期</td><td>折现后多久回本</td><td>仍忽略回收期之后的贡献</td></tr><tr><td>NPV</td><td>创造多少价值</td><td>依赖折现率的合理估计</td></tr><tr><td>IRR</td><td>预期回报率是多少</td><td>可能多解，与 NPV 冲突时不可靠</td></tr></tbody></table></div>

  <div class="defn">
    <p>净现值（NPV）：项目未来现金流按资本成本折现后的现值减去初始投资，直接衡量价值增量。</p>
    <p>内部收益率（IRR）：使项目净现值恰好等于零的折现率，常作为回报率的通俗表达。</p>
    <p>资本成本：资金提供方要求的回报率，在资本预算中充当折现率，反映项目资金的机会成本。</p>
  </div>

  <div class="formula">NPV = ∑[t=1..n] CF_t ÷ (1 + r)^t − C₀</div>
  <div class="formula-note">CF_t 为第 t 期净现金流，C₀ 为初始投资（发生在零时点，不再折现），r 为资本成本，n 为项目寿命期。假设数据：C₀=100 万元、CF_t=28 万元、n=6、r=10%，NPV≈22 万元。前提：各期现金流与折现率的口径一致；NPV 与 IRR 结论冲突时以 NPV 为准，因为 NPV 直接衡量价值增量，而 IRR 只是一个比率，且隐含的再投资假设不如 NPV 贴近现实。</div>

  <h3>IRR 与 NPV 冲突时听谁的</h3>
  <p>IRR 是让 NPV 恰好等于零的折现率，常被解读为项目的预期回报率。对常规项目，IRR 高于资本成本与 NPV 为正通常一致。遇到两类情形就会打架：一是现金流符号多次改变（非常规现金流），方程可能出现多个 IRR 甚至无解；二是项目规模或现金流时点差异很大，IRR 高的项目未必创造更多绝对价值。下图的假设案例中，初始投资 100 万元、每年流入 28 万元、持续 6 年，曲线与横轴交点即 IRR，约 17%；在 10% 折现率处 NPV 明显为正。</p>
  <div class="chart-box"><canvas id="npvCurve"></canvas><div class="cap">图注：假设数据，初始投资 100 万元、每年净流入 28 万元、持续 6 年，NPV 随折现率上升而下降，与横轴交点为 IRR（约 17%）；虚线标出折现率 10% 时的 NPV（教学示意，非真实项目）。</div></div>
  <p>冲突出现时以 NPV 为准。IRR 适合作为沟通时的辅助指标，但决定项目取舍的最后一票，应投给能够直接反映价值增量的 NPV。</p>

  <div class="card soft"><div class="card-t">折现率不是拍脑袋</div><p>NPV 对 r 很敏感，而 r 应该来自资金的机会成本与项目风险，不能为了"让项目通过"而随意调低。一个经不起折现率小幅上调检验的项目，本身就说明安全边际不足。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="project-cashflow">
  <div class="chead">
    <span class="chnum">49</span>
    <div class="chead-body">
      <div class="kicker">卷六 · 公司金融　进阶 · 学生</div>
      <h2>项目现金流预测</h2>
      <div class="desc">把会计利润翻译成可用于折现的增量现金流，并处理好口径与不确定性。</div>
    </div>
  </div>
  <div class="path-strip">前置：资本预算与NPV · 现金流量表　|　当前：<b>项目现金流预测</b>　|　延伸：资本成本WACC · 敏感性分析</div>

  <h3>只看增量，不看账面</h3>
  <p>项目现金流预测的第一条原则是只认增量现金流：有这个项目与没有这个项目相比，公司未来的现金会差多少。由此可以推出几条常见排除项。沉没成本是已经花出去、无论是否上项目都收不回的钱，不应计入；分摊的总部管理费用若没有因项目真实增加，也不计入；设备原有用途若被新项目占用，失去的租金或收益属于机会成本，必须计入；项目对现有产品的冲击（侵蚀效应）同样要计入。</p>
  <p>会计利润则不同，它按权责发生制确认，包含折旧等非现金项目。折旧不是现金流出，却会减少利润、进而影响所得税，这个"税盾"要通过税后口径体现，而不是把折旧当作一笔支出直接扣掉。</p>

  <h3>三段式预测</h3>
  <p>实务中把项目现金流拆成三段。初始期：设备购置与安装、营运资本垫支、旧资产处置的税后收入。经营期：每年营业现金流 OCF 等于税后经营利润加回折旧，也可写成（收入−付现成本）×(1−税率)+折旧×税率。终结点：收回营运资本、处置设备的税后残值。假设某制造企业新产线投资 600 万元、寿命 5 年、每年 OCF 约 180 万元、期末收回营运资本与残值合计 80 万元，五年现金流入合计约 980 万元。</p>

  <div class="tbl-scroll"><table><thead><tr><th>阶段</th><th>主要项目</th><th>方向</th></tr></thead><tbody><tr><td>初始期</td><td>设备投资、安装费、营运资本垫支</td><td>现金流出</td></tr><tr><td>经营期</td><td>营业收入、付现成本、所得税、折旧税盾</td><td>每年净流入</td></tr><tr><td>终结点</td><td>营运资本收回、设备税后残值</td><td>现金流入</td></tr></tbody></table></div>

  <div class="defn">
    <p>增量现金流：因接受某项目而直接引起的、未来现金流的变化量，是资本预算的唯一相关口径。</p>
    <p>沉没成本：已经发生且不可收回的支出，与当前决策无关，不应计入项目现金流。</p>
    <p>营运资本：项目运转所需的流动资产减去流动负债，通常在期初垫支、期末收回。</p>
  </div>

  <div class="formula">OCF = EBIT × (1 − T) + 折旧 = (收入 − 付现成本) × (1 − T) + 折旧 × T</div>
  <div class="formula-note">EBIT 为息税前利润，T 为所得税率。折旧本身不是现金支出，加回它是因为它在利润中被扣除；折旧×T 即折旧税盾。假设数据：收入 300 万元、付现成本 150 万元、折旧 60 万元、税率 25%，则 OCF=(300−150)×0.75+60×0.25=127.5 万元。注意本式计算的是经营现金流，若进一步求企业自由现金流 FCFF，还需扣除资本支出与营运资本增加额，二者口径不可混用。</div>

  <h3>口径一致与不确定性</h3>
  <p>名义现金流要用名义折现率，实际现金流要用实际折现率，混用会系统性高估或低估价值。通胀已经体现在收入与成本的上涨里时，就别再在折现率中重复加一次。预测还应做敏感性分析：把售价、销量、成本、寿命分别下调，观察 NPV 如何变化，找出最敏感的变量重点核实。</p>
  <p>与其费心给出一个精确到元的预测，不如诚实地标出假设区间，并说明哪些变量最值得跟踪。现金流预测的价值在于把讨论引到关键假设上，而不是制造确定的错觉。</p>

  <div class="card soft"><div class="card-t">别把折旧当现金流出</div><p>利润表上的折旧减少利润，但钱并没有流出去；真正影响现金的，是折旧带来的少缴税。把折旧误当支出，会系统性低估项目的经营现金流，进而错杀本可行的项目。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="wacc">
  <div class="chead">
    <span class="chnum">50</span>
    <div class="chead-body">
      <div class="kicker">卷六 · 公司金融　进阶 · 学生</div>
      <h2>资本成本WACC</h2>
      <div class="desc">把债务与权益的成本加权成折现率，并搞清它只能配哪一类现金流。</div>
    </div>
  </div>
  <div class="path-strip">前置：公司金融创造价值 · 资本预算与NPV　|　当前：<b>资本成本WACC</b>　|　延伸：资本结构 · 项目风险调整折现率</div>

  <h3>资本成本是资金的机会成本</h3>
  <p>资本成本不是公司实际支付的利息，而是资金提供方要求的回报率，本质上是一种机会成本。债务成本相对容易观察，可以用现有借款利率或同类债券到期收益率估计；由于利息在税前扣除、具有抵税作用，税后债务成本等于税前利率乘以（1−税率）。权益成本没有合同约定的利率，通常用资本资产定价模型估算：无风险利率加上贝塔系数乘以市场风险溢价。</p>
  <p>权重的选择同样重要。应按各类资本的当前市场价值计算，而不是账面价值：账面记录的是历史投入，市场价值才反映今天真实的资金规模。若公司计划改变资本结构，还应使用目标权重，而不是当前权重。</p>

  <h3>WACC 与 FCFF 必须口径匹配</h3>
  <p>把债务与权益按权重加权，就得到加权平均资本成本 WACC。假设甲公司权益市值 600 万元、债务市值 400 万元，权益成本 11.5%、税前债务成本 5.5%、所得税率 25%，则 WACC = 60%×11.5% + 40%×5.5%×75% ≈ 8.5%。这个数字常被用作折现率，但有一个必须遵守的前提：它对应的是企业自由现金流 FCFF，即尚未扣除利息的经营现金流。若折现的是股权自由现金流 FCFE，就应使用权益成本，不能用 WACC，否则会系统性高估股权价值。</p>

  <div class="tbl-scroll"><table><thead><tr><th>资本来源</th><th>市场价值</th><th>个别成本</th><th>税后处理</th></tr></thead><tbody><tr><td>普通股权益</td><td>600 万元</td><td>11.5%（CAPM 估算）</td><td>不抵税</td></tr><tr><td>债务</td><td>400 万元</td><td>5.5%（税前）</td><td>× (1−25%) = 4.125%</td></tr><tr><td>合计</td><td>1000 万元</td><td>WACC ≈ 8.5%</td><td>按市值加权</td></tr></tbody></table></div>

  <div class="defn">
    <p>加权平均资本成本（WACC）：各类资本成本按其市场价值权重加权后的平均值，代表公司现有资产的平均资金成本。</p>
    <p>税后债务成本：税前债务利率扣除利息抵税效应后的成本，等于利率×(1−税率)。</p>
    <p>企业自由现金流（FCFF）：可供全部资本提供者分配的现金流，在利息扣除之前计量。</p>
  </div>

  <div class="formula">WACC = E/V × Re + D/V × Rd × (1 − T)</div>
  <div class="formula-note">E 为权益市值，D 为债务市值，V = E + D，Re 为权益成本，Rd 为税前债务成本，T 为所得税率。假设数据：E=600 万、D=400 万、Re=11.5%、Rd=5.5%、T=25%，WACC≈8.5%。前提与口径：WACC 用于折现企业自由现金流 FCFF；若现金流是股权自由现金流 FCFE（已扣利息与净还款），必须用 Re 折现，二者错配会导致估值偏差。权重宜用市值或目标结构，而非账面价值。</div>

  <h3>曲线告诉我们的边界</h3>
  <p>下图用假设数据展示负债占比与 WACC 的关系：税率 25%、无杠杆权益成本 11.5%、债务成本随杠杆上升而提高。适度负债时，税后债务成本低于权益成本，加权结果下降；负债继续增加，债权人与股东都要求更高回报，两条成本曲线抬头，把 WACC 推回去。图中标注了使 WACC 最低的负债比例，但它只是这一组假设下的结果，不是通用答案。</p>
  <div class="chart-box"><canvas id="waccCurve"></canvas><div class="cap">图注：假设数据，税率 25%、无杠杆权益成本 11.5%、债务成本随负债占比上升；WACC 先降后升，虚线标出该组假设下的最低点（教学示意，非真实公司数据）。</div></div>
  <p>使用 WACC 还要记住两条边界。其一，只有项目风险与公司现有业务相近时才可直接套用，风险明显不同的项目应调整折现率；其二，WACC 不是越低越好——靠高杠杆压低数字的同时，也抬高了财务困境的概率。资本结构的选择，是在税盾收益与风险成本之间权衡。</p>

  <div class="card soft"><div class="card-t">别为了低WACC而盲目加杠杆</div><p>税盾确实能降低债务的税后成本，但随着负债上升，违约风险会推高债务利率与权益成本。把假设数据下的"最优负债率"当成目标照搬，忽略了现金流波动与偿债压力，代价往往在下行周期才显现。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>
`;

<script>
window.__CH_VOL7 = `
<section class="chapter" data-id="central-bank-policy">
  <div class="chead">
    <span class="chnum">60</span>
    <div class="chead-body">
      <div class="kicker">卷七 · 宏观经济　进阶 · 学生</div>
      <h2>央行与货币政策</h2>
      <div class="desc">了解央行如何吞吐货币与引导利率，以及政策从决策走到实体经济要经过哪些环节。</div>
    </div>
  </div>
  <div class="path-strip">前置：通胀与购买力 · 利率基础　|　当前：<b>央行与货币政策</b>　|　延伸：宏观传导到市场 · 经济周期</div>

  <h3>央行为什么存在</h3>
  <p>中央银行是一国金融体系的枢纽，首要目标通常是维持物价稳定，同时兼顾充分就业与金融体系稳定。之所以要把货币发行权集中起来，是因为如果每家银行都能自行决定放款规模，货币数量就会失控，物价与汇率都会失去锚。为杜绝靠印钞弥补赤字、造成恶性通胀，多数国家还赋予央行一定程度的独立性：货币政策决策不受短期政治目标左右，但央行仍须向立法机构说明政策依据，并定期公开决策记录。独立性带来的是时间上的耐心——抑制通胀的紧缩措施往往先压低产出，若由选举周期驱动，政策容易偏松。</p>

  <h3>工具箱：从数量到价格</h3>
  <p>传统上央行有三件主要工具。公开市场操作是在金融市场上买卖证券，直接吞吐基础货币，日常使用最频繁；法定存款准备金率规定商业银行必须缴存的资金比例，调整它会影响银行可贷资金与货币乘数；再贴现与再贷款则是央行对商业银行的资金支持，兼有最后贷款人职能。近年来许多央行更重视价格型工具，通过政策利率引导货币市场利率，再传导到信贷与债券市场。数量型工具影响的是"有多少钱"，价格型工具影响的是"钱有多贵"，二者最终都会作用到借贷成本上。</p>

  <div class="tbl-scroll"><table><thead><tr><th>工具</th><th>基本操作</th><th>直接影响</th></tr></thead><tbody><tr><td>公开市场操作</td><td>买卖证券吞吐基础货币</td><td>银行体系流动性数量</td></tr><tr><td>法定存款准备金率</td><td>调整缴存比例</td><td>可贷资金与货币乘数</td></tr><tr><td>再贴现与再贷款</td><td>向商业银行提供资金</td><td>融资成本与最后流动性支持</td></tr><tr><td>政策利率</td><td>设定利率目标或利率走廊</td><td>货币市场利率乃至信贷利率</td></tr></tbody></table></div>

  <div class="defn">
    <p>法定存款准备金率：商业银行必须将存款的一定比例存放在央行的制度安排，比例越高，可用于放贷的资金越少。</p>
    <p>公开市场操作：央行在金融市场上买卖证券以调节基础货币和市场流动性的日常工具。</p>
    <p>政策利率：央行设定或引导的短期基准利率，是价格型调控的核心信号。</p>
  </div>

  <div class="formula">简化货币乘数 m ≈ 1 ÷ 准备金率；实际利率 ≈ 名义利率 − 通胀率</div>
  <div class="formula-note">第一条中的准备金率是简化模型里的唯一漏损假设，现实中还要考虑现金漏损与超额准备金，乘数会小于 1÷准备金率。假设数据：准备金率 10%，理论乘数约 10，但实际放贷能力还取决于信贷需求。第二条为费雪近似的线性形式，适用于通胀率不太高的情形；假设名义利率 5%、通胀率 2%，实际利率约 3%。名义利率与通胀率的口径须对应同一时期。</div>

  <h3>传导链条与局限</h3>
  <p>政策从央行到实体经济的路径大致是：政策利率变化先影响银行间市场利率，再影响存贷款利率与债券收益率，进而改变企业和家庭的借贷意愿、资产估值与财富感受，最终反映到投资、消费、产出和物价。链条上的每一环都需要时间，因此货币政策存在明显时滞；等到效果显现，经济形势可能已经改变，这也是政策需要预判而非跟随现况的原因。</p>
  <p>还有两个常见局限。一是流动性陷阱：利率已经很低时，增加货币供给未必能刺激借贷，企业和家庭更愿意持币观望。二是预期的作用：如果公众认为政策只是临时举措，长期投资与消费决策就不会轻易改变。理解传导链，有助于把"央行做了什么"和"经济会怎样"分开看待，避免把政策动作直接等同于经济结果。</p>

  <div class="card soft"><div class="card-t">宽松不等于立刻见效</div><p>降息或增加流动性只是改变了资金的价格与数量，能否转化为投资和消费，还取决于信贷需求、企业信心与银行放贷意愿。看到政策落地就断言经济马上转向，往往忽略了传导链上的层层时滞。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>

<section class="chapter" data-id="macro-transmission">
  <div class="chead">
    <span class="chnum">64</span>
    <div class="chead-body">
      <div class="kicker">卷七 · 宏观经济　进阶 · 实操</div>
      <h2>宏观传导到市场</h2>
      <div class="desc">把利率、信贷、汇率等宏观变化拆成可观察的传导链，并建立不靠预测的观察纪律。</div>
    </div>
  </div>
  <div class="path-strip">前置：央行与货币政策 · 经济周期　|　当前：<b>宏观传导到市场</b>　|　延伸：市场结构与定价 · 认知偏差清单</div>

  <h3>四条传导渠道</h3>
  <p>宏观变化进入市场，主要走四条渠道。利率渠道：政策利率上升抬高折现率，现金流越靠后的资产现值下降越多，长久期资产因此更敏感。信贷渠道：银行放贷意愿收缩时，依赖外部融资的企业首当其冲，扩张计划被迫推迟。资产价格渠道：利率与估值互相作用，财富变化反过来影响消费和企业融资条件，形成反馈。汇率渠道：利率差异引导跨境资金流动，影响进出口企业的收入换算与成本结构。四条渠道同时工作，强弱次序随环境而变，很难靠单一指标概括全貌。</p>

  <h3>为什么好消息未必上涨</h3>
  <p>市场价格反映的是预期，而不是事实本身。一项数据公布前，如果市场已经充分预期到增长放缓，那么"放缓"落地时反而可能不再下跌；反过来，超预期的强劲数据也可能因为引发政策收紧担忧而压低估值。实操中真正要问的是：实际值与市场一致预期的差距有多大？这个差距是暂时的波动还是趋势的开始？除了数据本身，还要看政策回应是否改变了此前的假设。把"数据好"直接翻译成"价格涨"，跳过了最关键的一环——预期差。</p>

  <div class="tbl-scroll"><table><thead><tr><th>宏观变量</th><th>传导环节</th><th>观察重点</th></tr></thead><tbody><tr><td>政策利率上行</td><td>折现率提高 → 现值下降</td><td>现金流期限长短</td></tr><tr><td>信贷收缩</td><td>融资可得性下降 → 投资推迟</td><td>企业外部融资依赖度</td></tr><tr><td>汇率变动</td><td>收入换算与成本变化</td><td>进出口占比与负债币种</td></tr><tr><td>通胀超预期</td><td>实际利率与政策预期调整</td><td>名义与实际口径区分</td></tr></tbody></table></div>

  <div class="defn">
    <p>预期差：实际公布值与市场普遍预期之间的差距，是短期价格反应的主要驱动之一。</p>
    <p>久期敏感度：现金流收到时间越晚，其现值对折现率变化越敏感的特性。</p>
    <p>风险溢价：投资者为承担不确定性而要求的、超过无风险利率的额外回报。</p>
  </div>

  <div class="formula">现值对折现率的敏感度：PV = CF ÷ (1 + r)^n</div>
  <div class="formula-note">CF 为第 n 期收到的现金流，r 为折现率，n 为期数。假设数据：一笔 100 元现金流，r 从 5% 升到 6%，若 n=1，现值由约 95.2 元降到约 94.3 元，变动不足 1 元；若 n=20，现值由约 37.7 元降到约 31.2 元，降幅明显更大。前提：单笔现金流、按年复利；该式说明为何长久期项目对利率更敏感，不涉及任何具体资产的价格判断。</div>

  <h3>把观察变成纪律</h3>
  <p>对实操而言，宏观分析的产出不应是一张"该做什么"的清单，而是一套检查习惯。第一，先确认信息是新增的还是已被消化；第二，区分名义变化与实际变化，通胀会扭曲名义数字；第三，关注变化的方向与速度，而不是单期水平的绝对高低；第四，用多个指标交叉验证，避免把相关性当成因果；第五，为判断写下理由与失效条件，便于事后复盘，而不是在记忆里改写当时的逻辑。</p>
  <p>宏观传导从不整齐划一，同一政策对不同行业、不同期限的作用可能相反。接受这种不确定性，把精力放在可验证的观察与可执行的纪律上，比追逐某个"必然受益"的结论更稳妥。宏观分析的真正价值，是让你知道自己在赌什么假设，以及假设被推翻时该怎么做。</p>

  <div class="card soft"><div class="card-t">先问"市场已经知道了吗"</div><p>看到一条宏观新闻，先别急着推演后果，先问它是否已被普遍预期、价格里已经反映了多少。同样的消息，在"超预期"和"符合预期"两种情形下，市场的反应可能完全相反。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>
`;

<section class="chapter" data-id="market-structures">
  <div class="chead">
    <span class="chnum">69</span>
    <div class="chead-body">
      <div class="kicker">卷八 · 微观经济　进阶 · 学生</div>
      <h2>市场结构竞争垄断</h2>
      <div class="desc">用厂商数量、产品差异与进入壁垒区分四类市场，理解定价权从哪里来、到哪里止。</div>
    </div>
  </div>
  <div class="path-strip">前置：供需与弹性 · 成本与利润　|　当前：<b>市场结构竞争垄断</b>　|　延伸：博弈论入门 · 反垄断与监管</div>

  <h3>四个划分维度</h3>
  <p>市场结构（Market Structure）描述一个行业的竞争环境，常用四个维度刻画：卖者数量、产品差异程度、进入壁垒高低、单个厂商的定价能力。数量越少、产品越独特、进入越困难，厂商的定价权就越强。按这四个维度，经济学把市场分为完全竞争、垄断竞争、寡头和完全垄断四类。它们不是彼此割裂的标签，而是一条从"完全被动接受价格"到"高度自主制定价格"的光谱。现实中的行业大多落在光谱中间，讨论市场结构的目的，是找出主导竞争逻辑的那股力量，而不是给行业贴一个僵硬的标签。</p>

  <h3>竞争光谱的两端</h3>
  <p>完全竞争里厂商众多、产品同质、进出自由，单个厂商只能接受市场价格，把产量调整到价格等于边际成本为止，长期经济利润趋近于零。垄断竞争保留了众多厂商和自由进入，但产品有差异，于是厂商对价格有了一点发言权；差异化带来短期利润，也引来模仿，长期利润仍被侵蚀到接近零。餐饮、服装等行业多接近这一类型：门面很多，每家都有自己的卖点，但很难长期维持明显高于同行的定价。</p>

  <div class="tbl-scroll"><table><thead><tr><th>市场结构</th><th>厂商数量</th><th>产品差异</th><th>进入壁垒</th><th>定价权</th></tr></thead><tbody><tr><td>完全竞争</td><td>很多</td><td>同质</td><td>很低</td><td>价格接受者</td></tr><tr><td>垄断竞争</td><td>较多</td><td>有差异</td><td>较低</td><td>有限</td></tr><tr><td>寡头</td><td>少数几家</td><td>差异或同质</td><td>较高</td><td>较强但相互牵制</td></tr><tr><td>完全垄断</td><td>一家</td><td>无相近替代品</td><td>很高</td><td>强，但受需求约束</td></tr></tbody></table></div>

  <div class="defn">
    <p>进入壁垒：阻碍新厂商进入某市场的因素，如规模经济、专利、资金门槛或监管许可。</p>
    <p>边际收益：多卖出一单位产品所带来的总收益增量，在垄断条件下低于产品价格。</p>
    <p>需求价格弹性：需求量对价格变化的敏感程度，弹性越大，厂商的提价空间越小。</p>
  </div>

  <div class="formula">垄断定价的加成关系：(P − MC) ÷ P = −1 ÷ Ed</div>
  <div class="formula-note">P 为价格，MC 为边际成本，Ed 为需求价格弹性（通常为负值，故右侧为正）。该式来自利润最大化条件 MR = MC，其中 MR = P×(1 + 1/Ed)。假设数据：某厂商面临 Ed = −2，则 (P−MC)/P = 0.5，即价格约为边际成本的 2 倍。前提：单一定价、追求利润最大化、需求弹性在该区间稳定；若弹性绝对值较小（需求刚性），加成空间才大，但绝非可以随意涨价。</div>

  <h3>寡头与垄断</h3>
  <p>寡头市场里只有少数几家厂商，彼此高度依赖：一家降价，对手很可能跟进，结果谁也没得到更多份额。这种策略互动使寡头定价更像一场博弈，价格领导、产能承诺、产品差异化都是常见手段；公开串谋形成卡特尔虽有短期好处，但因各方都有偷偷降价的动机而难以维持，多数司法辖区也明确禁止。完全垄断只有一家供给者，需求曲线就是市场需求曲线，利润最大化的产量满足边际收益等于边际成本，再据此确定价格。</p>
  <p>垄断并不等于可以随意涨价。需求弹性、潜在进入者、替代品与监管都会约束定价空间：价格定得太高，会促使买家寻找替代方案，也可能吸引新进入者突破壁垒。反垄断制度与经济利润的吸引力，共同构成了现实中的边界。分析一个行业时，真正有用的问题是：这里的厂商能不能在没有招致对手报复的情况下提价？答案往往比"是不是垄断"更接近竞争的实质。</p>

  <div class="card soft"><div class="card-t">竞争程度决定提价空间</div><p>同样的成本上升，在完全竞争市场里只能自己消化，在有差异化和壁垒的市场里才可能转嫁出去。判断一家企业的定价能力，先看它所在市场的结构，再看它在结构中的位置，顺序不能颠倒。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>
`;

<script>
window.__CH_VOL9 = `
<section class="chapter" data-id="position-stop">
  <div class="chead">
    <span class="chnum">79</span>
    <div class="chead-body">
      <div class="kicker">卷九 · 交易实操　进阶 · 实操</div>
      <h2>仓位与止损</h2>
      <div class="desc">把"能亏多少"变成可计算的风险预算，再用事先写好的规则约束执行。</div>
    </div>
  </div>
  <div class="path-strip">前置：风险与收益 · 资产配置　|　当前：<b>仓位与止损</b>　|　延伸：交易记录与复盘 · 行为金融</div>

  <h3>先定风险预算，再定仓位</h3>
  <p>仓位管理的起点不是看哪个机会更好，而是先回答一个不太舒服的问题：如果判断错了，愿意损失多少？把这个上限写成总资金的一个固定比例，就是风险预算。假设总资金 10 万元，规定单笔最大亏损不超过总资金的 1%，即 1000 元；若按买入价的 8% 设定止损距离，那么每单位仓位的风险是买入价的 8%，可承受的仓位金额约为 1000 ÷ 8% = 1.25 万元，占总资金 12.5%。数字随假设而变，思路是固定的：先确定能亏多少，再反推能承担多大的仓位。</p>
  <p>这个顺序与很多人的直觉相反。常见的做法是先决定买多少，再想"跌了再说"；风险预算则把亏损上限前置，让仓位成为计算结果而不是临场决定。这样一来，即使连续几次判断失误，损失也在可承受范围之内，不会因一次意外而失去继续参与的能力。</p>

  <h3>止损是纪律，不是预测</h3>
  <p>止损线必须在建仓之前写下，否则它会被每一次行情波动重新解释。常见的设定方式有固定比例、关键结构位置和波动幅度三类，各有适用环境，但没有一种能保证在理想价位成交；市场跳空或流动性不足时，实际成交价可能明显偏离止损位，这就是滑点。止损之后价格反弹的情形必然会出现，若因为一次反弹就取消止损，整套风险预算就形同虚设。止损的作用不是证明判断正确，而是在判断错误时限制损失。</p>

  <div class="tbl-scroll"><table><thead><tr><th>环节</th><th>要事先确定的内容</th><th>常见失误</th></tr></thead><tbody><tr><td>风险预算</td><td>单笔可承受亏损占总资金的比例</td><td>先看机会再想风险</td></tr><tr><td>止损设定</td><td>建仓前写下触发条件与距离</td><td>盘中随意下移止损位</td></tr><tr><td>仓位计算</td><td>用风险预算除以单位风险</td><td>凭感觉决定投入多少</td></tr><tr><td>事后复盘</td><td>记录理由、偏离与实际结果</td><td>只记盈亏、不记原因</td></tr></tbody></table></div>

  <div class="defn">
    <p>风险预算：事先确定的、单笔交易所愿意承担的最大亏损额度，通常表示为总资金的一个比例。</p>
    <p>止损：在建仓前设定的退出条件，当价格触及预设水平时按规则离场，用以限制亏损扩大。</p>
    <p>滑点：实际成交价格与预设触发价格之间的差距，在跳空或流动性不足时尤其明显。</p>
  </div>

  <div class="formula">仓位金额 = (总资金 × 单笔风险比例) ÷ 止损幅度；单位数 = 可承受亏损 ÷ 每单位风险额</div>
  <div class="formula-note">止损幅度为设定的亏损距离占买入价的比例，用小数代入；每单位风险额 = 买入价 × 止损幅度。假设数据：总资金 10 万元、单笔风险比例 1%、止损幅度 8%，则可承受亏损 1000 元、仓位金额 1.25 万元（占总资金 12.5%）。前提：按触发价成交、不计交易成本与滑点；实际亏损可能大于计划值，因此风险比例应留出余量。该式只演示风险预算的算法，不涉及任何具体标的或价格判断。</div>

  <h3>组合层面的约束</h3>
  <p>单笔风险控制住之后，还要看整体。多笔仓位若集中在同一个驱动因素上，看似分散实则叠加，相关性会在压力时刻同时上升。因此需要设定总风险敞口上限、单一标的与单一行业的集中度上限，并预留现金缓冲。分批建仓与分批退出能降低一次性择时失误的代价，代价是可能摊薄收益；两者如何取舍，取决于账户规模与执行条件，没有统一答案。</p>
  <p>最后是把执行变成可复盘的习惯：记录每笔交易的建仓理由、止损条件、实际盈亏与偏离原因，定期统计胜率与盈亏比，看看亏损是否主要来自不守规则而不是判断方向。纪律不是靠意志力维持的，而是靠事先写好的规则与事后的复盘维持的。</p>

  <div class="card soft"><div class="card-t">止损线写在建仓之前</div><p>行情平稳时谈止损很容易，真正考验人的是持仓浮亏、心里想着"再等等"的那一刻。把止损条件在冷静时写成规则，执行时就不需要重新说服自己；规则的意义，正是在情绪最响的时候替你做决定。</p></div>

  <div class="bone-note">教学提示：本章数字均为假设数据，仅用于演示计算方法，不构成任何投资建议。</div>
</section>
`;

<section class="chapter" data-id="cognitive-biases">
  <div class="chead">
    <span class="chnum">92</span>
    <div class="chead-body">
      <div class="kicker">卷十一 · 行为金融　进阶 · 实操</div>
      <h2>认知偏差清单</h2>
      <div class="desc">认识那些反复出现的判断错误，并把对策写成可执行的检查流程。</div>
    </div>

  <div class="path-strip">前置：有效市场与异象 · 风险偏好　|　当前：<b>认知偏差清单</b>　|　延伸：决策清单 · 交易记录与复盘</div>

  <h3>偏差是系统的，不是偶然的</h3>
  <p>认知偏差指人在判断与决策时反复出现的系统性偏离。它不是智力问题，也不等于情绪失控，而是大脑为节省精力采用的心理捷径在复杂环境下的副产品。前景理论描述了其中一类典型现象：同样金额，亏损带来的痛苦明显大于等额收益带来的快乐，于是人们在盈利时急于落袋、在亏损时迟迟不愿认赔。既然偏差来自机制而不是疏忽，单靠"下次注意"很难纠正，更有效的办法是把对策写进流程，让检查发生在决策之前，而不是在后悔之后。</p>

  <h3>常见的几类偏差</h3>
  <p>确认偏误让人只搜集支持已有看法的证据，对反例视而不见；锚定效应让最先出现的数字成为后续判断的参照，即使那个数字并无依据；过度自信高估自己的信息优势与预测精度，把运气误认为能力；可得性偏差把容易想起的个案当成普遍规律；羊群效应用他人的行动替代独立判断，在热闹中放弃追问；后见之明让事后回顾时觉得一切早有预兆，从而高估自己的预判能力；沉没成本谬误因为已经投入而不肯停止；处置效应则表现为过早卖出盈利、过久持有亏损。它们经常结伴出现，彼此强化。</p>

  <div class="tbl-scroll"><table><thead><tr><th>偏差</th><th>典型表现</th><th>对应动作</th></tr></thead><tbody><tr><td>确认偏误</td><td>只看支持自己的证据</td><td>主动寻找反例</td></tr><tr><td>锚定效应</td><td>被初始数字牵着走</td><td>独立重算、多参照</td></tr><tr><td>过度自信</td><td>高估预测精度</td><td>写下依据与置信区间</td></tr><tr><td>羊群效应</td><td>跟从多数人的行动</td><td>先问自己的理由是什么</td></tr><tr><td>处置效应</td><td>急卖盈利、久拖亏损</td><td>按事先规则处理，不按浮盈浮亏</td></tr></tbody></table></div>

  <div class="defn">
    <p>认知偏差：在特定情境下反复出现的、偏离理性判断的系统性思维倾向。</p>
    <p>前景理论：描述人们在收益与亏损面前不对称偏好的理论，是行为金融的重要基础。</p>
    <p>损失厌恶：同等金额下，亏损带来的负效用大于收益带来的正效用的现象。</p>
  </div>

  <div class="formula">损失厌恶系数 λ ≈ |亏损的主观痛苦| ÷ |同额收益的主观快乐| ≈ 2</div>
  <div class="formula-note">λ 为前景理论价值函数中亏损段的斜率与收益段斜率之比的实验估计值，常见文献取值约在 2 左右，此处为假设数据，仅用于说明数量级。前提：λ 因人和情境而异，不是精确常数；它解释的是"为什么人们不愿认赔"的倾向，不能直接推导出某个具体决策。</div>

  <h3>把对策写进流程</h3>
  <p>对抗偏差不能靠意志力，要靠可执行的动作。下决策前主动寻找反例，问一句"如果我错了，最可能错在哪里"；把关键假设与失效条件写下来，日后按记录复盘，而不是按记忆改写当时的逻辑；用清单核对是否遗漏了反向证据；对重要决定设置冷静期，把即时冲动与经过考虑的选择分开。这些动作的共同点，是把模糊的自觉变成具体的检查项，让偏差在造成后果之前被拦住。</p>
  <p>需要强调的是，消除偏差既不现实也无必要——心理捷径在多数日常场景里是有用的，事事全盘推演反而无法行动。目标只是在风险高、后果重的决策上多设几道检查，把"我觉得没问题"这种感觉，换成一份可以回看、可以质疑的书面记录。</p>

  <div class="card soft"><div class="card-t">给偏差留一个检查位</div><p>与其记住一长串偏差名字，不如在每次决策前固定问三个问题：我有没有主动找过反面证据？如果错了最可能错在哪？这条理由写下来一年后还站得住吗？把这三个问题做成清单，比记住理论更能改变结果。</p></div>

var CH = {

  flowChart:[800,200], eqBal:[800,260], subjTree:[780,220], voucherTree:[780,250],

  ratioRadar:[800,300], annuityTL:[800,240], bondYield:[800,270], dcfSens:[800,280],

  rebalBand:[800,270], gdpCycle:[800,280], sdShift:[800,280], optPayoff:[800,280],
  prospect:[800,280]
