<div class="readbar" id="readbar"></div>

<div class="layout">

      <div class="teacher">一张地图 · 三类读者 · 100 个节点</div>
      <div class="rule"></div>
      <div class="rule thin"></div>
    </div>

    <button class="sb-kg sb-ov" id="ovBtn" type="button">
      <svg viewBox="0 0 16 16"><path d="M2.5 3.5h4v4h-4zM9.5 3.5h4v2.4h-4zM2.5 9.1h4v3.4h-4zM9.5 7.5h4v5h-4z"/></svg>

    <button class="sb-kg" type="button" data-kg>

    </button>

    <nav class="sb-nav" id="sbnav" aria-label="章节目录"></nav>

    <div class="sb-foot">
      <button type="button" data-open="search" title="搜索（Ctrl K）">
        <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.4"/><path d="M10.3 10.3 14 14"/></svg>搜索
      </button>
      <button type="button" data-open="formula" title="公式手册">
        <svg viewBox="0 0 16 16"><path d="M4 12c1.4 0 1.8-1 2.4-3.6C7 5.4 7.3 3 9 3M5.4 7h4.2M11 9.5c.6-1 1.2-1.3 1.8-.6.5.6.2 1.6-.3 2.4"/></svg>公式
      </button>
      <button type="button" onclick="window.print()" title="打印本章">
        <svg viewBox="0 0 16 16"><path d="M4.5 6V2.5h7V6M4.5 12H2.5V7h11v5h-2M4.5 10h7v4h-7z"/></svg>打印
      </button>
    </div>
  </aside>

  <div class="ov" id="ovOverlay" role="dialog" aria-modal="true" aria-label="学习总览">
    <div class="ov-panel">
      <div class="ov-head">
        <div>
          <div class="ov-kicker">Course Map</div>
          <h2 class="ov-title">学习总览</h2>
          <p class="ov-sub" id="ovSub">12 卷 · 100 节点 · 按入门 / 进阶 / 高阶分层</p>
        </div>
        <button class="ov-close" id="ovClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="ov-body" id="ovBody"></div>
    </div>
  </div>

  <div id="navMask"></div>

  <main class="main" id="main">
    <div class="topbar">
      <div class="crumb">
        <button class="tbtn" id="menuBtn" aria-label="打开目录">
          <svg viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>
        </button>
        <span id="curNum">地图</span>
        <span class="div"></span>
        <span class="now" id="curTitle">从这里开始</span>
      </div>
      <div class="tools">
        <button class="tbtn" type="button" id="homeBtn"><span>首页</span></button>
        <button class="tbtn" type="button" id="ovTopBtn"><span>总览</span></button>
        <button class="tbtn" type="button" data-kg>
          <svg viewBox="0 0 16 16"><circle cx="4" cy="4.4" r="1.6"/><circle cx="12" cy="5.2" r="1.6"/><circle cx="8" cy="12" r="1.6"/><path d="M5.4 5.3 7.1 10.5M10.8 6.3 9 10.7M5.7 4.5h4.6"/></svg><span>知识网</span>
        </button>
        <button class="tbtn" type="button" data-open="search">
          <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.4"/><path d="M10.3 10.3 14 14"/></svg><span>搜索</span><kbd>Ctrl K</kbd>
        </button>
        <button class="tbtn" type="button" data-open="formula">
          <svg viewBox="0 0 16 16"><path d="M4 12c1.4 0 1.8-1 2.4-3.6C7 5.4 7.3 3 9 3M5.4 7h4.2M11 9.5c.6-1 1.2-1.3 1.8-.6.5.6.2 1.6-.3 2.4"/></svg><span>公式</span>
        </button>
        <button class="tbtn" type="button" onclick="window.print()" title="打印本章">
          <svg viewBox="0 0 16 16"><path d="M4.5 6V2.5h7V6M4.5 12H2.5V7h11v5h-2M4.5 10h7v4h-7z"/></svg>
        </button>
      </div>
    </div>

    <section id="home" class="home"></section>
    <div id="chMount"></div>

    <footer class="cfoot" id="cfoot">
      <button id="prevBtn" type="button"><span>上一章</span><em id="prevTitle">—</em></button>
      <button id="nextBtn" class="next" type="button"><span>下一章</span><em id="nextTitle">—</em></button>
    </footer>
  </main>
</div>

<div class="overlay" id="searchOverlay" role="dialog" aria-label="全文搜索">
  <div class="search-panel">
    <div class="search-top">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.4"/><path d="M10.3 10.3 14 14"/></svg>
      <input id="searchInput" type="search" placeholder="搜索章节、术语、公式…" autocomplete="off" spellcheck="false">
      <span class="search-hint">ESC</span>
    </div>
    <div class="search-res" id="searchRes"><div class="search-empty">输入关键词，搜索全部 100 个节点</div></div>
    <div class="search-foot"><span>↑ ↓ 选择</span><span>Enter 跳转</span><span>Esc 关闭</span></div>
  </div>
</div>

<div class="drawer" id="fxDrawer" role="dialog" aria-label="公式手册">
  <div class="drawer-h"><h3>公式手册</h3><button type="button" data-close>关闭 ✕</button></div>
  <div class="drawer-search"><input id="fxSearch" type="search" placeholder="筛选：复利 / 久期 / WACC / 杜邦…" autocomplete="off"></div>
  <div class="drawer-body" id="fxBody"></div>
  <div class="drawer-foot">公式均为教学口径，符号定义以原章节为准</div>
</div>

<button class="totop" id="toTop" type="button" aria-label="回到顶部">↑</button>

<div class="kg-overlay" id="kgOverlay" role="dialog" aria-label="知识点网络">
  <div class="kg-head">
    <div>
      <div class="kg-title">知识点网络</div>
      <div class="kg-sub" id="kgSub">100 个知识点 · 前置关系构成有向图</div>
    </div>
    <div class="kg-head-right">
      <div class="kg-chips" id="kgChips"></div>
      <button class="kg-mode" id="kgMode" type="button">3D 图谱</button>
      <button class="kg-close" id="kgClose" type="button">关闭 ✕</button>
    </div>
  </div>
  <div class="kg-body">
    <aside class="kg-side">
      <div class="kg-search"><input id="kgSearch" type="search" placeholder="搜索知识点…" autocomplete="off"></div>
      <div id="kgList"></div>
    </aside>
    <div class="kg-stage" id="kgStage">
      <canvas id="kg3d"></canvas>
      <svg id="kgSvg" viewBox="0 0 1000 720" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="kg-zoom" id="kgZoom2d">
        <button type="button" data-z="in" aria-label="放大">＋</button>
        <button type="button" data-z="out" aria-label="缩小">－</button>
        <button type="button" data-z="reset" aria-label="重置视图">⟲</button>
        <button type="button" data-z="relayout" aria-label="重新布局">↻</button>
      </div>
      <div class="kg-zoom kg-zoom3" id="kgZoom3d">
        <button type="button" data-k3="rot" aria-label="暂停旋转">⏸</button>
        <button type="button" data-k3="in" aria-label="放大">＋</button>
        <button type="button" data-k3="out" aria-label="缩小">－</button>
        <button type="button" data-k3="reset" aria-label="重置视角">⟲</button>
        <button type="button" data-k3="relayout" aria-label="重新布局">↻</button>
      </div>
      <div class="kg-crumb"><button id="kgBack" type="button">← 返回</button><span id="kgPath"></span></div>
      <div class="kg-hint">拖拽旋转 · 滚轮缩放 · 点击节点</div>
    </div>
    <aside class="kg-detail" id="kgDetail"></aside>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  var html=[window.__CH_VOL1,window.__CH_VOL2,window.__CH_VOL3,window.__CH_VOL4,
            window.__CH_VOL5,window.__CH_VOL6,window.__CH_VOL7,window.__CH_VOL8,
            window.__CH_VOL9,window.__CH_VOL10,window.__CH_VOL11,window.__CH_VOL12]
           .filter(Boolean).join('');
  var mount=document.getElementById('chMount');
  if(!mount) return;
  var tmp=document.createElement('div');
  tmp.innerHTML=html;
  var frag=document.createDocumentFragment();
  while(tmp.firstChild){ frag.appendChild(tmp.firstChild); }
  mount.parentNode.replaceChild(frag, mount);
})();
</script>
